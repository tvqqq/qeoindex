services:
  eod-worker:
    image: qeoindex-eod-worker:local
    build:
      context: ../../../..
      dockerfile: services/eod-worker/Dockerfile
    env_file:
      - /opt/qeoindex/env/eod-worker.env
    environment:
      TZ: Asia/Ho_Chi_Minh
      QEOINDEX_EOD_HISTORY_CONCURRENCY: "2"
    mem_limit: 900m
    cpus: "0.85"
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: node
