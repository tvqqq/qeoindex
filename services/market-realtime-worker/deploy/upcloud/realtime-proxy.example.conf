# Example only. Replace realtime.example.com with the production relay hostname.
# The worker itself remains bound to 127.0.0.1:8787 on the UpCloud host.

server {
    listen 443 ssl http2;
    server_name realtime.example.com;

    # Configure certificate/key through the host's existing TLS automation.
    ssl_certificate     /path/to/fullchain.pem;
    ssl_certificate_key /path/to/privkey.pem;

    access_log /var/log/nginx/qeo-market-realtime.access.log combined;
    error_log  /var/log/nginx/qeo-market-realtime.error.log warn;

    location = /ws {
        proxy_pass http://127.0.0.1:8787/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 45s;
        proxy_send_timeout 10s;
        proxy_buffering off;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:8787/healthz;
        proxy_set_header Host $host;
    }

    location / {
        return 404;
    }
}
