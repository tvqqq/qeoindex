name: QEO 183 GREEN 2
"on":
  push:
    branches:
      - tvq9612/qeo-183-what-changed-today
jobs:
  green:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: tvq9612/qeo-183-what-changed-today
          fetch-depth: 0
      - name: Apply QEO-183 production patch
        shell: bash
        run: |
          printf '%s' \
            '' \
            '' \
            '' \
            '' \
            '' \
            '' \
            '' \
            '' \
            '' \
            '' \
            '' \
            '' \
            '' \
            | base64 -d > /tmp/qeo183-green.py
          python /tmp/qeo183-green.py
      - name: Focused GREEN verification
        shell: bash
        run: node --test tests/market-insight-ui-performance.test.ts
      - name: Commit GREEN and self delete
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/qeo-183-green2.yml
          git add components/insights/market-close-dashboard.tsx modules/research/market-insight/data.ts modules/research/market-insight/session-changes.ts tests/market-insight-layout-regression.test.ts
          git commit -m 'feat(QEO-183): add what changed today strip'
          git push origin HEAD:tvq9612/qeo-183-what-changed-today
