name: QEO-92 Hotfix RED

on:
  push:
    branches:
      - tvq9612/qeo-92-hotfix-1m-chart-stuck
    paths:
      - .github/workflows/qeo92-hotfix-red.yml

permissions:
  contents: write

jobs:
  patch-red-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tvq9612/qeo-92-hotfix-1m-chart-stuck
          fetch-depth: 0
      - name: Add regression assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/stock-tradingview-chart-v2.test.ts')
          s = p.read_text()
          addition = '\n\ntest("StockTradingViewChart cannot trap an empty persisted timeframe behind the loading return", () => {\n  const code = source("components/stock-detail/stock-tradingview-chart.tsx")\n\n  assert.doesNotMatch(code, /if \\(!displayBars\\.length \\|\\| !chartMetrics \\|\\| visibleBars\\.length === 0\\)/)\n  assert.match(code, /Dữ liệu timeframe này chưa sẵn sàng/)\n})\n\ntest("StockTradingViewChart consumes canonical raw 1m from the chart-data API", () => {\n  const code = source("components/stock-detail/stock-tradingview-chart.tsx")\n\n  assert.match(code, /useCanonicalMinuteBars/)\n  assert.match(code, /timeframe === "1m"/)\n  assert.match(code, /\\/api\\/market\\/ohlcv/)\n})\n'
          if 'cannot trap an empty persisted timeframe' not in s:
              p.write_text(s + addition)
          PY
      - name: Commit RED test
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/stock-tradingview-chart-v2.test.ts
          git diff --cached --quiet && exit 0
          git commit -m "test(qeo-92): reproduce persisted 1m chart trap"
          git push origin HEAD:tvq9612/qeo-92-hotfix-1m-chart-stuck
