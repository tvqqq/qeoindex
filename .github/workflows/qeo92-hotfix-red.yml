name: QEO-92 Hotfix RED

on:
  push:
    branches:
      - tvq9612/qeo-92-hotfix-1m-chart-stuck
    paths:
      - .github/workflows/qeo92-hotfix-red.yml

permissions:
  contents: write

jobs:
  refine-red-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tvq9612/qeo-92-hotfix-1m-chart-stuck
          fetch-depth: 0
      - name: Refine canonical minute consumer assertion
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/stock-tradingview-chart-v2.test.ts')
          s = p.read_text()
          old = '  const code = source("components/stock-detail/stock-tradingview-chart.tsx")\n\n  assert.match(code, /useCanonicalMinuteBars/)\n  assert.match(code, /timeframe === "1m"/)\n  assert.match(code, /\\/api\\/market\\/ohlcv/)\n})\n'
          new = '  const code = source("components/stock-detail/stock-tradingview-chart.tsx")\n  const hook = source("components/stock-detail/chart/use-canonical-minute-bars.ts")\n\n  assert.match(code, /useCanonicalMinuteBars/)\n  assert.match(code, /timeframe === "1m"/)\n  assert.match(hook, /\\/api\\/market\\/ohlcv/)\n  assert.match(hook, /resolution=1m/)\n})\n'
          if old not in s:
              raise SystemExit('expected minute consumer assertion not found')
          p.write_text(s.replace(old, new))
          PY
      - name: Commit refined RED test
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/stock-tradingview-chart-v2.test.ts
          git diff --cached --quiet && exit 0
          git commit -m "test(qeo-92): target canonical minute hook boundary"
          git push origin HEAD:tvq9612/qeo-92-hotfix-1m-chart-stuck
