name: Apply orderbook duplicate fix

on:
  push:
    branches:
      - fix/orderbook-duplicate-live-trades
    paths:
      - scripts/apply-orderbook-duplicate-fix.mjs
      - .github/workflows/apply-orderbook-duplicate-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/orderbook-duplicate-live-trades
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply bounded orderbook fix
        run: node scripts/apply-orderbook-duplicate-fix.mjs
      - name: Run focused regression test
        run: node --test --experimental-strip-types tests/orderbook-clustering-cache.test.ts
      - name: Validate diff
        run: git diff --check
      - name: Commit generated production change
        run: |
          if git diff --quiet -- components/orderbook/live-orderbook-panel.tsx; then
            echo "No production change generated"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/orderbook/live-orderbook-panel.tsx
          git commit -m "fix(orderbook): make live stream idempotent"
          git push origin HEAD:fix/orderbook-duplicate-live-trades
