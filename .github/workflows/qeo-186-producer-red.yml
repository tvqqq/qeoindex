name: QEO-186 Producer GREEN

on:
  push:

permissions:
  contents: write

jobs:
  qeo186-producer-green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: python3 .github/scripts/qeo186-producer-green.py
      - run: node --test tests/qeo186-contributor-producer.test.ts
      - run: pnpm test:manifest
      - run: git diff --check
      - name: Commit GREEN implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/_shared/vnindex-contributor-estimator.ts \
                  supabase/functions/_shared/market-close-normalizer-base.ts \
                  supabase/functions/kfsp-rating-sync/index.ts \
                  supabase/functions/market-insight-eod-sync/index.ts \
                  supabase/migrations/20260910193000_qeo186_candidate_price_change_for_index_contributors.sql \
                  components/insights/market-close-dashboard.tsx \
                  modules/shared/supabase/database.types.ts \
                  tests/test-contracts.json
          git commit -m "fix(QEO-186): produce VNINDEX contributor data"
          git push origin HEAD:${GITHUB_REF_NAME}
