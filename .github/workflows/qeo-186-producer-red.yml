name: QEO-186 Producer RED

on:
  push:

jobs:
  qeo186-producer-red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --test tests/qeo186-contributor-producer.test.ts
