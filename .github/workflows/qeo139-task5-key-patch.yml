name: QEO-139 Task 5 Remount Patch

on:
  push:
    branches:
      - "tvq9612/qeo-139-portfolio-riskp3-proper-trade-size-calculator-stop-first"
    paths:
      - ".github/workflows/qeo139-task5-key-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "tvq9612/qeo-139-portfolio-riskp3-proper-trade-size-calculator-stop-first"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Key sizing draft state by portfolio
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("components/portfolio/portfolio-page.tsx")
          source = path.read_text()
          old = '''            <PortfolioCapitalAllocation\n              portfolios={portfolios}\n              activePortfolioId={activePortfolioId ?? ""}\n'''
          new = '''            <PortfolioCapitalAllocation\n              key={activePortfolioId ?? ""}\n              portfolios={portfolios}\n              activePortfolioId={activePortfolioId ?? ""}\n'''
          if source.count(old) != 1:
              raise SystemExit(f"expected one PortfolioCapitalAllocation mount, got {source.count(old)}")
          path.write_text(source.replace(old, new, 1))
          PY
      - name: Task 5 UI contract
        run: node --test tests/portfolio/qeo139-trade-size-ui.test.ts
      - name: TypeScript
        run: pnpm typecheck
      - name: Commit remount fix
        shell: bash
        run: |
          git config user.name "qeoindex-ci"
          git config user.email "qeoindex-ci@users.noreply.github.com"
          git add components/portfolio/portfolio-page.tsx
          git diff --cached --check
          git commit -m "fix(qeo-139): reset sizing draft on portfolio switch"
          git push origin HEAD:tvq9612/qeo-139-portfolio-riskp3-proper-trade-size-calculator-stop-first
