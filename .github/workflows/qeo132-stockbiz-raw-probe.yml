name: QEO-132 StockBiz Raw Basis Probe

on:
  push:
    branches:
      - feat/qeo-129-adjusted-daily-shadow
    paths:
      - .github/workflows/qeo132-stockbiz-raw-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Probe bounded StockBiz VHM raw and adjusted columns
        run: |
          node --input-type=module <<'NODE'
          const dates = ['26/06/2026', '05/08/2026', '17/10/2025']

          function decode(value) {
            return value
              .replace(/&nbsp;/gi, ' ')
              .replace(/&#160;/gi, ' ')
              .replace(/&amp;/gi, '&')
              .replace(/&quot;/gi, '"')
              .replace(/&#39;/gi, "'")
              .replace(/<[^>]+>/g, ' ')
              .replace(/\s+/g, ' ')
              .trim()
          }

          function parseNumber(value) {
            const normalized = String(value).trim().replaceAll('.', '').replace(',', '.')
            const parsed = Number(normalized)
            return Number.isFinite(parsed) ? parsed : null
          }

          function extractRows(html) {
            const rows = []
            for (const match of html.matchAll(/<tr\b[^>]*>([\s\S]*?)<\/tr>/gi)) {
              const cells = [...match[1].matchAll(/<t[dh]\b[^>]*>([\s\S]*?)<\/t[dh]>/gi)].map((cell) => decode(cell[1]))
              if (cells.length < 9 || !/^\d{2}\/\d{2}\/\d{4}$/.test(cells[0] ?? '')) continue
              rows.push({
                date: cells[0],
                open: parseNumber(cells[2]),
                high: parseNumber(cells[3]),
                low: parseNumber(cells[4]),
                close: parseNumber(cells[5]),
                average: parseNumber(cells[6]),
                adjustedClose: parseNumber(cells[7]),
                volume: parseNumber(cells[8]),
              })
            }
            return rows.filter((row) => [row.open,row.high,row.low,row.close,row.adjustedClose,row.volume].every((value) => value !== null))
          }

          const evidence = []
          for (const date of dates) {
            const url = `https://web.stockbiz.vn/Stocks/VHM/LookupQuote.aspx?Date=${encodeURIComponent(date)}`
            const started = Date.now()
            const response = await fetch(url, {
              headers: { Accept: 'text/html,application/xhtml+xml', 'User-Agent': 'Mozilla/5.0 QeoIndex/1.0' },
              signal: AbortSignal.timeout(10000),
            })
            const html = await response.text()
            const rows = response.ok ? extractRows(html) : []
            evidence.push({ date, httpStatus: response.status, latencyMs: Date.now() - started, rows: rows.slice(0, 30) })
          }

          const byDate = new Map()
          for (const page of evidence) {
            for (const row of page.rows) byDate.set(row.date, row)
          }
          const wanted = ['13/10/2025','14/10/2025','15/10/2025','16/10/2025','17/10/2025','26/06/2026','05/08/2026']
          const anchors = wanted.map((date) => byDate.get(date)).filter(Boolean)
          const golden = anchors.filter((row) => row.date.endsWith('/10/2025'))
          console.log(JSON.stringify({
            provider: 'StockBiz',
            pages: evidence.map(({date,httpStatus,latencyMs,rows}) => ({date,httpStatus,latencyMs,rowCount:rows.length})),
            anchors,
            rawGoldenWeek: golden.length === 5 ? { high: Math.max(...golden.map((row) => row.high)), low: Math.min(...golden.map((row) => row.low)), sessions: golden.length } : null,
            adjustedCloseGoldenWeek: golden.length === 5 ? { max: Math.max(...golden.map((row) => row.adjustedClose)), min: Math.min(...golden.map((row) => row.adjustedClose)), sessions: golden.length } : null,
          }))
          NODE

# one-shot trigger 2026-09-07
