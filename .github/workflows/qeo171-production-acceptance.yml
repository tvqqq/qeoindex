name: QEO-171 Production Chart Acceptance

on:
  pull_request:
    paths:
      - "tests/qeo171-production-chart-acceptance-contract.test.ts"
      - "tests/browser/qeo171-stock-chart-production.spec.ts"
      - ".github/workflows/qeo171-production-acceptance.yml"

permissions:
  contents: read

concurrency:
  group: qeo171-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: QEO-171 acceptance harness contract
        run: node --test tests/qeo171-production-chart-acceptance-contract.test.ts

  production-browser:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QEO171_BASE_URL: https://qeoindex.qeoqeo.com
      QEO171_TEST_EMAIL: ${{ secrets.QEO144_TEST_EMAIL }}
      QEO171_TEST_PASSWORD: ${{ secrets.QEO144_TEST_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run authenticated production chart acceptance
        run: pnpm exec playwright test tests/browser/qeo171-stock-chart-production.spec.ts --project=desktop
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qeo171-production-chart-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
