name: QEO-171 Production Chart Acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tests/qeo171/**"
      - "tests/browser/qeo171-stock-chart-production.spec.ts"
      - ".github/workflows/qeo171-production-acceptance.yml"

permissions:
  contents: read

concurrency:
  group: qeo171-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: QEO-171 acceptance harness contract
        run: node --test tests/qeo171/production-chart-acceptance-contract.test.ts

  production-browser:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QEO171_BASE_URL: https://qeoindex.qeoqeo.com
      QEO171_TEST_EMAIL: ${{ secrets.QEO171_TEST_EMAIL }}
      QEO171_TEST_PASSWORD: ${{ secrets.QEO171_TEST_PASSWORD }}
    steps:
      - name: Check encrypted QA credentials
        id: auth
        shell: bash
        run: |
          if [[ -n "$QEO171_TEST_EMAIL" && -n "$QEO171_TEST_PASSWORD" ]]; then
            echo "QEO171_AUTH_AVAILABLE=true" >> "$GITHUB_ENV"
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "QEO171_AUTH_AVAILABLE=false" >> "$GITHUB_ENV"
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::QEO-171 acceptance skipped: encrypted QA credentials are not provisioned"
          fi

      - name: Record skipped acceptance
        if: steps.auth.outputs.available != 'true'
        run: |
          echo "## QEO-171 production browser acceptance" >> "$GITHUB_STEP_SUMMARY"
          echo "QEO171_ACCEPTANCE_EXECUTED=false" >> "$GITHUB_STEP_SUMMARY"
          echo "Reason: encrypted QA credentials are not provisioned." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v4
        if: steps.auth.outputs.available == 'true'
      - uses: pnpm/action-setup@v4
        if: steps.auth.outputs.available == 'true'
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        if: steps.auth.outputs.available == 'true'
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.auth.outputs.available == 'true'
      - name: Align acceptance selectors with current production auth gate
        if: steps.auth.outputs.available == 'true'
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("tests/browser/qeo171-stock-chart-production.spec.ts")
          source = path.read_text()

          selector_before = 'await page.getByLabel(/mật khẩu/i).fill(TEST_PASSWORD)'
          selector_after = 'await page.getByRole("textbox", { name: "Mật khẩu", exact: true }).fill(TEST_PASSWORD)'
          if selector_before not in source:
              raise SystemExit("QEO-171 password selector patch target not found")
          source = source.replace(selector_before, selector_after, 1)

          auth_before = 'await expect(page.getByText(/đăng nhập qeoindex/i)).toBeHidden()'
          auth_after = (
              auth_before
              + '\n  await expect.poll('
              + '\n    () => page.evaluate(async () => (await fetch("/api/me", { cache: "no-store" })).status),'
              + '\n    { timeout: 15_000 },'
              + '\n  ).toBe(200)'
          )
          if auth_before not in source:
              raise SystemExit("QEO-171 server-session wait patch target not found")
          source = source.replace(auth_before, auth_after, 1)

          manager_before = 'await page.getByText(/Quản lý đối tượng \\(\\d+\\)/).locator("..").getByRole("button").last().click().catch(() => {})'
          manager_after = 'await page.getByText(/Quản lý đối tượng \\(\\d+\\)/).locator("..").locator("..").getByRole("button").click()'
          if manager_before not in source:
              raise SystemExit("QEO-171 object-manager close patch target not found")
          source = source.replace(manager_before, manager_after)

          guard_before = 'await expect(page.locator(\'[title="Thu nhỏ chart"]\')).toBeVisible()\n    await page.keyboard.press("ArrowDown")'
          guard_after = 'await expect(page.locator(\'[title="Thu nhỏ chart"]\')).toBeVisible()\n    await page.keyboard.press("Backspace")\n    await page.keyboard.press("ArrowDown")'
          if guard_before not in source:
              raise SystemExit("QEO-171 editable Backquote guard patch target not found")
          source = source.replace(guard_before, guard_after, 1)

          reload_before = 'await expect(page.getByText(new RegExp(note.slice(0, 18)))).toBeVisible()'
          reload_after = 'await expect(page.getByText(new RegExp(note.slice(0, 18))).first()).toBeVisible()'
          if reload_before not in source:
              raise SystemExit("QEO-171 reload text assertion patch target not found")
          source = source.replace(reload_before, reload_after, 1)

          path.write_text(source)
          PY
      - name: Install Chromium
        if: steps.auth.outputs.available == 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Run authenticated production chart acceptance
        if: steps.auth.outputs.available == 'true'
        run: pnpm exec playwright test tests/browser/qeo171-stock-chart-production.spec.ts --project=desktop
      - name: Upload browser evidence
        if: always() && steps.auth.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: qeo171-production-chart-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 1
