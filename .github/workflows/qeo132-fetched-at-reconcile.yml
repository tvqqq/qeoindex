name: QEO-132 Fetched-at Identity Reconcile

on:
  push:
    branches:
      - feat/qeo-132-raw-daily-basis
    paths:
      - '.github/workflows/qeo132-fetched-at-reconcile.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/qeo-132-raw-daily-basis
          fetch-depth: 0
      - name: Reconcile immutable evidence identity
        run: |
          python - <<'PY'
          from pathlib import Path

          migration = Path('supabase/migrations/20260906169000_qeo132_raw_daily_basis.sql')
          text = migration.read_text()
          old = "       or v_evidence.source_price_unit <> v_source_price_unit\n       or v_evidence.fetched_at <> v_fetched_at then"
          new = "       or v_evidence.source_price_unit <> v_source_price_unit then"
          if old not in text:
              raise SystemExit('expected fetched_at replay check not found')
          migration.write_text(text.replace(old, new))

          rehearsal = Path('tests/db/qeo132-raw-daily-persistence.sql')
          text = rehearsal.read_text()
          old = "  select evidence_id into v_first from public.qeo_persist_raw_daily_observation(v_payload, true);\n  select evidence_id into v_replay from public.qeo_persist_raw_daily_observation(v_payload, true);"
          new = "  select evidence_id into v_first from public.qeo_persist_raw_daily_observation(v_payload, true);\n  v_payload := jsonb_set(v_payload, '{fetched_at}', '\"2026-09-08T00:00:00Z\"'::jsonb);\n  select evidence_id into v_replay from public.qeo_persist_raw_daily_observation(v_payload, true);"
          if old not in text:
              raise SystemExit('expected replay block not found')
          rehearsal.write_text(text.replace(old, new))

          helper = Path('.github/workflows/qeo132-fetched-at-reconcile.yml')
          helper.unlink()
          PY
      - name: Commit reconciliation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/migrations/20260906169000_qeo132_raw_daily_basis.sql tests/db/qeo132-raw-daily-persistence.sql .github/workflows/qeo132-fetched-at-reconcile.yml
          git commit -m 'fix(QEO-132): keep fetch time out of evidence identity'
          git push origin HEAD:feat/qeo-132-raw-daily-basis
