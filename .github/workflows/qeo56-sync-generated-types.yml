name: QEO56 Sync Generated Types

on:
  push:
    branches:
      - fix/qeo-56-market-ai-vault-dispatch
    paths:
      - .github/workflows/qeo56-sync-generated-types.yml

permissions:
  contents: write

jobs:
  sync-types:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/qeo-56-market-ai-vault-dispatch
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0
      - run: pnpm install --frozen-lockfile
      - run: supabase start
      - name: Regenerate committed Database types from replayed local schema
        run: supabase gen types typescript --local --schema public > lib/supabase/database.types.ts
      - name: Commit generated type drift only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/supabase/database.types.ts
          if git diff --cached --quiet; then
            echo "No generated type drift"
            exit 0
          fi
          git commit -m "chore(qeo-56): sync generated database types"
          git push origin HEAD:fix/qeo-56-market-ai-vault-dispatch
      - if: always()
        run: supabase stop --no-backup
