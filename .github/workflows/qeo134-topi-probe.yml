name: QEO-134 TOPI Probe

on:
  pull_request:
    paths:
      - "scripts/probes/qeo134-topi-source.mjs"
      - ".github/workflows/qeo134-topi-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover-topi-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Discover public TOPI market-index data contract
        run: node scripts/probes/qeo134-topi-source.mjs | tee qeo134-topi-probe.json
      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qeo134-topi-probe
          path: qeo134-topi-probe.json
          if-no-files-found: warn
