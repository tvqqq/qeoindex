name: admin-ttai-tdd

on:
  push:
    branches:
      - fix/admin-ict-ttai-history

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run admin timezone and TTAI regression tests
        run: node --test tests/root-admin-ui.test.ts
