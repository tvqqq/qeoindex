name: QEO-107 Generated Types Sync

on:
  push:
    branches:
      - "tvq9612/qeo-107-chart-intraday-coverage-bootstrap"
    paths:
      - ".github/workflows/qeo107-types-sync.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "tvq9612/qeo-107-chart-intraday-coverage-bootstrap"
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0
      - run: pnpm install --frozen-lockfile
      - name: Start local Supabase
        run: supabase start
      - name: Replay migrations from zero
        run: pnpm db:replay:verify
      - name: Generate canonical Database types
        run: pnpm db:types:generate
      - name: Commit generated types
        run: |
          git diff --exit-code -- modules/shared/supabase/database.types.ts && {
            echo "Expected generated Database types to change for QEO-107 RPC" >&2
            exit 1
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modules/shared/supabase/database.types.ts
          git commit -m "chore(QEO-107): regenerate Supabase database types"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
