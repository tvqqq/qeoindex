name: QEO-171 Provider Session Fix Sync

on:
  push:
    branches:
      - test/qeo-171-production-chart-acceptance-v2
    paths:
      - .github/workflows/qeo171-sync-provider-service.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/qeo-171-production-chart-acceptance-v2
      - name: Make every closed recovery range session-aware
        run: |
          python -c 'from pathlib import Path; p=Path("modules/market/chart-data/service.ts"); s=p.read_text(); old="    ? normalized.bars.length === 0\n      ? [closedRequestedRange]\n      : missingTradingProviderRanges(closedRequestedRange, coveredRanges)"; new="    ? missingTradingProviderRanges(closedRequestedRange, coveredRanges)"; assert old in s, "QEO-171 zero-storage recovery target not found"; p.write_text(s.replace(old,new,1))'
      - name: Commit production fix
        run: |
          git config user.name "qeoindex-ci"
          git config user.email "qeoindex-ci@users.noreply.github.com"
          git add modules/market/chart-data/service.ts
          git diff --cached --check
          git commit -m "fix(QEO-171): route empty storage through session recovery"
          git push origin HEAD:test/qeo-171-production-chart-acceptance-v2
