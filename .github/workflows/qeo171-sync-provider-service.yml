name: QEO-171 Provider Session Fix Sync

on:
  push:
    branches:
      - test/qeo-171-production-chart-acceptance-v2
    paths:
      - .github/workflows/qeo171-sync-provider-service.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/qeo-171-production-chart-acceptance-v2
      - name: Make every closed recovery range session-aware
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("modules/market/chart-data/service.ts")
          source = path.read_text()
          before = '''  const closedUncoveredRanges = closedRequestedRange && closedRequestedRange.to > closedRequestedRange.from
            ? normalized.bars.length === 0
              ? [closedRequestedRange]
              : missingTradingProviderRanges(closedRequestedRange, coveredRanges)
            : []'''.replace("            ", "")
          after = '''  const closedUncoveredRanges = closedRequestedRange && closedRequestedRange.to > closedRequestedRange.from
            ? missingTradingProviderRanges(closedRequestedRange, coveredRanges)
            : []'''.replace("            ", "")
          if before not in source:
              raise SystemExit("QEO-171 zero-storage recovery target not found")
          path.write_text(source.replace(before, after, 1))
          PY
      - name: Commit production fix
        run: |
          git config user.name "qeoindex-ci"
          git config user.email "qeoindex-ci@users.noreply.github.com"
          git add modules/market/chart-data/service.ts
          git diff --cached --check
          git commit -m "fix(QEO-171): route empty storage through session recovery"
          git push origin HEAD:test/qeo-171-production-chart-acceptance-v2
