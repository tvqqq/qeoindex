name: DB Drift Reconciliation

on:
  pull_request:
    paths:
      - "scripts/db/**"
      - "supabase/migrations/**"
      - "supabase/pending-migrations/**"
      - "supabase/migration-equivalence.json"
      - "docs/db/evidence/production-migration-ledger-*.json"
      - "tests/db-migration-drift.test.ts"
      - "tests/kfsp-rating-storage-refactor.test.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --test tests/db-migration-drift.test.ts tests/kfsp-rating-storage-refactor.test.ts
      - run: node scripts/db/verify-migration-drift.mjs
