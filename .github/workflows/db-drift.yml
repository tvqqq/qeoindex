name: DB Drift Reconciliation

on:
  pull_request:
    paths:
      - ".github/workflows/db-drift.yml"
      - "package.json"
      - "scripts/db/**"
      - "scripts/run-test-suite.mjs"
      - "tests/test-contracts.json"
      # QEO-67 moved the canonical generated Supabase types under modules/shared.
      - "modules/shared/supabase/database.types.ts"
      - "supabase/config.toml"
      - "supabase/migrations/**"
      - "supabase/pending-migrations/**"
      - "supabase/migration-equivalence.json"
      - "docs/db/evidence/production-migration-ledger-*.json"
      - "tests/db-*.test.ts"
      - "tests/kfsp-rating-storage-refactor.test.ts"
      - "tests/orderbook-prune-security.test.ts"
      - "tests/supabase-*.test.ts"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0
      - run: pnpm install --frozen-lockfile
      - name: Verify reviewed migration ledger
        run: node scripts/db/verify-migration-drift.mjs
      - name: Start local Supabase
        run: supabase start
      - name: Replay migrations from zero
        run: pnpm db:replay:verify
      - name: Verify generated Database types
        run: pnpm db:types:verify
      - name: Upload generated Database type candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qeo23-database-types
          path: artifacts/qeo23/database.types.ts
          if-no-files-found: ignore
          retention-days: 3
      - name: One-shot sync generated Database types
        if: failure() && github.head_ref == 'feat/qeo-108-storage-hardening'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          test -f artifacts/qeo23/database.types.ts
          cp artifacts/qeo23/database.types.ts /tmp/qeo108-database.types.ts
          git fetch origin "${HEAD_REF}"
          git checkout "${HEAD_REF}"
          cp /tmp/qeo108-database.types.ts modules/shared/supabase/database.types.ts
          git diff --quiet -- modules/shared/supabase/database.types.ts && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modules/shared/supabase/database.types.ts
          git commit -m "chore(db): refresh generated Supabase types"
          git push origin "HEAD:${HEAD_REF}"
      - name: Run current DB contracts
        run: pnpm test:db
      - name: Compile TypeScript
        run: pnpm typecheck
      - name: Rehearse QEO-108 quarantined chart cutover
        run: bash scripts/db/rehearse-qeo108-chart-storage.sh
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
