name: DB Drift Reconciliation

on:
  pull_request:
    paths:
      - ".github/workflows/db-drift.yml"
      - "package.json"
      - "scripts/db/**"
      - "lib/supabase/database.types.ts"
      - "supabase/config.toml"
      - "supabase/migrations/**"
      - "supabase/pending-migrations/**"
      - "supabase/migration-equivalence.json"
      - "docs/db/evidence/production-migration-ledger-*.json"
      - "tests/db-migration-drift.test.ts"
      - "tests/db-schema-contract.test.ts"
      - "tests/kfsp-rating-storage-refactor.test.ts"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0
      - run: pnpm install --frozen-lockfile
      - name: Verify reviewed migration ledger
        run: node scripts/db/verify-migration-drift.mjs
      - name: Start local Supabase
        run: supabase start
      - name: Replay migrations from zero
        run: pnpm db:replay:verify
      - name: Bootstrap canonical Database types
        run: |
          if [ ! -f lib/supabase/database.types.ts ]; then
            pnpm db:types:generate
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lib/supabase/database.types.ts
            git commit -m "chore(QEO-23): commit generated Supabase Database types"
            git push origin HEAD:${{ github.head_ref }}
            echo "Generated Database types committed to PR branch; rerun on the new head."
            exit 1
          fi
      - name: Verify generated Database types
        run: pnpm db:types:verify
      - name: Upload generated Database type candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qeo23-database-types
          path: artifacts/qeo23/database.types.ts
          if-no-files-found: ignore
          retention-days: 3
      - name: Run DB contract regressions
        run: node --test tests/db-migration-drift.test.ts tests/db-schema-contract.test.ts tests/kfsp-rating-storage-refactor.test.ts
      - name: Compile TypeScript
        run: pnpm typecheck
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
