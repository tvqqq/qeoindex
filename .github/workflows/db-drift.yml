name: DB Drift Reconciliation

on:
  pull_request:
    paths:
      - ".github/workflows/db-drift.yml"
      - "package.json"
      - "scripts/db/**"
      - "scripts/run-test-suite.mjs"
      - "tests/test-contracts.json"
      # QEO-67 moved the canonical generated Supabase types under modules/shared.
      - "modules/shared/supabase/database.types.ts"
      - "supabase/config.toml"
      - "supabase/migrations/**"
      - "supabase/pending-migrations/**"
      - "supabase/migration-equivalence.json"
      - "docs/db/evidence/production-migration-ledger-*.json"
      - "tests/db-*.test.ts"
      - "tests/kfsp-rating-storage-refactor.test.ts"
      - "tests/orderbook-prune-security.test.ts"
      - "tests/supabase-*.test.ts"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0
      - run: pnpm install --frozen-lockfile
      - name: Verify reviewed migration ledger
        run: node scripts/db/verify-migration-drift.mjs
      - name: Start local Supabase
        run: supabase start
      - name: Replay migrations from zero
        run: pnpm db:replay:verify
      - name: Verify generated Database types
        run: pnpm db:types:verify
      - name: Upload generated Database type candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qeo23-database-types
          path: artifacts/qeo23/database.types.ts
          if-no-files-found: ignore
          retention-days: 3
      - name: Commit exact generated Database types for QEO-119
        if: failure() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'tvq9612/qeo-119-production-acceptance-final'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          test -s artifacts/qeo23/database.types.ts
          cp artifacts/qeo23/database.types.ts /tmp/qeo119-database.types.ts
          git fetch origin "$HEAD_REF"
          git switch --force-create "$HEAD_REF" "origin/$HEAD_REF"
          cp /tmp/qeo119-database.types.ts modules/shared/supabase/database.types.ts
          git add modules/shared/supabase/database.types.ts
          if git diff --cached --quiet; then
            echo "Generated Database types already match branch head"
            exit 0
          fi
          git config user.name "qeoindex-db-drift-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "chore(QEO-119): refresh generated database types"
          git push origin "HEAD:$HEAD_REF"
      - name: Run current DB contracts
        run: pnpm test:db
      - name: Compile TypeScript
        run: pnpm typecheck
      - name: Rehearse QEO-108 quarantined chart cutover
        run: bash scripts/db/rehearse-qeo108-chart-storage.sh
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
