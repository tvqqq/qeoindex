name: QEO-67 Metrics

on:
  push:
    branches:
      - qeo-65-67-cleanup-modules

permissions:
  contents: read

jobs:
  metrics:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Prepare baseline and current dependencies
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/qeo67-before 18f2a53b8e170587b7885d7a010f22add1e6ed53
          pnpm install --frozen-lockfile --prefer-offline
          pnpm --dir /tmp/qeo67-before install --frozen-lockfile --prefer-offline
      - name: Source file and LOC metrics
        shell: bash
        run: |
          set -euo pipefail
          count_ref() {
            local label="$1"
            local ref="$2"
            mapfile -t files < <(git ls-tree -r --name-only "$ref" | grep -E '^(app|components|lib|modules|workflows)/.*\.(ts|tsx)$' || true)
            local loc=0
            for file in "${files[@]}"; do
              lines=$(git show "$ref:$file" | wc -l)
              loc=$((loc + lines))
            done
            echo "METRIC|source_files|${label}|${#files[@]}"
            echo "METRIC|source_loc|${label}|${loc}"
          }
          count_ref before 18f2a53b8e170587b7885d7a010f22add1e6ed53
          count_ref after HEAD
      - name: Before timings
        shell: bash
        working-directory: /tmp/qeo67-before
        run: |
          set -euo pipefail
          measure() {
            local name="$1"; shift
            local start end
            start=$(date +%s%3N)
            "$@"
            end=$(date +%s%3N)
            echo "METRIC|${name}|before|$((end-start))"
          }
          measure test_current pnpm test:current
          measure lint_touched pnpm lint:touched
          measure typecheck pnpm typecheck
          measure build pnpm build
      - name: After timings
        shell: bash
        run: |
          set -euo pipefail
          measure() {
            local name="$1"; shift
            local start end
            start=$(date +%s%3N)
            "$@"
            end=$(date +%s%3N)
            echo "METRIC|${name}|after|$((end-start))"
          }
          measure test_current pnpm test:current
          measure lint_touched pnpm lint:touched
          measure typecheck pnpm typecheck
          measure build pnpm build
