name: QEO-23 Regenerate Database Types

on:
  push:
    branches:
      - qeo-19-23-final-db-acceptance
    paths:
      - ".github/workflows/qeo23-regenerate-database-types.yml"

permissions:
  contents: write

jobs:
  regenerate:
    if: github.repository == 'tvqqq/qeoindex'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qeo-19-23-final-db-acceptance
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0
      - run: pnpm install --frozen-lockfile
      - name: Start local Supabase
        run: supabase start
      - name: Replay migrations from zero
        run: pnpm db:replay:verify
      - name: Regenerate committed Database types
        shell: bash
        run: |
          set +e
          pnpm db:types:verify
          first_status=$?
          set -e
          if [ "$first_status" -eq 0 ]; then
            echo "Committed types already match local replay schema"
          else
            test -f artifacts/qeo23/database.types.ts
            cp artifacts/qeo23/database.types.ts lib/supabase/database.types.ts
          fi
          pnpm db:types:verify
          git diff --check
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
      - name: Commit generated types and remove one-off workflow
        shell: bash
        run: |
          rm .github/workflows/qeo23-regenerate-database-types.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/supabase/database.types.ts .github/workflows/qeo23-regenerate-database-types.yml
          git diff --cached --check
          git diff --cached --quiet && { echo "No generated type change to commit"; exit 1; }
          git commit -m "chore(QEO-23): refresh generated database types"
          git push origin HEAD:qeo-19-23-final-db-acceptance
