name: QEO-187 GREEN

on:
  push:
    branches:
      - tvq9612/qeo-187-market-insightsp1-institutional-flow-persistence-1d-5d-20d
    paths:
      - .github/workflows/qeo-187-red.yml

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Apply and commit production patch
        run: node scripts/tmp-qeo187-green.mjs
      - name: Prove focused GREEN
        run: node --test tests/market-insight-ui-performance.test.ts
      - name: TypeScript smoke check
        run: pnpm typecheck
