name: QEO-129 Register Store Contract Once

on:
  push:
    branches:
      - feat/qeo-129-adjusted-daily-shadow
    paths:
      - .github/workflows/qeo129-register-store-test.yml

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Register QEO-129 store contract
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const path = 'tests/test-contracts.json'
          const manifest = JSON.parse(fs.readFileSync(path, 'utf8'))
          const entry = {
            path: 'tests/market-history/qeo129-adjusted-daily-store.test.ts',
            owner: 'market',
            invariant: 'Preserve QEO-129 exact factor-run adjusted Daily persistence, OHLCV readback, and shadow-only rollout contract.',
            bucket: 'canonical',
            suites: ['fast'],
          }
          const index = manifest.entries.findIndex((item) => item.path === entry.path)
          if (index >= 0) manifest.entries[index] = entry
          else manifest.entries.push(entry)
          manifest.entries.sort((a, b) => a.path.localeCompare(b.path))
          fs.writeFileSync(path, `${JSON.stringify(manifest, null, 2)}\n`)
          NODE
      - name: Verify canonical contracts
        run: |
          pnpm test:manifest
          node --test tests/market-history/qeo129-adjusted-daily-store.test.ts tests/market-history/qeo129-adjusted-daily-shadow.test.ts tests/db/qeo129-schema-contract.test.ts
          pnpm typecheck
      - name: Commit registration and remove TDD helpers
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/qeo129-register-store-test.yml .github/workflows/qeo129-task3-red.yml
          git add tests/test-contracts.json
          git commit -m 'test(QEO-129): register persistence contract'
          git push origin HEAD:feat/qeo-129-adjusted-daily-shadow
