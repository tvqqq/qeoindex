name: QEO-67 Finalize v2

on:
  push:
    branches: [qeo-65-67-cleanup-modules]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply behavior-preserving QEO-67 fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -f components/live-market-board-v2.tsx ]; then
            git mv components/live-market-board-v2.tsx components/live-market-board.tsx
          fi

          node <<'NODE'
          const fs = require('fs')
          const path = require('path')

          function walk(root, out = []) {
            if (!fs.existsSync(root)) return out
            const stat = fs.statSync(root)
            if (stat.isFile()) return [root]
            for (const entry of fs.readdirSync(root, { withFileTypes: true })) {
              const full = path.join(root, entry.name)
              if (entry.isDirectory()) walk(full, out)
              else if (/\.(?:ts|tsx|md)$/.test(entry.name)) out.push(full)
            }
            return out
          }

          for (const file of ['app', 'components', 'tests', 'docs/market-board.md'].flatMap((root) => walk(root))) {
            const text = fs.readFileSync(file, 'utf8')
            const next = text
              .replaceAll('live-market-board-v2', 'live-market-board')
              .replaceAll('LiveMarketBoardV2', 'LiveMarketBoard')
            if (next !== text) fs.writeFileSync(file, next)
          }

          const routePath = 'app/api/watchlist/route.ts'
          const serverPath = 'modules/portfolio/watchlist/server.ts'
          if (!fs.existsSync(serverPath)) {
            const route = fs.readFileSync(routePath, 'utf8')
            const server = route
              .replace(/export const runtime = "nodejs"\n/, '')
              .replace(/export const dynamic = "force-dynamic"\n/, '')
              .replace('export async function GET()', 'export async function handleWatchlistGet()')
              .replace('export async function POST(request: Request)', 'export async function handleWatchlistPost(request: Request)')
              .replace('export async function DELETE(request: Request)', 'export async function handleWatchlistDelete(request: Request)')
            fs.mkdirSync(path.dirname(serverPath), { recursive: true })
            fs.writeFileSync(serverPath, `import "server-only"\n\n${server}`)
          }

          fs.writeFileSync(routePath, `import {\n  handleWatchlistDelete,\n  handleWatchlistGet,\n  handleWatchlistPost,\n} from "@/modules/portfolio/watchlist/server"\n\nexport const runtime = "nodejs"\nexport const dynamic = "force-dynamic"\n\nexport const GET = handleWatchlistGet\nexport const POST = handleWatchlistPost\nexport const DELETE = handleWatchlistDelete\n`)

          fs.writeFileSync('modules/portfolio/watchlist/README.md', `# Watchlist module\n\n- \`server.ts\` is the server-only public boundary for watchlist auth, validation, and Supabase CRUD.\n- \`app/api/watchlist/route.ts\` is a thin HTTP adapter over this module.\n- Client components must not import \`server.ts\` directly.\n`)

          const authTestPath = 'tests/auth-api-contract.test.ts'
          let authTest = fs.readFileSync(authTestPath, 'utf8')
          const oldAuthBlock = `  for (const path of ["app/api/me/route.ts", "app/api/watchlist/route.ts"]) {\n    const code = source(path)\n    assert.match(code, /requireApiUser/)\n    assert.match(code, /auth\\.context\\.user\\.id/)\n  }\n\n`
          const newAuthBlock = `  const me = source("app/api/me/route.ts")\n  assert.match(me, /requireApiUser/)\n  assert.match(me, /auth\\.context\\.user\\.id/)\n\n  const watchlistServer = source("modules/portfolio/watchlist/server.ts")\n  assert.match(watchlistServer, /requireApiUser/)\n  assert.match(watchlistServer, /auth\\.context\\.user\\.id/)\n\n  const watchlistRoute = source("app/api/watchlist/route.ts")\n  assert.match(watchlistRoute, /@\\/modules\\/portfolio\\/watchlist\\/server/)\n\n`
          if (!authTest.includes(oldAuthBlock)) throw new Error('auth API contract ownership block not found')
          authTest = authTest.replace(oldAuthBlock, newAuthBlock)
          fs.writeFileSync(authTestPath, authTest)

          const schemaTestPath = 'tests/supabase-auth-schema.test.ts'
          let schemaTest = fs.readFileSync(schemaTestPath, 'utf8')
          const oldSchemaSource = `const watchlistRoute = readFileSync(\n  new URL("../app/api/watchlist/route.ts", import.meta.url),\n  "utf8",\n)\n`
          const newSchemaSource = `const watchlistServer = readFileSync(\n  new URL("../modules/portfolio/watchlist/server.ts", import.meta.url),\n  "utf8",\n)\n`
          if (!schemaTest.includes(oldSchemaSource)) throw new Error('QEO-22 watchlist test source block not found')
          schemaTest = schemaTest.replace(oldSchemaSource, newSchemaSource).replaceAll('watchlistRoute', 'watchlistServer')
          fs.writeFileSync(schemaTestPath, schemaTest)

          const architectureTestPath = 'tests/module-architecture-contract.test.ts'
          fs.writeFileSync(architectureTestPath, `import assert from "node:assert/strict"\nimport { existsSync, readFileSync, readdirSync, statSync } from "node:fs"\nimport path from "node:path"\nimport test from "node:test"\n\nconst ROOT = path.resolve(import.meta.dirname, "..")\nconst PRODUCTION_ROOTS = ["app", "components", "modules", "workflows", "lib"]\n\nfunction filesUnder(relative: string): string[] {\n  const absolute = path.join(ROOT, relative)\n  if (!existsSync(absolute)) return []\n  if (statSync(absolute).isFile()) return [relative.replaceAll("\\\\", "/")]\n  return readdirSync(absolute, { withFileTypes: true }).flatMap((entry) => {\n    const child = path.join(relative, entry.name)\n    if (entry.isDirectory()) return filesUnder(child)\n    return /\\.(?:ts|tsx|js|mjs)$/.test(entry.name) ? [child.replaceAll("\\\\", "/")] : []\n  })\n}\n\nconst productionFiles = PRODUCTION_ROOTS.flatMap(filesUnder)\n\ntest("active production paths do not preserve accidental legacy or version names", () => {\n  const historicalToken = new RegExp("(^|[\\\\/_.-])(legacy|v2|v3)(?=$|[\\\\/_.-])", "i")\n  assert.deepEqual(productionFiles.filter((file) => historicalToken.test(file)), [])\n})\n\ntest("root lib is no longer a production implementation surface", () => {\n  const rootLib = productionFiles.filter((file) => file.startsWith("lib/") && !file.slice(4).includes("/") && (file.endsWith(".ts") || file.endsWith(".tsx")))\n  assert.deepEqual(rootLib, [])\n})\n\ntest("lower-level domains do not depend on EOD or workflow orchestration", () => {\n  const violations: string[] = []\n  for (const file of productionFiles.filter((file) => file.startsWith("modules/"))) {\n    const domain = file.split("/")[1]\n    if (domain === "eod") continue\n    const source = readFileSync(path.join(ROOT, file), "utf8")\n    if (source.includes('"@/modules/eod') || source.includes("'@/modules/eod")) violations.push(file + " -> eod")\n    if (source.includes('"@/workflows') || source.includes("'@/workflows")) violations.push(file + " -> workflows")\n  }\n  assert.deepEqual(violations, [])\n})\n\ntest("current domain contracts expose deliberate stable entrypoints", () => {\n  for (const file of [\n    "modules/eod/index.ts",\n    "modules/eod/README.md",\n    "modules/market/README.md",\n    "modules/market/universe/index.ts",\n    "modules/portfolio/README.md",\n    "modules/portfolio/watchlist/server.ts",\n    "modules/portfolio/watchlist/README.md",\n    "modules/wyckoff/README.md",\n    "modules/ai-council/README.md",\n  ]) assert.equal(existsSync(path.join(ROOT, file)), true, file)\n})\n\ntest("watchlist route is a thin adapter over the portfolio module", () => {\n  const route = readFileSync(path.join(ROOT, "app/api/watchlist/route.ts"), "utf8")\n  assert.equal(route.includes("@/modules/portfolio/watchlist/server"), true)\n  assert.equal(route.includes(".from("), false)\n  assert.equal(route.includes("NextResponse"), false)\n  assert.ok(route.split("\\n").length <= 20)\n})\n\ntest("watchlist server boundary is explicitly server-only", () => {\n  const server = readFileSync(path.join(ROOT, "modules/portfolio/watchlist/server.ts"), "utf8")\n  assert.equal(server.startsWith('import "server-only"'), true)\n})\n\ntest("market board uses the canonical unversioned component name", () => {\n  assert.equal(existsSync(path.join(ROOT, "components/live-market-board.tsx")), true)\n  assert.equal(existsSync(path.join(ROOT, "components/live-market-board-v2.tsx")), false)\n  const board = readFileSync(path.join(ROOT, "components/live-market-board.tsx"), "utf8")\n  assert.equal(board.includes("export function LiveMarketBoard("), true)\n  assert.equal(board.includes("LiveMarketBoardV2"), false)\n})\n`)

          const manifestPath = 'tests/test-contracts.json'
          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'))
          if (!manifest.entries.some((entry) => entry.path === architectureTestPath)) {
            manifest.entries.push({
              path: architectureTestPath,
              owner: 'tooling',
              invariant: 'Preserve QEO-67 domain ownership, unversioned active naming, orchestration direction, deliberate public contracts, server-only boundaries, and thin route adapters.',
              bucket: 'canonical',
              suites: ['fast'],
            })
          }
          manifest.entries.sort((a, b) => a.path.localeCompare(b.path))
          fs.writeFileSync(manifestPath, JSON.stringify(manifest, null, 2) + '\n')
          NODE

      - name: Verify QEO-67 acceptance
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile
          pnpm test:current
          pnpm lint:touched
          pnpm typecheck
          pnpm build
          git diff --check
          echo '=== active versioned paths ==='
          find app components modules workflows lib -type f 2>/dev/null | grep -E '(^|/|[-_.])(legacy|v2|v3)([-_.]|/|$)' && exit 1 || true
          echo '=== root lib implementations ==='
          find lib -maxdepth 1 -type f \( -name '*.ts' -o -name '*.tsx' \) -print 2>/dev/null | grep . && exit 1 || true
          echo 'QEO67_FULL_VERIFICATION_PASS'

      - name: Commit clean verified implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/qeo67-final-audit.yml \
            .github/workflows/qeo67-finalize.yml \
            .github/workflows/qeo67-dependency-diagnostic.yml \
            .github/workflows/qeo67-finalize-v2.yml \
            .github/workflows/qeo65-pending-db-check.yml
          git add -A
          git diff --cached --check
          git commit -m "refactor(QEO-67): finalize module ownership boundaries"
          git push origin HEAD:qeo-65-67-cleanup-modules
