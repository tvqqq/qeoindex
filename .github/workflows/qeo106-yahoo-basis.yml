name: QEO-106 Yahoo adjusted basis

on:
  push:
    branches:
      - fix/qeo-106-vcb-adjusted-basis

permissions:
  contents: write

jobs:
  regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/qeo-106-vcb-adjusted-basis
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Targeted Yahoo adjusted-basis regression
        run: node --test tests/qeo-106-yahoo-adjusted-basis.test.ts
      - name: Register canonical regression
        shell: bash
        run: |
          python <<'PY'
          import json
          from pathlib import Path
          path = Path('tests/test-contracts.json')
          data = json.loads(path.read_text())
          test_path = 'tests/qeo-106-yahoo-adjusted-basis.test.ts'
          if not any(entry.get('path') == test_path for entry in data['entries']):
              data['entries'].append({
                  'path': test_path,
                  'owner': 'market',
                  'invariant': 'Yahoo Daily fallback and persisted repairs must use one adjusted canonical price basis.',
                  'bucket': 'canonical',
                  'suites': ['fast'],
              })
              data['entries'].sort(key=lambda entry: entry['path'])
          path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n')
          PY
      - name: Verify PR gates
        run: pnpm verify:pr
      - name: Production build
        run: pnpm build
      - name: Commit manifest and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/qeo106-yahoo-basis.yml
          git config user.name "qeoindex-qeo106-bot"
          git config user.email "actions@users.noreply.github.com"
          git add tests/test-contracts.json .github/workflows/qeo106-yahoo-basis.yml
          git commit -m "test(QEO-106): register Yahoo adjusted-basis regression"
          git push origin HEAD:fix/qeo-106-vcb-adjusted-basis
