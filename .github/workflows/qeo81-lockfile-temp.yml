name: QEO-81 Lockfile Refresh

on:
  push:
    branches:
      - tvq9612/qeo-81-qeo-79p2-pdf-ingestion-ai-structured-analysis-page-citations
    paths:
      - package.json

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tvq9612/qeo-81-qeo-79p2-pdf-ingestion-ai-structured-analysis-page-citations
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "pnpm-lock.yaml already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore(qeo81): refresh pnpm lockfile"
          git push origin HEAD:tvq9612/qeo-81-qeo-79p2-pdf-ingestion-ai-structured-analysis-page-citations
