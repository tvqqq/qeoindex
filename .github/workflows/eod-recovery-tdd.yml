name: eod-recovery-tdd

on:
  push:
    branches:
      - fix/eod-publish-resume-20260826

permissions:
  contents: read

jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: EOD v2 regression suite
        run: pnpm test:eod-v2
