name: QEO-134 green patch

on:
  push:
    branches:
      - tvq9612/qeo-134-ui-polish

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tvq9612/qeo-134-ui-polish
      - name: Apply approved UI polish
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          health_path = Path('components/insights/market-health-view.tsx')
          health = health_path.read_text()

          old_tooltip = '''function SentimentHistoryTooltip({ active, payload }: { active?: boolean; payload?: Array<{ payload?: { tradingDate?: string; value?: number } }> }) {
  const point = payload?.[0]?.payload
  if (!active || !point || typeof point.value !== "number") return null
  return (
    <div className="rounded-lg border border-white/15 bg-[#08131e] p-2 shadow-xl">
      <p className="font-mono text-[10px] text-slate-400">{point.tradingDate}</p>
      <p className="mt-0.5 font-mono text-sm font-black text-cyan-200">{point.value.toFixed(0)} / 100</p>
    </div>
  )
}
'''
          new_tooltip = '''function getSentimentHistoryLabel(score: number) {
  if (score < 30) return "Sợ hãi cực độ"
  if (score < 45) return "Sợ hãi"
  if (score < 56) return "Trung lập"
  if (score < 71) return "Tham lam"
  return "Tham lam cực độ"
}

function SentimentHistoryTooltip({ active, payload }: { active?: boolean; payload?: Array<{ payload?: { tradingDate?: string; value?: number } }> }) {
  const point = payload?.[0]?.payload
  if (!active || !point || typeof point.value !== "number") return null
  const sentimentLabel = getSentimentHistoryLabel(point.value)
  return (
    <div className="rounded-lg border border-white/15 bg-[#08131e] p-2 shadow-xl">
      <p className="font-mono text-[10px] text-slate-400">{point.tradingDate}</p>
      <div className="mt-1 flex items-center gap-2">
        <span className="rounded bg-amber-300 px-1.5 py-0.5 font-mono text-sm font-black text-slate-950">{point.value.toFixed(0)}</span>
        <span className="text-sm font-semibold text-slate-100">{sentimentLabel}</span>
      </div>
    </div>
  )
}
'''
          assert old_tooltip in health
          health = health.replace(old_tooltip, new_tooltip, 1)

          old_header = '''      <MarketWidgetChildHeader icon={BarChart3} title="Lịch sử chỉ báo tâm lý" description="Diễn biến điểm tâm lý theo thời gian" asOf={data.asOf} quality={data.qualityStatus} />
      <div className="mt-3 flex items-center justify-end gap-2">
        <label htmlFor="market-sentiment-history-range" className="text-xs font-medium text-slate-400">Hiển thị</label>
        <select
          id="market-sentiment-history-range"
          value={rangeDays}
          onChange={(event) => setRangeDays(Number(event.target.value))}
          className="h-8 rounded-md border border-white/10 bg-[#08131e] px-2 font-mono text-xs font-bold text-slate-200 outline-none focus:border-cyan-400/50"
        >
          {SENTIMENT_HISTORY_RANGES.map((range) => <option key={range.days} value={range.days}>{range.label}</option>)}
        </select>
      </div>
'''
          new_header = '''      <MarketWidgetChildHeader
        icon={BarChart3}
        title="Lịch sử chỉ báo tâm lý"
        description="Diễn biến điểm tâm lý theo thời gian"
        asOf={data.asOf}
        quality={data.qualityStatus}
        actions={
          <div className="flex items-center gap-2">
            <label htmlFor="market-sentiment-history-range" className="text-xs font-medium text-slate-400">Hiển thị</label>
            <select
              id="market-sentiment-history-range"
              value={rangeDays}
              onChange={(event) => setRangeDays(Number(event.target.value))}
              className="h-8 rounded-md border border-white/10 bg-[#08131e] px-2 font-mono text-xs font-bold text-slate-200 outline-none focus:border-cyan-400/50"
            >
              {SENTIMENT_HISTORY_RANGES.map((range) => <option key={range.days} value={range.days}>{range.label}</option>)}
            </select>
          </div>
        }
      />
'''
          assert old_header in health
          health = health.replace(old_header, new_header, 1)

          old_chart = '''            <AreaChart data={visibleHistory} margin={{ top: 12, right: 8, left: -24, bottom: 0 }}>
              <defs>
                <linearGradient id="sentimentHistoryGradient" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stopColor="#22d3ee" stopOpacity={0.38} />
                  <stop offset="100%" stopColor="#22d3ee" stopOpacity={0.03} />
                </linearGradient>
              </defs>
              <CartesianGrid stroke={GRID_COLOR} vertical={false} strokeDasharray="3 3" />
              <XAxis dataKey="tradingDate" axisLine={{ stroke: "rgba(255,255,255,0.16)" }} tickLine={false} tick={{ fill: AXIS_COLOR, fontSize: 9, fontFamily: "monospace" }} minTickGap={28} tickFormatter={(value) => String(value).slice(5)} />
              <YAxis domain={[0, 100]} ticks={[0, 30, 45, 56, 71, 100]} axisLine={false} tickLine={false} tick={{ fill: AXIS_COLOR, fontSize: 9, fontFamily: "monospace" }} />
              <ReferenceLine y={30} stroke="rgba(244,63,94,0.4)" strokeDasharray="3 3" />
              <ReferenceLine y={45} stroke="rgba(251,191,36,0.35)" strokeDasharray="3 3" />
              <ReferenceLine y={56} stroke="rgba(148,163,184,0.3)" strokeDasharray="3 3" />
              <ReferenceLine y={71} stroke="rgba(45,212,191,0.35)" strokeDasharray="3 3" />
              <Tooltip content={<SentimentHistoryTooltip />} />
              <Area type="monotone" dataKey="value" stroke="#22d3ee" strokeWidth={2.4} fill="url(#sentimentHistoryGradient)" dot={false} activeDot={{ r: 3.5 }} />
            </AreaChart>
'''
          new_chart = '''            <ComposedChart data={visibleHistory} margin={{ top: 12, right: 8, left: -24, bottom: 0 }}>
              <CartesianGrid stroke={GRID_COLOR} vertical={false} strokeDasharray="3 3" />
              <XAxis dataKey="tradingDate" axisLine={{ stroke: "rgba(255,255,255,0.16)" }} tickLine={false} tick={{ fill: AXIS_COLOR, fontSize: 9, fontFamily: "monospace" }} minTickGap={28} tickFormatter={(value) => String(value).slice(5)} />
              <YAxis domain={[0, 100]} ticks={[0, 30, 45, 56, 71, 100]} axisLine={false} tickLine={false} tick={{ fill: AXIS_COLOR, fontSize: 9, fontFamily: "monospace" }} />
              <ReferenceLine y={30} stroke="rgba(244,63,94,0.4)" strokeDasharray="3 3" />
              <ReferenceLine y={45} stroke="rgba(251,191,36,0.35)" strokeDasharray="3 3" />
              <ReferenceLine y={56} stroke="rgba(148,163,184,0.3)" strokeDasharray="3 3" />
              <ReferenceLine y={71} stroke="rgba(45,212,191,0.35)" strokeDasharray="3 3" />
              <Tooltip content={<SentimentHistoryTooltip />} />
              <Line
                type="monotone"
                dataKey="value"
                stroke="#f8fafc"
                strokeWidth={2.2}
                dot={false}
                activeDot={{ r: 3.5, fill: "#f8fafc" }}
              />
            </ComposedChart>
'''
          assert old_chart in health
          health = health.replace(old_chart, new_chart, 1)
          health_path.write_text(health)

          dashboard_path = Path('components/insights/market-close-dashboard.tsx')
          dashboard = dashboard_path.read_text()
          old_card = '<Card className={cn(surface, "group py-0 transition-colors hover:border-teal-300/20")}>'
          new_card = '<Card className={cn(surface, "group border border-white/[0.12] py-0 transition-colors hover:border-teal-300/30")}>'
          assert old_card in dashboard
          dashboard = dashboard.replace(old_card, new_card, 1)
          assert '<CardContent className="p-3">' in dashboard
          dashboard = dashboard.replace('<CardContent className="p-3">', '<CardContent className="p-4 sm:p-5">', 1)
          dashboard_path.write_text(dashboard)
          PY
      - name: Commit production changes and remove helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/qeo-134-green-patch.yml
          git add components/insights/market-health-view.tsx components/insights/market-close-dashboard.tsx
          git commit -m "fix(QEO-134): polish sentiment history UI"
          git push origin HEAD:tvq9612/qeo-134-ui-polish
