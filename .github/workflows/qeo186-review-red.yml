name: QEO-186 review RED

on:
  push:
    branches:
      - 'tvq9612/qeo-186-market-insightsp0-vnindex-contributors-top-pullers-draggers'
    paths:
      - '.github/workflows/qeo186-review-red.yml'

permissions:
  contents: write

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: tvq9612/qeo-186-market-insightsp0-vnindex-contributors-top-pullers-draggers
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Add missing-evidence regression
        run: node .github/qeo186-review-red.mjs
      - name: Commit regression
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/market-insight-ui-performance.test.ts
          git commit -m "test(QEO-186): fail closed without directional contributor evidence"
          git push
      - name: Confirm RED
        run: |
          set +e
          node --test tests/market-insight-ui-performance.test.ts > /tmp/qeo186-review-red.log 2>&1
          status=$?
          set -e
          cat /tmp/qeo186-review-red.log
          if [ "$status" -eq 0 ]; then
            echo "Expected missing-evidence regression to fail before fix"
            exit 1
          fi
          grep -q "fails closed when same-direction contributor evidence is absent" /tmp/qeo186-review-red.log
      - name: Remove temporary review helpers
        if: always()
        run: |
          git rm -f .github/qeo186-review-red.mjs .github/workflows/qeo186-review-red.yml
          git commit -m "chore(QEO-186): remove review RED helpers"
          git push
