name: QEO-129 RAW Handoff TDD

on:
  push:
    branches:
      - feat/qeo-129-adjusted-daily-shadow
    paths:
      - 'modules/market/history/adjusted-daily-store.ts'
      - 'tests/market-history/qeo129-qeo132-raw-handoff.test.ts'
      - 'tests/market-history/qeo129-adjusted-daily-store.test.ts'
      - '.github/workflows/qeo129-raw-handoff-tdd.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run QEO-129 canonical RAW handoff contracts
        run: >-
          node --test
          tests/market-history/qeo129-qeo132-raw-handoff.test.ts
          tests/market-history/qeo129-adjusted-daily-store.test.ts
      - name: Compile TypeScript
        run: pnpm typecheck
