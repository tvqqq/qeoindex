name: QEO-134 clean temp files
on:
  push:
    branches:
      - tvq9612/qeo-134-sentiment-score-colors
jobs:
  clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: tvq9612/qeo-134-sentiment-score-colors
      - name: Clean and commit
        shell: bash
        run: |
          rm -f .qeo-134-sentiment-colors-verify-trigger .github/workflows/placeholder.yml .github/workflows/qeo-134-clean-temp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore(QEO-134): remove temporary verification files'
          git push origin HEAD:tvq9612/qeo-134-sentiment-score-colors