name: apply-eod-pipeline-hotfix

on:
  push:
    branches:
      - fix/market-close-auth-vault

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply minimal source patch
        run: |
          python - <<'PY'
          from pathlib import Path

          steps_path = Path('lib/qeoindex-eod-workflow-steps.ts')
          steps = steps_path.read_text()

          old_import = 'import { refreshOhlcvHistoryUniverse } from "@/lib/ohlcv-history-store"'
          new_import = '''import {
            refreshOhlcvHistoryBatch,
            type OhlcvUniverseRefreshResult,
          } from "@/lib/ohlcv-history-store"'''
          if old_import in steps:
              steps = steps.replace(old_import, new_import, 1)
          elif 'refreshOhlcvHistoryBatch' not in steps:
              raise SystemExit('OHLCV import shape not found')

          old_secret = '''      const supabaseUrl = process.env.SUPABASE_URL || process.env.NEXT_PUBLIC_SUPABASE_URL || "https://glwhhrmejlonhyorvtzm.supabase.co"
                const syncSecret = process.env.KFSP_SYNC_SECRET || process.env.CRON_SECRET || ""
                const cleanUrl = supabaseUrl.endsWith("/") ? supabaseUrl.slice(0, -1) : supabaseUrl'''
          new_secret = '''      const supabase = requiredSupabase()
                const supabaseUrl = process.env.SUPABASE_URL || process.env.NEXT_PUBLIC_SUPABASE_URL || "https://glwhhrmejlonhyorvtzm.supabase.co"
                const secretResult = await supabase.rpc("qeo_get_market_close_sync_secret")
                const syncSecret = typeof secretResult.data === "string" ? secretResult.data.trim() : ""
                if (secretResult.error || !syncSecret) {
                  throw Object.assign(
                    new Error(`MARKET_CLOSE_COLLECT failed to load dedicated sync secret: ${secretResult.error?.message || "missing secret"}`),
                    { code: "MARKET_CLOSE_COLLECT_FAILED" },
                  )
                }
                const cleanUrl = supabaseUrl.endsWith("/") ? supabaseUrl.slice(0, -1) : supabaseUrl'''
          if old_secret in steps:
              steps = steps.replace(old_secret, new_secret, 1)
          elif 'qeo_get_market_close_sync_secret' not in steps:
              raise SystemExit('market close secret block not found')

          old_fail_open = '''      if (!response.ok || payload.ok === false) {
                const errCode = String(payload.error || `HTTP_${response.status}`)
                return {
                  ok: false,
                  status: "degraded" as const,
                  error: errCode,
                  sessionDate: String(payload.session_date || sessionDate),
                }
              }'''
          new_fail_closed = '''      if (!response.ok || payload.ok === false) {
                const errCode = String(payload.error || `HTTP_${response.status}`)
                throw Object.assign(
                  new Error(`MARKET_CLOSE_COLLECT failed: ${errCode}`),
                  { code: "MARKET_CLOSE_COLLECT_FAILED" },
                )
              }'''
          if old_fail_open in steps:
              steps = steps.replace(old_fail_open, new_fail_closed, 1)
          elif 'new Error(`MARKET_CLOSE_COLLECT failed: ${errCode}`)' not in steps:
              raise SystemExit('market close fail-open block not found')

          start = steps.find('export async function runHistoryRefreshStep(')
          end = steps.find('export async function runWyckoffBuildStep(', start)
          if start >= 0 and end > start:
              replacement = '''function mergeHistoryRefreshProgress(
            previous: OhlcvUniverseRefreshResult,
            current: OhlcvUniverseRefreshResult,
          ): OhlcvUniverseRefreshResult {
            return {
              requestedTickers: previous.requestedTickers + current.requestedTickers,
              completedTickers: previous.completedTickers + current.completedTickers,
              failedTickers: previous.failedTickers + current.failedTickers,
              dailyFetchedBars: previous.dailyFetchedBars + current.dailyFetchedBars,
              hourlyFetchedBars: previous.hourlyFetchedBars + current.hourlyFetchedBars,
              backfillOperations: previous.backfillOperations + current.backfillOperations,
              deltaOperations: previous.deltaOperations + current.deltaOperations,
              limitedCoverage: [...previous.limitedCoverage, ...current.limitedCoverage],
              errors: [...previous.errors, ...current.errors],
            }
          }

          export async function runHistoryRefreshBatchStep(
            runId: string,
            stocks: WyckoffV2UniverseRow[],
            startedAtIso: string,
            progress: OhlcvUniverseRefreshResult,
            enabled = true,
          ) {
            "use step"
            if (!enabled) {
              await markQeoIndexEodPhaseSkipped({ runId, phaseKey: "HISTORY_REFRESH", reason: "Existing Notion run does not require history refresh." })
              return progress
            }
            return runQeoIndexEodPhase({
              runId,
              phaseKey: "HISTORY_REFRESH",
              fn: async () => {
                if (stocks.length < 1 || stocks.length > 10) {
                  throw Object.assign(new Error(`HISTORY_REFRESH batch must contain 1-10 tickers; received ${stocks.length}`), { code: "HISTORY_REFRESH_FAILED" })
                }
                const result = await refreshOhlcvHistoryBatch(requiredSupabase(), stocks.map((stock) => stock.ticker), new Date(startedAtIso))
                if (result.failedTickers > 0) {
                  throw Object.assign(new Error(`HISTORY_REFRESH failed for ${result.failedTickers} ticker(s): ${result.errors.slice(0, 5).map((item) => `${item.ticker}: ${item.error}`).join(" | ")}`), { code: "HISTORY_REFRESH_FAILED" })
                }
                if (result.completedTickers !== result.requestedTickers) {
                  throw Object.assign(new Error(`HISTORY_REFRESH batch completed ${result.completedTickers}/${result.requestedTickers} tickers`), { code: "HISTORY_REFRESH_FAILED" })
                }
                return mergeHistoryRefreshProgress(progress, result)
              },
              summarize: (result) => ({
                requestedTickers: result.requestedTickers,
                completedTickers: result.completedTickers,
                dailyFetchedBars: result.dailyFetchedBars,
                hourlyFetchedBars: result.hourlyFetchedBars,
                backfillOperations: result.backfillOperations,
                deltaOperations: result.deltaOperations,
                limitedCoverageCount: result.limitedCoverage.length,
              }),
            })
          }

          '''
              steps = steps[:start] + replacement + steps[end:]
          elif 'runHistoryRefreshBatchStep' not in steps:
              raise SystemExit('history refresh step block not found')

          steps_path.write_text(steps)

          workflow_path = Path('workflows/qeoindex-eod-pipeline.ts')
          workflow = workflow_path.read_text()
          workflow = workflow.replace('  runHistoryRefreshStep,', '  runHistoryRefreshBatchStep,', 1)
          if 'import type { OhlcvUniverseRefreshResult } from "@/lib/ohlcv-history-store"' not in workflow:
              workflow = workflow.replace('import { sleep } from "workflow"\n', 'import { sleep } from "workflow"\n\nimport type { OhlcvUniverseRefreshResult } from "@/lib/ohlcv-history-store"\n', 1)

          old_history = '    const history = await runHistoryRefreshStep(runId, ready.stocks, startedAtIso, shouldBuild)'
          new_history = '''    let history: OhlcvUniverseRefreshResult = {
                requestedTickers: 0,
                completedTickers: 0,
                failedTickers: 0,
                dailyFetchedBars: 0,
                hourlyFetchedBars: 0,
                backfillOperations: 0,
                deltaOperations: 0,
                limitedCoverage: [],
                errors: [],
              }
              if (shouldBuild) {
                for (let offset = 0; offset < ready.stocks.length; offset += 10) {
                  history = await runHistoryRefreshBatchStep(
                    runId,
                    ready.stocks.slice(offset, offset + 10),
                    startedAtIso,
                    history,
                    true,
                  )
                }
                if (history.completedTickers !== 100 || history.requestedTickers !== 100) {
                  throw new Error(`HISTORY_REFRESH completed ${history.completedTickers}/${history.requestedTickers} tickers; expected 100/100`)
                }
              } else {
                history = await runHistoryRefreshBatchStep(runId, [], startedAtIso, history, false)
              }'''
          if old_history in workflow:
              workflow = workflow.replace(old_history, new_history, 1)
          elif 'for (let offset = 0; offset < ready.stocks.length; offset += 10)' not in workflow:
              raise SystemExit('workflow history call not found')
          workflow_path.write_text(workflow)
          PY
      - name: Targeted EOD v2 tests
        run: pnpm test:eod-v2
      - name: Typecheck
        run: pnpm typecheck
      - name: Commit source hotfix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/qeoindex-eod-workflow-steps.ts workflows/qeoindex-eod-pipeline.ts
          if git diff --cached --quiet; then
            echo 'Source already patched.'
            exit 0
          fi
          git commit -m 'fix: fail closed market close and batch history durably'
          git push
