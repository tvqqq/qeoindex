name: Apply orderbook parser signature fix

on:
  push:
    branches:
      - fix/orderbook-dnse-live-behavior

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/orderbook-dnse-live-behavior
          fetch-depth: 0
      - name: Apply TypeScript signature fix
        run: python3 .github/patches/fix_orderbook_parser_signature.py
      - name: Commit fix and remove temporary tooling
        run: |
          rm -f .github/patches/fix_orderbook_parser_signature.py
          rm -f .github/workflows/apply-orderbook-signature-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: correct orderbook trade parser signature"
          git push origin HEAD:fix/orderbook-dnse-live-behavior
