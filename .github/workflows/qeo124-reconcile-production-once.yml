name: QEO-124 Reconcile Production Once

on:
  push:
    branches:
      - feat/qeo-124-adjustment-engine
    paths:
      - .github/workflows/qeo124-reconcile-production-once.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/qeo-124-adjustment-engine
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Reconcile reviewed production migration evidence
        run: |
          node <<'NODE'
          const fs = require('fs')

          const ledgerPath = 'docs/db/evidence/production-migration-ledger-2026-09-06.json'
          const ledger = JSON.parse(fs.readFileSync(ledgerPath, 'utf8'))
          const qeo124Ledger = { version: '20260906155227', name: 'qeo124_adjustment_factor_runs' }
          const byLedgerKey = new Map(ledger.migrations.map((row) => [`${row.version}:${row.name}`, row]))
          byLedgerKey.set(`${qeo124Ledger.version}:${qeo124Ledger.name}`, qeo124Ledger)
          ledger.migrations = [...byLedgerKey.values()].sort((a, b) => a.version.localeCompare(b.version) || a.name.localeCompare(b.name))
          ledger.capturedAt = new Date().toISOString()
          ledger.reviewScope = 'QEO-119, QEO-123 and QEO-124 reviewed production migration reconciliation; all promoted migration sets are included in the canonical ledger.'
          fs.writeFileSync(ledgerPath, JSON.stringify(ledger, null, 2) + '\n')

          const equivalencePath = 'supabase/migration-equivalence.json'
          const equivalence = JSON.parse(fs.readFileSync(equivalencePath, 'utf8'))
          const qeo124 = {
            logicalName: 'qeo124_adjustment_factor_runs',
            repositoryVersion: '20260906165000',
            productionVersion: '20260906155227',
            state: 'MAPPED',
            evidence: 'qeo124-production-ledger-schema-rls-rpc-and-rollback-smoke',
            rationale: 'QEO-124 versioned adjustment-factor storage and service-role persistence RPC were promoted only after synced-main preprod zero-to-latest replay, deterministic contracts, TypeScript and VSDC discovery passed. Production readback verified both private RLS-enabled tables, service-role-only SELECT/EXECUTE boundaries and SECURITY DEFINER persistence; rollback-only smoke proved exact replay idempotency, blocked-run isolation, active-run immutability and zero residual fixture rows. Production timestamp differs from repository replay ordering.'
          }
          const byLogicalName = new Map(equivalence.migrations.map((row) => [row.logicalName, row]))
          byLogicalName.set(qeo124.logicalName, qeo124)
          equivalence.migrations = [...byLogicalName.values()]
          fs.writeFileSync(equivalencePath, JSON.stringify(equivalence, null, 2) + '\n')
          NODE
      - name: Commit reconciliation and remove one-shot helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/qeo124-reconcile-production-once.yml
          git add docs/db/evidence/production-migration-ledger-2026-09-06.json supabase/migration-equivalence.json
          git commit -m "chore(QEO-124): reconcile production migration"
          git push origin HEAD:feat/qeo-124-adjustment-engine
