name: QEO-105 Sync Generated Types

on:
  push:
    branches:
      - "fix/qeo-105-universe-bootstrap"
    paths:
      - ".github/workflows/qeo105-sync-types.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/qeo-105-universe-bootstrap
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0
      - run: pnpm install --frozen-lockfile
      - run: supabase start
      - run: pnpm db:replay:verify
      - name: Regenerate committed Database types
        run: supabase gen types typescript --local --schema public > modules/shared/supabase/database.types.ts
      - name: Commit generated type candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modules/shared/supabase/database.types.ts
          if git diff --cached --quiet; then
            echo "Generated Database types are already current."
          else
            git commit -m "chore(QEO-105): regenerate Supabase database types"
            git push origin HEAD:fix/qeo-105-universe-bootstrap
          fi
      - if: always()
        run: supabase stop --no-backup
