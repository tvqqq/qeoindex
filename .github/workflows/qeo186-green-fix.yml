name: QEO-186 GREEN fix

on:
  push:
    branches:
      - 'tvq9612/qeo-186-market-insightsp0-vnindex-contributors-top-pullers-draggers'
    paths:
      - '.github/workflows/qeo186-green-fix.yml'

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: tvq9612/qeo-186-market-insightsp0-vnindex-contributors-top-pullers-draggers
          fetch-depth: 0
      - name: Add accessible contributor summary label
        run: perl -0pi -e 's#<div data-vnindex-contributors className="mt-5">#<div data-vnindex-contributors aria-label="Đóng góp VNINDEX · Top 5 / Top 10" className="mt-5">#' components/insights/market-close-dashboard.tsx
      - name: Commit render contract fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/insights/market-close-dashboard.tsx
          git commit -m "fix(QEO-186): expose contributor summary semantics"
          git push
      - name: Confirm focused GREEN contracts
        run: node --test tests/market-insight-ui-performance.test.ts
      - name: Remove temporary workflow
        if: always()
        run: |
          git rm -f .github/workflows/qeo186-green-fix.yml
          git commit -m "chore(QEO-186): remove GREEN verification helper"
          git push
