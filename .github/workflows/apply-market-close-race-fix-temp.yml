name: Apply market-close race fix

on:
  push:
    branches:
      - fix/market-close-sector-breadth-race

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/market-close-sector-breadth-race
          fetch-depth: 0

      - name: Patch collector and diagnostics ordering
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('supabase/functions/market-insight-eod-sync/index.ts')
          source = path.read_text()

          old = '''    const cleanupAndResolve = () => {
              if (!resolved) {
                resolved = true
                if (socket) {
                  try {
                    socket.disconnect()
                  } catch {}
                }
                resolve(results)
              }
            }

            const timer = setTimeout(cleanupAndResolve, SOCKET_TIMEOUT_MS)
          '''
          new = '''    const cleanupAndResolve = () => {
              if (!resolved) {
                resolved = true
                if (socket) {
                  try {
                    socket.disconnect()
                  } catch {}
                }
                resolve(results)
              }
            }

            const needsLive = topTickers.length > 0
            const maybeResolve = () => {
              if (
                results.maBreadth &&
                results.risk &&
                results.psychology &&
                results.sectorPulse &&
                results.sectorBreadth &&
                (!needsLive || results.getLive)
              ) {
                cleanupAndResolve()
              }
            }

            const timer = setTimeout(cleanupAndResolve, SOCKET_TIMEOUT_MS)
          '''
          if old not in source:
              raise SystemExit('collector anchor not found')
          source = source.replace(old, new, 1)

          replacements = [
              ('results.maBreadth = res\n        })', 'results.maBreadth = res\n          maybeResolve()\n        })'),
              ('results.risk = res\n        })', 'results.risk = res\n          maybeResolve()\n        })'),
              ('results.psychology = res\n        })', 'results.psychology = res\n          maybeResolve()\n        })'),
              ('results.sectorPulse = res\n          const sectorNames', 'results.sectorPulse = res\n          maybeResolve()\n          const sectorNames'),
              ('results.sectorBreadth = bRes\n            })', 'results.sectorBreadth = bRes\n              maybeResolve()\n            })'),
              ('results.getLive = res\n          })', 'results.getLive = res\n            maybeResolve()\n          })'),
          ]
          for before, after in replacements:
              if before not in source:
                  raise SystemExit(f'callback anchor not found: {before}')
              source = source.replace(before, after, 1)

          premature = '        setTimeout(cleanupAndResolve, 3000)\n'
          if premature not in source:
              raise SystemExit('premature timeout anchor not found')
          source = source.replace(premature, '', 1)

          metadata = '''    // Persist collection diagnostics before the fail-closed gate so provider drift is observable.
            await supabase.from("market_insight_sync_runs").update({
              source_observed_at: asOfIso,
              endpoint_coverage: normalized.endpoint_coverage,
              staged_counts: normalized.staged_counts,
              quality_status: normalized.quality_status,
            }).eq("id", syncRunId)

          '''
          validation_anchor = '    const validation = validateMarketCloseSnapshot(normalized)\n'
          if validation_anchor not in source:
              raise SystemExit('validation anchor not found')
          source = source.replace(validation_anchor, metadata + validation_anchor, 1)

          old_metadata = '''    // Persist pre-publish sync run metadata (coverage, staged counts, quality)
            await supabase.from("market_insight_sync_runs").update({
              source_observed_at: asOfIso,
              endpoint_coverage: normalized.endpoint_coverage,
              staged_counts: normalized.staged_counts,
              quality_status: normalized.quality_status,
            }).eq("id", syncRunId)

          '''
          if old_metadata not in source:
              raise SystemExit('old metadata block not found')
          source = source.replace(old_metadata, '', 1)

          path.write_text(source)
          PY

      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/market-insight-eod-sync/index.ts
          git commit -m "fix: keep sector breadth callback alive"
          git push origin HEAD:fix/market-close-sector-breadth-race
