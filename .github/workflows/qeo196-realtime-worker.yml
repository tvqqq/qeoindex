name: QEO-196 Realtime Worker

on:
  pull_request:
    paths:
      - "services/market-realtime-worker/**"
      - "tests/dnse-request-windows.test.ts"
      - ".github/workflows/qeo196-realtime-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-worker:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache-dependency-path: services/market-realtime-worker/go.sum
      - name: Unit tests
        working-directory: services/market-realtime-worker
        run: go test ./...
      - name: Vet
        working-directory: services/market-realtime-worker
        run: go vet ./...
      - name: Build worker binary
        working-directory: services/market-realtime-worker
        run: CGO_ENABLED=0 go build -trimpath -o /tmp/market-realtime-worker ./cmd/market-realtime-worker
      - name: Build production container
        run: docker build -t qeoindex-market-realtime-worker:ci services/market-realtime-worker

  repo-typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
          run_install: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: TypeScript with annotations
        shell: bash
        run: |
          set +e
          output="$(pnpm typecheck 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          while IFS= read -r line; do
            if [[ "$line" =~ ^(.+)\(([0-9]+),([0-9]+)\):[[:space:]]error[[:space:]]TS[0-9]+: ]]; then
              file="${BASH_REMATCH[1]}"
              row="${BASH_REMATCH[2]}"
              col="${BASH_REMATCH[3]}"
              safe="${line//'%'/'%25'}"
              safe="${safe//$'\r'/'%0D'}"
              safe="${safe//$'\n'/'%0A'}"
              echo "::error file=${file},line=${row},col=${col}::${safe}"
            fi
          done <<< "$output"
          exit "$status"
