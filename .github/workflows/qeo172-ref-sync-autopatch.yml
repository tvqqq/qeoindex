name: QEO-172 Ref Sync Autopatch

on:
  push:
    branches:
      - perf/qeo172-reuse-chart-instance

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[qeo172-ref-sync]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/qeo172-reuse-chart-instance
          fetch-depth: 0
      - name: Move timeframe ref sync out of render
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('components/stock-detail/stock-tradingview-chart.tsx')
          source = path.read_text()

          old = '''  const renderedTimeframeRef = useRef<ChartTimeframe | null>(null)\n  const timeframeRef = useRef(timeframe)\n  timeframeRef.current = timeframe\n  const visibleRangeRef = useRef<{ from: number; to: number } | null>(null)'''
          new = '''  const renderedTimeframeRef = useRef<ChartTimeframe | null>(null)\n  const timeframeRef = useRef(timeframe)\n  const visibleRangeRef = useRef<{ from: number; to: number } | null>(null)'''
          if source.count(old) != 1:
              raise SystemExit(f'expected one render-time ref block, got {source.count(old)}')
          source = source.replace(old, new, 1)

          anchor = '''  const [isRsiCollapsed, setIsRsiCollapsed] = useState(false)\n  const [isMacdCollapsed, setIsMacdCollapsed] = useState(false)\n\n  useEffect(() => {\n    if (drawingSyncStatus !== "ready") return'''
          replacement = '''  const [isRsiCollapsed, setIsRsiCollapsed] = useState(false)\n  const [isMacdCollapsed, setIsMacdCollapsed] = useState(false)\n\n  useEffect(() => {\n    timeframeRef.current = timeframe\n  }, [timeframe])\n\n  useEffect(() => {\n    if (drawingSyncStatus !== "ready") return'''
          if source.count(anchor) != 1:
              raise SystemExit(f'expected one effect insertion anchor, got {source.count(anchor)}')
          source = source.replace(anchor, replacement, 1)
          path.write_text(source)
          PY
          git diff --check
      - name: Commit lint-safe ref sync
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/stock-detail/stock-tradingview-chart.tsx
          git commit -m 'fix(QEO-172): sync timeframe ref in effect [qeo172-ref-sync]'
          git push origin HEAD:perf/qeo172-reuse-chart-instance
