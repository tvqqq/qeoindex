name: QEO-129 Adjusted Daily Contract

on:
  push:
    branches:
      - feat/qeo-129-adjusted-daily-shadow
    paths:
      - .github/workflows/qeo129-task2-red.yml
      - tests/market-history/qeo129-adjusted-daily-shadow.test.ts
      - modules/market/history/adjusted-daily.ts

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run QEO-129 adjusted Daily contract
        run: node --test tests/market-history/qeo129-adjusted-daily-shadow.test.ts
      - name: Compile TypeScript
        run: pnpm typecheck
