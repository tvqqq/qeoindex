name: phase2-ci

on:
  push:
    branches:
      - feat/eod-pipeline-admin-phases

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Targeted OHLCV contract tests
        run: node --test tests/root-admin-schema.test.ts tests/ohlcv-history-store.test.ts
