name: QEO-231

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "modules/market/chart-data/storage-audit.ts"
      - "modules/market/chart-data/storage-audit-server.ts"
      - "app/api/qeoindex/chart-storage-audit/route.ts"
      - "tests/qeo-231-chart-storage-audit.cases.ts"
      - ".github/workflows/qeo-231.yml"
  push:
    branches: [main]
    paths:
      - "modules/market/chart-data/storage-audit.ts"
      - "modules/market/chart-data/storage-audit-server.ts"
      - "app/api/qeoindex/chart-storage-audit/route.ts"
      - "tests/qeo-231-chart-storage-audit.cases.ts"
      - ".github/workflows/qeo-231.yml"

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --test tests/qeo-231-chart-storage-audit.cases.ts
