name: notion-staging-tdd-temp

on:
  push:
    branches:
      - fix/notion-staging-durable-batches

permissions:
  contents: read

jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Production verification gate
        run: pnpm verify:build
      - name: Typecheck
        run: pnpm typecheck
