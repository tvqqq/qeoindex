name: QEO-143 Legacy Migration

on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "modules/portfolio/**"
      - "app/api/portfolio/**"
      - "components/portfolio/**"
      - "tests/portfolio/qeo137-legacy-transactions-context.test.ts"
      - "tests/portfolio/qeo143-*.test.ts"
      - "tests/portfolio/qeo143-*.sql"
      - "scripts/db/verify-qeo143-legacy-migration.sh"
      - ".github/workflows/qeo143-preprod.yml"

permissions:
  contents: write

concurrency:
  group: qeo143-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  postgres-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0
      - run: pnpm install --frozen-lockfile
      - name: QEO-143 schema contract
        run: node --test tests/portfolio/qeo143-legacy-migration-schema.test.ts
      - name: Existing Portfolio AVCO regression
        run: node --test tests/portfolio-pnl.test.ts
      - name: Start local Supabase
        run: supabase start
      - name: Replay migrations from zero
        run: pnpm db:replay:verify
      - name: QEO-143 Postgres migration integration
        run: bash scripts/db/verify-qeo143-legacy-migration.sh
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup

  domain-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: QEO-143 migrated Trade completeness
        run: node --test tests/portfolio/qeo143-read-model-completeness.test.ts
      - name: QEO-143 Scorecard eligibility boundary
        run: node --test tests/portfolio/qeo143-performance-eligibility.test.ts
      - name: QEO-143 legacy server context
        run: node --test tests/portfolio/qeo137-legacy-transactions-context.test.ts
      - name: QEO-143 legacy journal UI
        run: node --test tests/portfolio/qeo143-legacy-ui.test.ts
