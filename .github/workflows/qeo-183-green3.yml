name: QEO 183 GREEN 3
"on":
  push:
    branches:
      - tvq9612/qeo-183-what-changed-today
jobs:
  green:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: tvq9612/qeo-183-what-changed-today
          fetch-depth: 0
      - name: Reapply production patch from prior helper
        shell: bash
        run: |
          awk '
            /- name: Apply QEO-183 production patch/ { capture=1; next }
            /- name: Focused GREEN verification/ { capture=0 }
            capture {
              if ($0 ~ /^        run: \|/) next
              sub(/^          /, "")
              print
            }
          ' .github/workflows/qeo-183-green2.yml > /tmp/qeo183-apply.sh
          bash /tmp/qeo183-apply.sh
      - name: Put the placement marker at the render site
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('components/insights/market-close-dashboard.tsx')
          s = p.read_text()
          old = '<MarketSessionChangesStrip changes={sessionChanges} />'
          new = '<div data-market-session-changes><MarketSessionChangesStrip changes={sessionChanges} /></div>'
          if old not in s:
              raise SystemExit('missing session changes render call')
          s = s.replace(old, new, 1)
          s = s.replace('<div data-market-session-changes className="mt-4 rounded-2xl', '<div className="mt-4 rounded-2xl', 1)
          p.write_text(s)
          PY
      - name: Focused GREEN verification
        shell: bash
        run: node --test tests/market-insight-ui-performance.test.ts
      - name: Commit GREEN and self delete
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/qeo-183-green2.yml .github/workflows/qeo-183-green3.yml
          git add components/insights/market-close-dashboard.tsx modules/research/market-insight/data.ts modules/research/market-insight/session-changes.ts tests/market-insight-layout-regression.test.ts
          git commit -m 'feat(QEO-183): add what changed today strip'
          git push origin HEAD:tvq9612/qeo-183-what-changed-today
