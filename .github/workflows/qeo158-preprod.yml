name: QEO-158 External Cash Flows

on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "modules/portfolio/**"
      - "modules/shared/supabase/database.types.ts"
      - "app/api/portfolio/**"
      - "components/portfolio/**"
      - "tests/portfolio/qeo158-*.test.ts"
      - ".github/workflows/qeo158-preprod.yml"

permissions:
  contents: write

concurrency:
  group: qeo158-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  schema-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: QEO-158 cash-flow schema contract
        run: node --test tests/portfolio/qeo158-cash-flow-schema.test.ts

  postgres-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0
      - run: pnpm install --frozen-lockfile
      - name: Start local Supabase
        run: supabase start
      - name: Replay migrations from zero
        run: pnpm db:replay:verify
      - name: Generate Database type candidate
        run: supabase gen types typescript --local > /tmp/database.types.ts
      - name: Compare generated Database types
        id: generated_types
        continue-on-error: true
        run: diff -u modules/shared/supabase/database.types.ts /tmp/database.types.ts
      - name: Upload generated Database type candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qeo158-database-types
          path: /tmp/database.types.ts
          retention-days: 3
      - name: Sync generated Database types to feature branch
        if: steps.generated_types.outcome == 'failure'
        env:
          QEO_HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          candidate="/tmp/database.types.ts"
          test -f "$candidate"
          git fetch origin "$QEO_HEAD_REF"
          rm -rf /tmp/qeo158-head
          git worktree add --detach /tmp/qeo158-head FETCH_HEAD
          cp "$candidate" /tmp/qeo158-head/modules/shared/supabase/database.types.ts
          cd /tmp/qeo158-head
          if git diff --quiet -- modules/shared/supabase/database.types.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modules/shared/supabase/database.types.ts
          git commit -m "chore(db): regenerate Supabase types for QEO-158"
          git push origin HEAD:"$QEO_HEAD_REF"
      - name: Require committed generated types
        if: steps.generated_types.outcome == 'failure'
        run: |
          echo "Generated Supabase Database types were synchronized; rerun on the new commit is required."
          exit 1
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
