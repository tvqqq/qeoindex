name: Patch Insights shadcn chart polish

on:
  push:
    branches:
      - feat/insights-shadcn-chart-polish

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/insights-shadcn-chart-polish
      - name: Patch overview layout and rating chart
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('components/insights/insights-dashboard.tsx')
          source = path.read_text()

          lucide_end = '} from "lucide-react"\n'
          if 'from "recharts"' not in source:
              source = source.replace(lucide_end, lucide_end + 'import { Area, AreaChart, CartesianGrid, XAxis, YAxis } from "recharts"\n', 1)

          tooltip_import = 'import { Tooltip, TooltipContent, TooltipTrigger } from "@/components/ui/tooltip"\n'
          chart_import = 'import { ChartContainer, ChartTooltip, ChartTooltipContent, type ChartConfig } from "@/components/ui/chart"\n'
          if chart_import not in source:
              source = source.replace(tooltip_import, chart_import + tooltip_import, 1)

          pattern = re.compile(r'function RatingHistoryChart\(\{ row \}: \{ row: InsightsRatingRow \}\) \{.*?\n\}\n\nfunction RatingDialog', re.S)
          replacement = '''function RatingHistoryChart({ row }: { row: InsightsRatingRow }) {
  const history = [...row.scoreHistory].sort((a, b) => a.asOfDate.localeCompare(b.asOfDate)).filter((item) => item.ratingScore != null)
  if (history.length < 2) return <div className="rounded-xl border border-white/[0.07] bg-[#091321] p-4 text-xs text-muted-2"><LineChart className="mr-2 inline size-4 text-violet-300" />Lịch sử sẽ tự mở rộng sau các snapshot cron tiếp theo; hiện chưa đủ 2 mốc để vẽ đường điểm.</div>
  const data = history.map((item) => ({ date: item.asOfDate, rating: item.ratingScore }))
  const chartConfig = { rating: { label: "Composite Rating", color: "#a78bfa" } } satisfies ChartConfig
  return (
    <div className="rounded-xl border border-white/[0.07] bg-[#07111f] p-4">
      <div className="flex items-center justify-between">
        <h4 className="font-extrabold text-white text-sm">Rating theo thời gian</h4>
        <span className="text-xs text-muted-2">{history.length} snapshot thực</span>
      </div>
      <ChartContainer config={chartConfig} className="mt-3 h-48 w-full aspect-auto">
        <AreaChart accessibilityLayer data={data} margin={{ top: 10, right: 10, bottom: 0, left: 0 }}>
          <CartesianGrid vertical={false} strokeDasharray="3 3" />
          <XAxis dataKey="date" tickLine={false} axisLine={false} tickMargin={9} minTickGap={24} tickFormatter={(value) => String(value).slice(5)} />
          <YAxis domain={[0, 100]} tickLine={false} axisLine={false} tickMargin={8} width={28} />
          <ChartTooltip cursor={{ stroke: "rgba(148,163,184,.24)", strokeDasharray: "4 4" }} content={<ChartTooltipContent indicator="line" labelFormatter={(value) => String(value)} />} />
          <Area type="natural" dataKey="rating" fill="var(--color-rating)" fillOpacity={0.14} stroke="var(--color-rating)" strokeWidth={2.5} dot={{ r: 3, fill: "#34d399", stroke: "#07111f", strokeWidth: 2 }} activeDot={{ r: 5, fill: "#a78bfa", stroke: "#fff", strokeWidth: 1.5 }} />
        </AreaChart>
      </ChartContainer>
    </div>
  )
}

function RatingDialog'''
          source, count = pattern.subn(replacement, source, count=1)
          if count != 1:
              raise SystemExit(f'RatingHistoryChart replacement count={count}')

          old_left = '''                <div className="xl:col-span-8">
                  <RatingRadar row={row} />
                </div>'''
          new_left = '''                <div className="space-y-4 xl:col-span-8">
                  <RatingRadar row={row} />
                  <AccumulationHeatmap row={row} />
                </div>'''
          if old_left not in source:
              raise SystemExit('overview left column block not found')
          source = source.replace(old_left, new_left, 1)

          standalone = '\n              <AccumulationHeatmap row={row} />\n'
          first = source.find(standalone, source.find('id="rating-panel-overview"'))
          if first < 0:
              raise SystemExit('standalone heatmap not found')
          source = source[:first] + '\n' + source[first + len(standalone):]

          path.write_text(source)
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/insights/insights-dashboard.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat(insights): align overview charts with shadcn style"
          git push origin HEAD:feat/insights-shadcn-chart-polish

# one-shot workflow; delete after patch lands
