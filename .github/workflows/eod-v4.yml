name: EOD v4

on:
  pull_request:
    paths:
      - "workflows/qeoindex-eod-*.ts"
      - "lib/qeoindex-eod-*.ts"
      - "lib/admin/job-phase*.ts"
      - "lib/admin/job-phases.ts"
      - "lib/admin/effective-job-catalog.ts"
      - "lib/admin/job-schedule.ts"
      - "lib/admin/scheduler-reconciliation.ts"
      - "lib/wyckoff-v2-*.ts"
      - "app/api/admin/qeoindex/eod/**"
      - "supabase/migrations/**"
      - "tests/eod-*.test.ts"
      - "tests/qeoindex-eod-*.test.ts"
      - "tests/scheduler-reconciliation.test.ts"
      - "tests/test-contracts.json"
      - "scripts/run-test-suite.mjs"
      - ".github/workflows/eod-v4.yml"
  push:
    branches: [main]
    paths:
      - "workflows/qeoindex-eod-*.ts"
      - "lib/qeoindex-eod-*.ts"
      - "lib/admin/job-phase*.ts"
      - "lib/admin/job-phases.ts"
      - "lib/admin/effective-job-catalog.ts"
      - "lib/admin/job-schedule.ts"
      - "lib/admin/scheduler-reconciliation.ts"
      - "lib/wyckoff-v2-*.ts"
      - "app/api/admin/qeoindex/eod/**"
      - "supabase/migrations/**"
      - "tests/eod-*.test.ts"
      - "tests/qeoindex-eod-*.test.ts"
      - "tests/scheduler-reconciliation.test.ts"
      - "tests/test-contracts.json"
      - "scripts/run-test-suite.mjs"
      - ".github/workflows/eod-v4.yml"

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:eod
