name: QEO-91-94 UI Follow-up Once

on:
  push:
    branches:
      - "tmp/qeo-91-94-ui-followup-codemod"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply patch script
        run: python scripts/qeo-91-94-ui-followup-once.py
      - name: Commit bounded patch and remove temporary automation
        shell: bash
        run: |
          git rm .github/workflows/qeo-91-94-ui-followup-once.yml scripts/qeo-91-94-ui-followup-once.py
          git config user.name "qeoindex-bot"
          git config user.email "actions@users.noreply.github.com"
          git add components/stock-detail/stock-tradingview-chart.tsx components/stock-detail/chart/stock-chart-terminal-shell.module.css components/stock-detail/chart/stock-chart-indicator-modal.tsx tests/stock-chart-interaction.test.ts
          git commit -m "fix(QEO-91,QEO-94): refine chart interaction and controls"
          git push origin HEAD:tmp/qeo-91-94-ui-followup-codemod
