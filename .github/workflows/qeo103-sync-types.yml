name: QEO-103 Sync DB Types

on:
  push:
    branches:
      - qeo-103-derived-hourly-cache
    paths:
      - ".github/workflows/qeo103-sync-types.yml"

permissions:
  contents: write

jobs:
  sync-types:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qeo-103-derived-hourly-cache
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0
      - run: pnpm install --frozen-lockfile
      - name: Start local Supabase
        run: supabase start
      - name: Replay migrations from zero
        run: pnpm db:replay:verify
      - name: Generate canonical Database types
        run: pnpm db:types:generate
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
      - name: Commit generated types and remove one-shot workflow
        run: |
          rm .github/workflows/qeo103-sync-types.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modules/shared/supabase/database.types.ts .github/workflows/qeo103-sync-types.yml
          git diff --cached --quiet && exit 0
          git commit -m "chore(QEO-103): sync generated database types"
          git push origin HEAD:qeo-103-derived-hourly-cache
