name: QEO-124 Register Tests Once

on:
  push:
    branches:
      - feat/qeo-124-adjustment-engine
    paths:
      - ".github/workflows/qeo124-register-tests-once.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/qeo-124-adjustment-engine
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Register QEO-124 test contracts
        run: |
          node <<'NODE'
          const fs = require('fs')
          const path = 'tests/test-contracts.json'
          const doc = JSON.parse(fs.readFileSync(path, 'utf8'))
          const desired = [
            {
              path: 'tests/corporate-actions/qeo124-adjustment-engine.test.ts',
              owner: 'market',
              invariant: 'QEO-124 keeps corporate-action adjustment formulas deterministic, action-type-specific, order-independent, and fail-closed.',
              bucket: 'canonical',
              suites: ['fast'],
            },
            {
              path: 'tests/corporate-actions/qeo124-factor-schema.test.ts',
              owner: 'db',
              invariant: 'QEO-124 preserves versioned factor-run storage, one combined transition per effective session, and private RLS-protected derived state.',
              bucket: 'deep-safety',
              suites: ['db'],
            },
            {
              path: 'tests/corporate-actions/qeo124-lineage-policy.test.ts',
              owner: 'market',
              invariant: 'QEO-124 factor identity stays stable when only audit as-of date advances and no new effective evidence enters the lineage.',
              bucket: 'canonical',
              suites: ['fast'],
            },
            {
              path: 'tests/corporate-actions/qeo124-factor-store.test.ts',
              owner: 'db',
              invariant: 'QEO-124 accepts persisted factor candidates only after exact run and transition readback and sanitizes persistence failures.',
              bucket: 'deep-safety',
              suites: ['db'],
            },
            {
              path: 'tests/qeo-124-monetary-unit.test.ts',
              owner: 'market',
              invariant: 'QEO-124 converts canonical corporate-action monetary terms in VND onto the canonical Daily kilo-VND price scale before factor arithmetic.',
              bucket: 'canonical',
              suites: ['fast'],
            },
            {
              path: 'tests/qeo-124-lineage-portability.test.ts',
              owner: 'market',
              invariant: 'QEO-124 factor lineage is stable across databases when canonical source facts are identical but generated corporate-action UUIDs differ.',
              bucket: 'canonical',
              suites: ['fast'],
            },
          ]
          const byPath = new Map(doc.entries.map((entry) => [entry.path, entry]))
          for (const entry of desired) byPath.set(entry.path, entry)
          doc.entries = [...byPath.values()].sort((a, b) => a.path.localeCompare(b.path))
          fs.writeFileSync(path, JSON.stringify(doc, null, 2) + '\n')
          NODE
      - name: Align formula fixtures with canonical VND terms
        run: |
          node <<'NODE'
          const fs = require('fs')
          const path = 'tests/corporate-actions/qeo124-adjustment-engine.test.ts'
          let text = fs.readFileSync(path, 'utf8')
          const replacements = [
            [/cashPerShare: 100\b/g, 'cashPerShare: 100_000'],
            [/cashPerShare: 20\b/g, 'cashPerShare: 20_000'],
            [/cashPerShare: 11\b/g, 'cashPerShare: 11_000'],
            [/cashPerShare: 10\b/g, 'cashPerShare: 10_000'],
            [/subscriptionPrice: 60\b/g, 'subscriptionPrice: 60_000'],
            [/cashPerShare: 0\.1\b/g, 'cashPerShare: 100'],
            [/cashPerShare: 0\.2\b/g, 'cashPerShare: 200'],
            [/cashPerShare: 0\.3\b/g, 'cashPerShare: 300'],
          ]
          for (const [pattern, replacement] of replacements) text = text.replace(pattern, replacement)
          fs.writeFileSync(path, text)
          NODE
      - name: Verify QEO-124 focused contracts
        run: node --test tests/qeo-124-monetary-unit.test.ts tests/qeo-124-lineage-portability.test.ts tests/corporate-actions/qeo124-adjustment-engine.test.ts
      - name: Commit manifest and fixture alignment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test-contracts.json tests/corporate-actions/qeo124-adjustment-engine.test.ts
          if git diff --cached --quiet; then
            echo "QEO-124 contracts already synchronized"
            exit 0
          fi
          git commit -m "test(QEO-124): register portable lineage contract"
          git push origin HEAD:feat/qeo-124-adjustment-engine
