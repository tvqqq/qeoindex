name: eod-ready-regression

on:
  push:
    branches:
      - fix/eod-ready-1445-cutoff

permissions:
  contents: write

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply exact cutoff fix when needed
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('lib/qeoindex-eod-workflow-steps.ts')
          text = path.read_text()
          old = 'T07:50:00.000Z'
          new = 'T07:45:00.000Z'
          if old in text:
              if text.count(old) != 1:
                  raise SystemExit(f'expected exactly one {old}, found {text.count(old)}')
              path.write_text(text.replace(old, new))
          elif new not in text:
              raise SystemExit('neither expected cutoff found')
          PY
      - run: node --test tests/eod-ready-cutoff-regression.test.ts
      - name: Commit verified source fix
        run: |
          if git diff --quiet -- lib/qeoindex-eod-workflow-steps.ts; then
            echo 'Cutoff already fixed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/qeoindex-eod-workflow-steps.ts
          git commit -m 'fix: align EOD readiness with 14:45 close sync'
          git push
