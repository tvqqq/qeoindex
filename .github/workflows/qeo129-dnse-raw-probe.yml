name: QEO-129 VCI Raw Basis Probe

on:
  push:
    branches:
      - feat/qeo-129-adjusted-daily-shadow
    paths:
      - .github/workflows/qeo129-dnse-raw-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Probe VCI native ONE_DAY VHM anchors
        run: |
          node --input-type=module <<'NODE'
          const endpoint = 'https://trading.vietcap.com.vn/api/chart/OHLCChart/gap-chart'
          const now = new Date('2026-08-07T23:59:59.000Z')
          const to = Math.floor(now.getTime() / 1000)
          const response = await fetch(endpoint, {
            method: 'POST',
            headers: {
              Accept: 'application/json, text/plain, */*',
              'Accept-Encoding': 'identity',
              'Content-Type': 'application/json',
              Origin: 'https://trading.vietcap.com.vn',
              Referer: 'https://trading.vietcap.com.vn/',
              'User-Agent': 'Mozilla/5.0 QeoIndex/1.0',
            },
            body: JSON.stringify({ timeFrame: 'ONE_DAY', symbols: ['VHM'], to, countBack: 400 }),
            signal: AbortSignal.timeout(8000),
          })
          if (!response.ok) {
            console.log(JSON.stringify({ provider:'VCI', usable:false, httpStatus:response.status }))
            process.exit(2)
          }
          const payload = await response.json()
          const vectors = Array.isArray(payload) ? payload : Array.isArray(payload?.data) ? payload.data : []
          const vector = vectors.find((item) => String(item?.symbol ?? '').trim().toUpperCase() === 'VHM') ?? vectors[0]
          if (!vector || !Array.isArray(vector.t)) {
            console.log(JSON.stringify({ provider:'VCI', usable:false, reason:'MISSING_VECTOR' }))
            process.exit(3)
          }
          const fields = ['t','o','h','l','c','v']
          if (fields.some((field) => !Array.isArray(vector[field]) || vector[field].length !== vector.t.length)) {
            console.log(JSON.stringify({ provider:'VCI', usable:false, reason:'MISALIGNED_VECTORS' }))
            process.exit(4)
          }
          function vnDate(seconds) {
            const parts = new Intl.DateTimeFormat('en-CA', { timeZone:'Asia/Ho_Chi_Minh', year:'numeric', month:'2-digit', day:'2-digit' }).formatToParts(new Date(Number(seconds) * 1000))
            const get = (type) => parts.find((part) => part.type === type)?.value ?? ''
            return `${get('year')}-${get('month')}-${get('day')}`
          }
          const bars = vector.t.map((time, index) => ({
            date: vnDate(time),
            open: Number(vector.o[index]) / 1000,
            high: Number(vector.h[index]) / 1000,
            low: Number(vector.l[index]) / 1000,
            close: Number(vector.c[index]) / 1000,
            volume: Number(vector.v[index]),
          })).filter((bar) => Object.values(bar).every((value) => typeof value === 'string' || Number.isFinite(value)))
          const wanted = new Set(['2025-10-13','2025-10-14','2025-10-15','2025-10-16','2025-10-17','2026-06-26','2026-08-05'])
          const anchors = bars.filter((bar) => wanted.has(bar.date)).sort((a,b) => a.date.localeCompare(b.date))
          const golden = anchors.filter((bar) => bar.date.startsWith('2025-10-'))
          console.log(JSON.stringify({
            provider:'VCI', usable:true, timeFrame:'ONE_DAY', barCount:bars.length,
            anchors,
            goldenWeek: golden.length ? { high:Math.max(...golden.map((bar)=>bar.high)), low:Math.min(...golden.map((bar)=>bar.low)), sessions:golden.length } : null,
          }))
          NODE
