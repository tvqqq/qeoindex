name: QEO-129 TitanLabs Final Basis Probe

on:
  push:
    branches:
      - feat/qeo-129-adjusted-daily-shadow
    paths:
      - .github/workflows/qeo129-dnse-raw-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Probe TitanLabs VHM Daily anchors
        run: |
          node --input-type=module <<'NODE'
          const url = new URL('https://www.titanlabs.vn/api/charts/series')
          url.searchParams.set('symbol', 'VHM')
          const response = await fetch(url, {
            headers: { Accept:'application/json', 'User-Agent':'Mozilla/5.0 QeoIndex/1.0' },
            signal: AbortSignal.timeout(10000),
          })
          const text = await response.text()
          if (!response.ok) {
            console.log(JSON.stringify({ provider:'TitanLabs', usable:false, httpStatus:response.status }))
            process.exit(2)
          }
          let payload
          try { payload = JSON.parse(text) } catch {
            console.log(JSON.stringify({ provider:'TitanLabs', usable:false, reason:'INVALID_JSON' }))
            process.exit(3)
          }
          if (String(payload?.s ?? '').toLowerCase() !== 'ok' || !Array.isArray(payload?.t)) {
            console.log(JSON.stringify({ provider:'TitanLabs', usable:false, reason:'INVALID_ENVELOPE', status:payload?.s ?? null }))
            process.exit(4)
          }
          const fields = ['t','o','h','l','c','v']
          if (fields.some((field) => !Array.isArray(payload[field]) || payload[field].length !== payload.t.length)) {
            console.log(JSON.stringify({ provider:'TitanLabs', usable:false, reason:'MISALIGNED_VECTORS' }))
            process.exit(5)
          }
          function vnDate(seconds) {
            const parts = new Intl.DateTimeFormat('en-CA', { timeZone:'Asia/Ho_Chi_Minh', year:'numeric', month:'2-digit', day:'2-digit' }).formatToParts(new Date(Number(seconds) * 1000))
            const get = (type) => parts.find((part) => part.type === type)?.value ?? ''
            return `${get('year')}-${get('month')}-${get('day')}`
          }
          const bars = payload.t.map((time,index) => ({
            date:vnDate(time),
            open:Number(payload.o[index])/1000,
            high:Number(payload.h[index])/1000,
            low:Number(payload.l[index])/1000,
            close:Number(payload.c[index])/1000,
            volume:Number(payload.v[index]),
          })).filter((bar) => Object.entries(bar).every(([key,value]) => key === 'date' ? typeof value === 'string' : Number.isFinite(value)))
          const wanted = new Set(['2025-10-13','2025-10-14','2025-10-15','2025-10-16','2025-10-17','2026-06-26','2026-08-05'])
          const anchors = bars.filter((bar)=>wanted.has(bar.date)).sort((a,b)=>a.date.localeCompare(b.date))
          const golden = anchors.filter((bar)=>bar.date.startsWith('2025-10-'))
          console.log(JSON.stringify({
            provider:'TitanLabs', usable:true,
            declaredCount:Number(payload.count ?? bars.length),
            barCount:bars.length,
            firstDate:payload.firstDate ?? bars[0]?.date ?? null,
            lastDate:payload.lastDate ?? bars.at(-1)?.date ?? null,
            anchors,
            goldenWeek:golden.length ? { high:Math.max(...golden.map((bar)=>bar.high)), low:Math.min(...golden.map((bar)=>bar.low)), sessions:golden.length } : null,
          }))
          NODE
