name: QEO-134 fix import

on:
  push:
    branches:
      - tvq9612/qeo-134-chi-so-thi-truong-topi

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: tvq9612/qeo-134-chi-so-thi-truong-topi
      - name: Apply one-line TypeScript fix and remove helper
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('components/insights/market-health-view.tsx')
          text = path.read_text()
          old = 'import { ChevronDown, Gauge, HeartPulse, ShieldAlert } from "lucide-react"'
          new = 'import { BarChart3, ChevronDown, Gauge, HeartPulse, ShieldAlert } from "lucide-react"'
          if old not in text:
              raise SystemExit('expected lucide import not found')
          path.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/qeo-134-fix-import.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/insights/market-health-view.tsx .github/workflows/qeo-134-fix-import.yml
          git commit -m "fix(QEO-134): import sentiment history icon"
          git push origin HEAD:tvq9612/qeo-134-chi-so-thi-truong-topi
