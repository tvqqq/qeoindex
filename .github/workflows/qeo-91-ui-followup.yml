name: QEO-91 UI follow-up patch

on:
  push:
    branches:
      - feat/qeo-91-chart-ui-followup

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/qeo-91-chart-ui-followup
          fetch-depth: 0
      - name: Apply bounded chart UI patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          chart_path = Path('components/stock-detail/stock-tradingview-chart.tsx')
          s = chart_path.read_text()

          def replace_once(old: str, new: str, label: str):
              global s
              if old not in s:
                  raise SystemExit(f'missing replacement target: {label}')
              s = s.replace(old, new, 1)

          def replace_between(start_marker: str, end_marker: str, replacement: str, label: str):
              global s
              start = s.find(start_marker)
              end = s.find(end_marker, start + len(start_marker)) if start >= 0 else -1
              if start < 0 or end < 0:
                  raise SystemExit(f'missing block markers: {label}')
              s = s[:start] + replacement + s[end:]

          replace_once('    chartStyle,\n    setChartStyle,\n', '', 'chart style persistence destructure')
          replace_once('  const [showStyleDropdown, setShowStyleDropdown] = useState(false)\n', '', 'chart style dropdown state')

          replace_once('''  const rsiSeriesAll = useMemo(() => {\n    return isMaximized && indicators.showRsi ? calculateRsiSeries(displayBars, 14) : []\n  }, [displayBars, isMaximized, indicators.showRsi])\n\n  const macdSeriesAllRaw = useMemo(() => {\n    return isMaximized && indicators.showMacd ? calculateMacdSeries(displayBars) : null\n  }, [displayBars, isMaximized, indicators.showMacd])''', '''  const rsiSeriesAll = useMemo(() => {\n    return isMaximized ? calculateRsiSeries(displayBars, 14) : []\n  }, [displayBars, isMaximized])\n\n  const macdSeriesAllRaw = useMemo(() => {\n    return isMaximized ? calculateMacdSeries(displayBars) : null\n  }, [displayBars, isMaximized])''', 'permanent RSI/MACD calculations')

          replace_once('  const hasRsi = isMaximized && indicators.showRsi\n  const hasMacd = isMaximized && indicators.showMacd\n', '  const hasRsi = isMaximized\n  const hasMacd = isMaximized\n', 'permanent RSI/MACD panes')

          replace_once('''    // Keep bar under cursor stable: proportionally adjust scrollOffset\n    const offsetDelta = Math.round(diff * (1 - cursorRatio))\n    const nextOffset = Math.max(0, Math.min(maxScrollOffset, scrollOffset + offsetDelta))''', '''    // At the latest edge, zoom-out reveals older candles on the left without\n    // moving endIdx away from the newest candle. After the user pans into\n    // history, preserve the existing cursor-centered behavior.\n    const offsetDelta = Math.round(diff * (1 - cursorRatio))\n    const isAtLatestEdge = scrollOffset === 0\n    const nextOffset = isAtLatestEdge && diff > 0 ? 0 : Math.max(0, Math.min(maxScrollOffset, scrollOffset + offsetDelta))''', 'latest-edge zoom')

          replace_once('  const activeIndicatorsCount = Object.values(indicators).filter(Boolean).length\n', '''  const activeIndicatorsCount = [\n    indicators.showMa,\n    indicators.showIchimoku,\n    indicators.showQeoBase129,\n    indicators.showBollinger,\n    indicators.showVolumeProfile,\n  ].filter(Boolean).length\n''', 'indicator counter')

          replace_between(
              '          {/* Maximized: Chart Style Dropdown */}',
              '          {/* Maximized: Indicators Popover Button */}',
              '''          {/* Japanese candles are the single canonical chart presentation. */}\n          {isMaximized && (\n            <div className="flex items-center ml-1">\n              <div className="mx-1 h-3.5 w-px bg-white/[0.1]" />\n              <span className="rounded-md px-2 py-0.5 text-[11px] font-semibold text-slate-300">Nến Nhật</span>\n            </div>\n          )}\n\n''',
              'chart-style dropdown',
          )

          replace_between(
              '          {/* OHLCV live readout */}',
              '          {/* Action Buttons: Reset View, Screenshot, Maximize/Minimize */}',
              '',
              'top-right OHLCV',
          )

          overlay = '''        {/* In-plot OHLCV readout under the timeframe bar. */}\n        {isMaximized && activeBar && (\n          <div\n            data-chart-ohlcv-overlay\n            className="pointer-events-none absolute left-14 top-3 z-20 flex flex-wrap items-center gap-2 rounded-lg border border-white/[0.06] bg-[#080d13]/72 px-2.5 py-1 font-mono text-[10px] text-slate-400 backdrop-blur-sm"\n          >\n            <span className="text-slate-500">\n              {new Date(activeBar.time * 1000).toLocaleDateString("vi-VN", {\n                day: "2-digit",\n                month: "2-digit",\n                year: "numeric",\n              })}\n            </span>\n            <span>O: <b className="text-slate-200">{activeBar.open.toLocaleString()}</b></span>\n            <span>H: <b className="text-emerald-300">{activeBar.high.toLocaleString()}</b></span>\n            <span>L: <b className="text-rose-300">{activeBar.low.toLocaleString()}</b></span>\n            <span>C: <b className={activeBar.close >= activeBar.open ? "text-emerald-300" : "text-rose-300"}>{activeBar.close.toLocaleString()}</b></span>\n            <span>V: <b className="text-slate-200">{formatCompactVolume(activeBar.volume)}</b></span>\n          </div>\n        )}\n\n'''
          marker = '        {/* Object Management Panel (Object Tree / Layers) */}'
          if marker not in s:
              raise SystemExit('missing object manager marker')
          s = s.replace(marker, overlay + marker, 1)

          replace_between(
              '          {/* 5. Main Candlesticks / Line Chart */}',
              '          {/* Moving Averages — requested visual hierarchy */}',
              '''          {/* 5. Main Candlesticks — Japanese candles are the only presentation. */}\n          {visibleBars.map((bar, i) => {\n            const x = getX(i)\n            const isBull = bar.close >= bar.open\n            const color = isBull ? "#10b981" : "#f43f5e"\n            const highY = getY(bar.high)\n            const lowY = getY(bar.low)\n            const openY = getY(bar.open)\n            const closeY = getY(bar.close)\n            const bodyTop = Math.min(openY, closeY)\n            const bodyHeight = Math.max(1.5, Math.abs(closeY - openY))\n            const candleW = Math.max(2, plotWidth / visibleSlotCount - 2)\n\n            return (\n              <g key={`c-${bar.time}-${i}`}>\n                <line x1={x} y1={highY} x2={x} y2={lowY} stroke={color} strokeWidth="1.2" />\n                <rect\n                  x={x - candleW / 2}\n                  y={bodyTop}\n                  width={candleW}\n                  height={bodyHeight}\n                  fill={color}\n                  stroke={color}\n                  strokeWidth="0"\n                  rx="1"\n                />\n              </g>\n            )\n          })}\n\n''',
              'main chart render',
          )

          if 'showStyleDropdown' in s or 'Đường Line' in s:
              raise SystemExit('legacy chart-style UI remains')
          chart_path.write_text(s)

          tools_path = Path('components/stock-detail/chart/stock-chart-drawing-tools.tsx')
          tools = tools_path.read_text()
          old_tools_class = 'className="absolute left-2.5 top-12 z-30 flex flex-col items-center gap-1 rounded-xl border border-white/[0.08] bg-[#0a0f16]/95 p-1 shadow-[0_8px_32px_rgba(0,0,0,0.7)] backdrop-blur-md"'
          new_tools_class = 'className="absolute left-3 top-14 z-30 flex max-h-[calc(100%-72px)] flex-col items-center gap-1 overflow-y-auto rounded-[22px] border border-white/[0.1] bg-[#0a0f16]/94 p-1.5 shadow-[0_12px_36px_rgba(0,0,0,0.72)] backdrop-blur-md"'
          if old_tools_class not in tools:
              raise SystemExit('missing floating tools class target')
          tools_path.write_text(tools.replace(old_tools_class, new_tools_class, 1))

          shell_path = Path('components/stock-detail/chart/stock-chart-terminal-shell.module.css')
          shell = shell_path.read_text()
          start = shell.find('/* Turn the drawing toolbox into a compact TradingView-style rail instead of a floating card. */')
          end = shell.find('/* Bottom range/status rail:', start)
          if start < 0 or end < 0:
              raise SystemExit('missing fixed drawing rail CSS markers')
          floating_css = '''/* Keep the drawing toolbox as a detached TradingView-style floating capsule. */\n.terminalSurface > div:first-child > div:nth-child(2) aside[aria-label="Thanh công cụ vẽ TradingView"] {\n  gap: 3px !important;\n  border-color: rgba(255, 255, 255, 0.1) !important;\n  background: rgba(10, 15, 22, 0.94) !important;\n  padding: 6px !important;\n  box-shadow: 0 12px 36px rgba(0, 0, 0, 0.72) !important;\n  backdrop-filter: blur(10px);\n}\n\n.terminalSurface > div:first-child > div:nth-child(2) aside[aria-label="Thanh công cụ vẽ TradingView"] > button,\n.terminalSurface > div:first-child > div:nth-child(2) aside[aria-label="Thanh công cụ vẽ TradingView"] > div > button {\n  width: 32px;\n  height: 32px;\n  border-radius: 10px !important;\n}\n\n.terminalSurface > div:first-child > div:nth-child(2) aside[aria-label="Thanh công cụ vẽ TradingView"] > button > svg,\n.terminalSurface > div:first-child > div:nth-child(2) aside[aria-label="Thanh công cụ vẽ TradingView"] > div > button > svg {\n  width: 18px;\n  height: 18px;\n}\n\n'''
          shell_path.write_text(shell[:start] + floating_css + shell[end:])

          modal_path = Path('components/stock-detail/chart/stock-chart-indicator-modal.tsx')
          modal = modal_path.read_text()
          modal = modal.replace('Check, Activity, BarChart2, TrendingUp, Layers, Compass, Sparkles, X', 'Check, BarChart2, TrendingUp, Layers, Compass, Sparkles, X')
          modal, count = re.subn(r'''\n    \{\n      key: "showRsi",.*?\n    \},\n    \{\n      key: "showMacd",.*?\n    \},''', '', modal, count=1, flags=re.S)
          if count != 1 or 'key: "showRsi"' in modal or 'key: "showMacd"' in modal:
              raise SystemExit('failed to remove RSI/MACD checkbox entries')
          modal_path.write_text(modal)
          PY
      - name: Commit implementation and remove temporary workflow
        shell: bash
        run: |
          git config user.name "qeoindex-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/qeo-91-ui-followup.yml
          git add components/stock-detail/stock-tradingview-chart.tsx \
                  components/stock-detail/chart/stock-chart-drawing-tools.tsx \
                  components/stock-detail/chart/stock-chart-terminal-shell.module.css \
                  components/stock-detail/chart/stock-chart-indicator-modal.tsx
          git commit -m "fix(QEO-91): restore latest zoom and floating chart controls"
          git push origin HEAD:feat/qeo-91-chart-ui-followup
