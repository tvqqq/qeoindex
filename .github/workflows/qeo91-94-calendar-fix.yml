name: QEO-91-94 Calendar Fix

on:
  push:
    branches:
      - feat/qeo-91-94-tradingview-future-panes
    paths:
      - .github/workflows/qeo91-94-calendar-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/qeo-91-94-tradingview-future-panes
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Use canonical Vietnam trading calendar for future slots
        shell: bash
        run: |
          cat > components/stock-detail/chart/future-timeline.ts <<'EOF'
          import {
            isVietnamSecuritiesTradingDateKey,
            nextVietnamSecuritiesTradingDateKey,
            vietnamDateKey,
          } from "../../../modules/market/calendar.ts"
          import type { ChartTimeframe } from "./stock-chart-types"

          const VN_OFFSET_SECONDS = 7 * 60 * 60
          const INTRADAY_MINUTES: Partial<Record<ChartTimeframe, number>> = {
            "1m": 1,
            "15m": 15,
            "30m": 30,
            "1h": 60,
            "2h": 120,
            "4h": 240,
          }

          function localParts(time: number) {
            const date = new Date((time + VN_OFFSET_SECONDS) * 1000)
            return {
              year: date.getUTCFullYear(),
              month: date.getUTCMonth() + 1,
              day: date.getUTCDate(),
              hour: date.getUTCHours(),
              minute: date.getUTCMinutes(),
            }
          }

          function dateKey(year: number, month: number, day: number) {
            return `${String(year).padStart(4, "0")}-${String(month).padStart(2, "0")}-${String(day).padStart(2, "0")}`
          }

          function localEpochForDateKey(key: string, hour: number, minute: number) {
            return Math.floor(Date.parse(`${key}T${String(hour).padStart(2, "0")}:${String(minute).padStart(2, "0")}:00+07:00`) / 1000)
          }

          function addCalendarDaysKey(key: string, days: number) {
            const date = new Date(`${key}T12:00:00+07:00`)
            date.setUTCDate(date.getUTCDate() + days)
            return vietnamDateKey(date)
          }

          function advanceTradingDays(key: string, count: number) {
            let cursor = key
            for (let i = 0; i < count; i += 1) cursor = nextVietnamSecuritiesTradingDateKey(cursor)
            return cursor
          }

          function firstTradingDateOnOrAfter(key: string) {
            return isVietnamSecuritiesTradingDateKey(key) ? key : nextVietnamSecuritiesTradingDateKey(key)
          }

          export function projectNextFutureTime(time: number, timeframe: ChartTimeframe) {
            const intradayMinutes = INTRADAY_MINUTES[timeframe]
            const parts = localParts(time)
            const currentDateKey = dateKey(parts.year, parts.month, parts.day)

            if (intradayMinutes) {
              const currentMinutes = parts.hour * 60 + parts.minute
              const nextMinutes = currentMinutes + intradayMinutes
              const morningEnd = 11 * 60 + 30
              const afternoonStart = 13 * 60
              const marketClose = 15 * 60

              if (currentMinutes < morningEnd) {
                if (nextMinutes < morningEnd) {
                  return localEpochForDateKey(currentDateKey, Math.floor(nextMinutes / 60), nextMinutes % 60)
                }
                return localEpochForDateKey(currentDateKey, 13, 0)
              }

              if (currentMinutes >= afternoonStart && currentMinutes < marketClose && nextMinutes < marketClose) {
                return localEpochForDateKey(currentDateKey, Math.floor(nextMinutes / 60), nextMinutes % 60)
              }

              return localEpochForDateKey(nextVietnamSecuritiesTradingDateKey(currentDateKey), 9, 0)
            }

            if (timeframe === "1D") {
              return localEpochForDateKey(advanceTradingDays(currentDateKey, 1), parts.hour, parts.minute)
            }
            if (timeframe === "3D") {
              return localEpochForDateKey(advanceTradingDays(currentDateKey, 3), parts.hour, parts.minute)
            }
            if (timeframe === "1W") {
              const nextWeekCandidate = addCalendarDaysKey(currentDateKey, 7)
              return localEpochForDateKey(firstTradingDateOnOrAfter(nextWeekCandidate), parts.hour, parts.minute)
            }

            if (timeframe === "1M" || timeframe === "1Q") {
              const monthsToAdd = timeframe === "1M" ? 1 : 3
              const target = new Date(Date.UTC(parts.year, parts.month - 1 + monthsToAdd, 1, 0, 0, 0))
              const targetKey = dateKey(target.getUTCFullYear(), target.getUTCMonth() + 1, 1)
              return localEpochForDateKey(firstTradingDateOnOrAfter(targetKey), parts.hour, parts.minute)
            }

            const targetKey = dateKey(parts.year + 1, 1, 1)
            return localEpochForDateKey(firstTradingDateOnOrAfter(targetKey), parts.hour, parts.minute)
          }

          export function projectFutureTimes(lastTime: number, timeframe: ChartTimeframe, count: number) {
            const result: number[] = []
            let cursor = lastTime
            for (let i = 0; i < count; i += 1) {
              cursor = projectNextFutureTime(cursor, timeframe)
              result.push(cursor)
            }
            return result
          }

          export function formatFutureTimelineLabel(time: number, timeframe: ChartTimeframe) {
            const date = new Date(time * 1000)
            if (timeframe.includes("m") || timeframe.includes("h")) {
              return new Intl.DateTimeFormat("vi-VN", {
                timeZone: "Asia/Ho_Chi_Minh",
                hour: "2-digit",
                minute: "2-digit",
                hour12: false,
              }).format(date)
            }
            if (timeframe === "1D" || timeframe === "3D" || timeframe === "1W") {
              return new Intl.DateTimeFormat("vi-VN", {
                timeZone: "Asia/Ho_Chi_Minh",
                day: "2-digit",
                month: "2-digit",
              }).format(date)
            }
            return new Intl.DateTimeFormat("vi-VN", {
              timeZone: "Asia/Ho_Chi_Minh",
              month: "2-digit",
              year: "numeric",
            }).format(date)
          }
          EOF

          python - <<'PY'
          from pathlib import Path

          chart = Path("components/stock-detail/stock-tradingview-chart.tsx")
          text = chart.read_text()
          marker = 'import { aggregateBarsByTimeframe } from "./chart/stock-chart-timeframes"\n'
          helper_import = 'import { formatFutureTimelineLabel, projectFutureTimes } from "./chart/future-timeline"\n'
          if helper_import not in text:
              text = text.replace(marker, helper_import + marker, 1)

          start = text.index('const VN_OFFSET_SECONDS = 7 * 60 * 60\n')
          end = text.index('function formatCompactVolume')
          replacement = '''const EXPANDED_SUBPANE_HEIGHT = 92\nconst COLLAPSED_SUBPANE_HEIGHT = 24\nconst SUBPANE_GAP = 8\n\n'''
          text = text[:start] + replacement + text[end:]
          text = text.replace('formatTimelineLabel(', 'formatFutureTimelineLabel(')
          chart.write_text(text)

          test_file = Path("tests/stock-tradingview-chart-v2.test.ts")
          test_text = test_file.read_text()
          test_import = 'import { projectFutureTimes } from "../components/stock-detail/chart/future-timeline.ts"\n'
          anchor = 'import test from "node:test"\n'
          if test_import not in test_text:
              test_text = test_text.replace(anchor, anchor + test_import, 1)
          regression = '''\n\ntest("Future chart timeline uses canonical Vietnam securities holidays", () => {\n  const fridayClose = Math.floor(Date.parse("2026-08-28T14:45:00+07:00") / 1000)\n  const [nextIntraday] = projectFutureTimes(fridayClose, "15m", 1)\n  const [nextDaily] = projectFutureTimes(fridayClose, "1D", 1)\n\n  assert.equal(new Date(nextIntraday * 1000).toISOString(), "2026-09-03T02:00:00.000Z")\n  assert.equal(new Date(nextDaily * 1000).toISOString(), "2026-09-03T07:45:00.000Z")\n})\n'''
          if 'Future chart timeline uses canonical Vietnam securities holidays' not in test_text:
              test_text += regression
          test_file.write_text(test_text)
          PY
      - name: Verify focused chart contracts
        run: node --test tests/stock-chart-interaction.test.ts tests/stock-tradingview-chart-v2.test.ts
      - name: TypeScript
        run: pnpm typecheck
      - name: Commit fix and remove one-shot workflow
        shell: bash
        run: |
          git rm .github/workflows/qeo91-94-calendar-fix.yml
          git add components/stock-detail/chart/future-timeline.ts components/stock-detail/stock-tradingview-chart.tsx tests/stock-tradingview-chart-v2.test.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(QEO-91,QEO-94): use canonical trading calendar for future slots"
          git push origin HEAD:feat/qeo-91-94-tradingview-future-panes
