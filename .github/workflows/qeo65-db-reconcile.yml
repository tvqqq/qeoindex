name: QEO-65 DB Reconcile

on:
  push:
    branches:
      - qeo65-db-reconcile

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Supabase CLI
        run: |
          curl -L https://github.com/supabase/cli/releases/download/v2.116.0/supabase_linux_amd64.tar.gz | tar -xz
          sudo mv supabase /usr/local/bin/supabase
          supabase --version
      - name: Promote production-applied migration and ledger evidence
        run: |
          git mv supabase/pending-migrations/20260904114500_qeo65_drop_legacy_archive_ledgers.sql supabase/migrations/20260904114500_qeo65_drop_legacy_archive_ledgers.sql
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs'

          const manifestPath = 'supabase/migration-equivalence.json'
          const manifest = JSON.parse(readFileSync(manifestPath, 'utf8'))
          const item = manifest.migrations.find((m) => m.logicalName === 'qeo65_drop_legacy_archive_ledgers')
          if (!item) throw new Error('missing qeo65 manifest entry')
          item.productionVersion = '20260904074828'
          item.state = 'MAPPED'
          item.evidence = 'production-ledger-post-deploy-zero-consumer-and-schema-postcheck'
          item.rationale = 'QEO-65 source/runtime cutover deployed READY on Vercel before destructive cleanup; fresh production preflight confirmed both legacy tables remained empty with zero FK/view/policy/trigger/cron consumers, then the no-CASCADE migration removed both tables plus qeo_archive_retention_preflight(date) while preserving market_ohlcv_history.'
          writeFileSync(manifestPath, JSON.stringify(manifest, null, 2) + '\n')

          const evidencePath = 'docs/db/evidence/production-migration-ledger-2026-09-02.json'
          const evidence = JSON.parse(readFileSync(evidencePath, 'utf8'))
          evidence.capturedAt = '2026-09-04T07:48:28Z'
          if (!evidence.migrations.some((m) => m.version === '20260904074828')) {
            evidence.migrations.push({ version: '20260904074828', name: 'qeo65_drop_legacy_archive_ledgers' })
          }
          writeFileSync(evidencePath, JSON.stringify(evidence, null, 2) + '\n')
          NODE
      - name: Start local Supabase and replay all migrations
        run: |
          supabase start
          pnpm db:replay:verify
      - name: Regenerate canonical database types
        run: pnpm db:types:generate
      - name: Verify DB drift, generated types and TypeScript
        run: |
          pnpm db:drift:verify
          pnpm db:types:verify
          pnpm test:db-drift
          pnpm typecheck
      - name: Assert removed legacy objects are absent from generated types
        run: |
          ! grep -q 'eod_archive_checkpoints' modules/shared/supabase/database.types.ts
          ! grep -q 'market_ohlcv_archive_ranges' modules/shared/supabase/database.types.ts
          ! grep -q 'qeo_archive_retention_preflight' modules/shared/supabase/database.types.ts
          grep -q 'market_ohlcv_history' modules/shared/supabase/database.types.ts
      - name: Commit reconciliation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/migrations supabase/pending-migrations supabase/migration-equivalence.json docs/db/evidence/production-migration-ledger-2026-09-02.json modules/shared/supabase/database.types.ts
          git diff --cached --quiet && exit 0
          git commit -m 'chore(QEO-65): reconcile production archive cleanup'
          git push
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup || true
