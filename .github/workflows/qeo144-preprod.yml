name: QEO-144 Portfolio Risk Acceptance

on:
  pull_request:
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "playwright.config.ts"
      - "tests/browser/**"
      - "tests/portfolio/qeo144-*"
      - "scripts/portfolio/qeo144-*"
      - ".github/workflows/qeo144-preprod.yml"

permissions:
  contents: read

concurrency:
  group: qeo144-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser-harness-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: QEO-144 acceptance contracts
        run: pnpm test:qeo144

  fixture-replay:
    needs: browser-harness-contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0
      - run: pnpm install --frozen-lockfile
      - name: Start local Supabase
        run: supabase start
      - name: Replay migrations from zero
        run: pnpm db:replay:verify
      - name: Seed controlled QEO-144 fixture
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          API_URL="$API_URL" SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" bash scripts/portfolio/qeo144-seed-local.sh
      - name: Assert replayed fixture invariants
        run: |
          docker exec -i supabase_db_qeoindex \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 -f - \
            < tests/portfolio/qeo144-fixture-replay.sql
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
