name: QEO-144 Portfolio Risk Acceptance

on:
  pull_request:
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "playwright.config.ts"
      - "tests/browser/**"
      - "tests/portfolio/qeo144-*.test.ts"
      - "scripts/portfolio/qeo144-*"
      - ".github/workflows/qeo144-preprod.yml"

permissions:
  contents: write

concurrency:
  group: qeo144-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  browser-harness-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Sync Playwright dependency and lockfile to feature branch
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          QEO_HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          if node -e 'const p=require("./package.json"); process.exit(p.devDependencies?.["@playwright/test"] ? 0 : 1)'; then
            exit 0
          fi
          pnpm add -D @playwright/test
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          git commit -m "test(QEO-144): add Playwright dependency"
          git push origin HEAD:"$QEO_HEAD_REF"
      - name: QEO-144 browser harness contract
        run: node --test tests/portfolio/qeo144-browser-harness-contract.test.ts
