name: QEO 183 RED 2
"on":
  push:
    branches:
      - tvq9612/qeo-183-what-changed-today
jobs:
  red:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: tvq9612/qeo-183-what-changed-today
          fetch-depth: 0
      - name: Append RED tests
        shell: bash
        run: |
          python -c 'import base64,pathlib; p=pathlib.Path("tests/market-insight-layout-regression.test.ts"); s=p.read_text(); b=base64.b64decode("").decode(); marker="QEO-183 derives session deltas without mixing sentiment sources"; p.write_text(s if marker in s else s+b.decode())'
      - name: Prove RED
        shell: bash
        run: |
          set +e
          node --test tests/market-insight-ui-performance.test.ts > /tmp/qeo183-red.log 2>&1
          status=$?
          set -e
          cat /tmp/qeo183-red.log
          test "$status" -ne 0
          grep -q "QEO-183 must add a pure session-changes helper" /tmp/qeo183-red.log
      - name: Commit RED and self delete
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/qeo-183-red2.yml
          git add tests/market-insight-layout-regression.test.ts
          git commit -m 'test(QEO-183): define session change behavior'
          git push origin HEAD:tvq9612/qeo-183-what-changed-today
