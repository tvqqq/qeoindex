name: QEO-186 Production Deploy

on:
  push:
    branches:
      - ops/qeo-186-prod-deploy
    paths:
      - .github/workflows/qeo-186-prod-deploy.yml

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy Market Insight EOD sync
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy market-insight-eod-sync --project-ref glwhhrmejlonhyorvtzm --no-verify-jwt
