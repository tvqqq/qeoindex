name: QEO-92 Sync Generated Types

on:
  push:
    branches:
      - tvq9612/qeo-92-chart-data-real-1m-1d-canonical-ohlcv-with-hotcold-storage
    paths:
      - ".github/workflows/qeo92-sync-generated-types.yml"
      - "supabase/migrations/20260905065836_qeo92_chart_ohlcv_intraday.sql"
      - "modules/shared/supabase/database.types.ts"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tvq9612/qeo-92-chart-data-real-1m-1d-canonical-ohlcv-with-hotcold-storage
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0
      - run: pnpm install --frozen-lockfile
      - name: Start local Supabase
        run: supabase start
      - name: Generate canonical database types
        run: pnpm db:types:generate
      - name: Commit generated types when changed
        run: |
          if git diff --quiet -- modules/shared/supabase/database.types.ts; then
            echo "Generated types already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modules/shared/supabase/database.types.ts
          git commit -m "chore(qeo-92): sync generated Supabase types"
          git push origin HEAD:tvq9612/qeo-92-chart-data-real-1m-1d-canonical-ohlcv-with-hotcold-storage
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
