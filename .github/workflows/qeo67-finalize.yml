name: QEO-67 Finalize

on:
  push:
    branches:
      - qeo-65-67-cleanup-modules
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply final QEO-67 ownership cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -f components/live-market-board-v2.tsx ]; then
            git mv components/live-market-board-v2.tsx components/live-market-board.tsx
          fi

          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          function walk(root, out = []) {
            if (!fs.existsSync(root)) return out;
            const stat = fs.statSync(root);
            if (stat.isFile()) return [root];
            for (const entry of fs.readdirSync(root, { withFileTypes: true })) {
              const full = path.join(root, entry.name);
              if (entry.isDirectory()) walk(full, out);
              else if (/\.(?:ts|tsx|md)$/.test(entry.name)) out.push(full);
            }
            return out;
          }

          const rewriteRoots = ['app', 'components', 'tests', 'docs/market-board.md'];
          for (const file of rewriteRoots.flatMap((root) => walk(root))) {
            let text = fs.readFileSync(file, 'utf8');
            const next = text
              .replaceAll('live-market-board-v2', 'live-market-board')
              .replaceAll('LiveMarketBoardV2', 'LiveMarketBoard');
            if (next !== text) fs.writeFileSync(file, next);
          }

          const routePath = 'app/api/watchlist/route.ts';
          const modulePath = 'modules/portfolio/watchlist/server.ts';
          if (!fs.existsSync(modulePath)) {
            const route = fs.readFileSync(routePath, 'utf8');
            let moduleSource = route
              .replace(/export const runtime = "nodejs"\n/, '')
              .replace(/export const dynamic = "force-dynamic"\n/, '')
              .replace('export async function GET()', 'export async function handleWatchlistGet()')
              .replace('export async function POST(request: Request)', 'export async function handleWatchlistPost(request: Request)')
              .replace('export async function DELETE(request: Request)', 'export async function handleWatchlistDelete(request: Request)');
            moduleSource = `import "server-only"\n\n${moduleSource}`;
            fs.mkdirSync(path.dirname(modulePath), { recursive: true });
            fs.writeFileSync(modulePath, moduleSource);
            fs.writeFileSync(routePath, `import {\n  handleWatchlistDelete,\n  handleWatchlistGet,\n  handleWatchlistPost,\n} from "@/modules/portfolio/watchlist/server"\n\nexport const runtime = "nodejs"\nexport const dynamic = "force-dynamic"\n\nexport const GET = handleWatchlistGet\nexport const POST = handleWatchlistPost\nexport const DELETE = handleWatchlistDelete\n`);
          }

          const testPath = 'tests/module-architecture-contract.test.ts';
          if (!fs.existsSync(testPath)) {
            fs.writeFileSync(testPath, `import assert from "node:assert/strict"\nimport { existsSync, readFileSync, readdirSync, statSync } from "node:fs"\nimport path from "node:path"\nimport test from "node:test"\n\nconst ROOT = path.resolve(import.meta.dirname, "..")\nconst PRODUCTION_ROOTS = ["app", "components", "modules", "workflows", "lib"]\n\nfunction filesUnder(relative: string): string[] {\n  const absolute = path.join(ROOT, relative)\n  if (!existsSync(absolute)) return []\n  if (statSync(absolute).isFile()) return [relative.replaceAll("\\\\", "/")]\n  return readdirSync(absolute, { withFileTypes: true }).flatMap((entry) => {\n    const child = path.join(relative, entry.name)\n    if (entry.isDirectory()) return filesUnder(child)\n    return /\\.(?:ts|tsx|js|mjs)$/.test(entry.name) ? [child.replaceAll("\\\\", "/")] : []\n  })\n}\n\nconst productionFiles = PRODUCTION_ROOTS.flatMap(filesUnder)\n\ntest("active production paths do not preserve accidental legacy or version names", () => {\n  const historicalToken = /(^|[\\/_.-])(legacy|v2|v3)(?=$|[\\/_.-])/i\n  const violations = productionFiles.filter((file) => historicalToken.test(file))\n  assert.deepEqual(violations, [])\n})\n\ntest("root lib is no longer a production implementation surface", () => {\n  const rootLib = productionFiles.filter((file) => /^lib\\/[^/]+\\.(?:ts|tsx)$/.test(file))\n  assert.deepEqual(rootLib, [])\n})\n\ntest("lower-level domains do not depend on EOD or workflow orchestration", () => {\n  const violations: string[] = []\n  for (const file of productionFiles.filter((file) => file.startsWith("modules/"))) {\n    const domain = file.split("/")[1]\n    const source = readFileSync(path.join(ROOT, file), "utf8")\n    if (domain !== "eod" && /[\"']@\\/modules\\/eod(?:\\/|[\"'])/.test(source)) violations.push(file + " -> eod")\n    if (/[\"']@\\/workflows(?:\\/|[\"'])/.test(source)) violations.push(file + " -> workflows")\n  }\n  assert.deepEqual(violations, [])\n})\n\ntest("current domain contracts expose deliberate stable entrypoints", () => {\n  for (const file of [\n    "modules/eod/index.ts",\n    "modules/eod/README.md",\n    "modules/market/README.md",\n    "modules/market/universe/index.ts",\n    "modules/portfolio/README.md",\n    "modules/portfolio/watchlist/server.ts",\n    "modules/wyckoff/README.md",\n    "modules/ai-council/README.md",\n  ]) assert.equal(existsSync(path.join(ROOT, file)), true, file)\n})\n\ntest("watchlist route is a thin adapter over the portfolio module", () => {\n  const route = readFileSync(path.join(ROOT, "app/api/watchlist/route.ts"), "utf8")\n  assert.match(route, /@\\/modules\\/portfolio\\/watchlist\\/server/)\n  assert.doesNotMatch(route, /\\.from\\(/)\n  assert.doesNotMatch(route, /NextResponse/)\n  assert.ok(route.split("\\n").length <= 20, "watchlist route should stay thin")\n})\n\ntest("market board uses the canonical unversioned component name", () => {\n  assert.equal(existsSync(path.join(ROOT, "components/live-market-board.tsx")), true)\n  assert.equal(existsSync(path.join(ROOT, "components/live-market-board-v2.tsx")), false)\n  const board = readFileSync(path.join(ROOT, "components/live-market-board.tsx"), "utf8")\n  assert.match(board, /export function LiveMarketBoard\\(/)\n  assert.doesNotMatch(board, /LiveMarketBoardV2/)\n})\n`);
          }

          const manifestPath = 'tests/test-contracts.json';
          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          if (!manifest.entries.some((entry) => entry.path === testPath)) {
            manifest.entries.push({
              path: testPath,
              owner: 'tooling',
              invariant: 'Preserve QEO-67 domain ownership, unversioned active naming, orchestration direction, deliberate public contracts, and thin route adapters.',
              bucket: 'canonical',
              suites: ['fast'],
            });
            manifest.entries.sort((a, b) => a.path.localeCompare(b.path));
            fs.writeFileSync(manifestPath, JSON.stringify(manifest));
          }
          NODE

      - name: Verify final QEO-67 implementation
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile
          pnpm test:current
          pnpm lint:touched
          pnpm typecheck
          pnpm build
          git diff --check

      - name: Commit verified implementation
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo "No QEO-67 changes to commit"
            exit 0
          fi
          git add -A
          git commit -m "refactor(QEO-67): finalize module ownership boundaries"
          git push origin HEAD:qeo-65-67-cleanup-modules
