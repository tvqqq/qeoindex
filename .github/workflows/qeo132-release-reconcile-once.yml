name: QEO-132 Release Reconcile Once

on:
  push:
    branches:
      - feat/qeo-132-raw-daily-basis
    paths:
      - '.github/workflows/qeo132-release-reconcile-once.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/qeo-132-raw-daily-basis
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0
      - run: pnpm install --frozen-lockfile

      - name: Reconcile reviewed production migration evidence
        run: |
          node <<'NODE'
          const fs = require('node:fs')

          const manifestPath = 'supabase/migration-equivalence.json'
          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'))
          const upsertMapping = (entry) => {
            manifest.migrations = manifest.migrations.filter((item) => item.logicalName !== entry.logicalName)
            manifest.migrations.push(entry)
          }

          upsertMapping({
            logicalName: 'qeo129_adjusted_daily_shadow',
            repositoryVersion: null,
            productionVersion: '20260906223014',
            state: 'PRODUCTION_AHEAD',
            evidence: 'qeo129-production-schema-promoted-before-qeo132-source-merge',
            rationale: 'Production already contains the reviewed QEO-129 shadow schema, while its source PR remains intentionally unmerged until QEO-132 establishes the canonical RAW Daily boundary. PRODUCTION_AHEAD records that narrow temporary production/source asymmetry without importing QEO-129 source into QEO-132.'
          })
          upsertMapping({
            logicalName: 'qeo132_raw_daily_basis',
            repositoryVersion: '20260906169000',
            productionVersion: '20260907003316',
            state: 'MAPPED',
            evidence: 'qeo132-production-ledger-schema-rls-rpc-and-rollback-smoke',
            rationale: 'QEO-132 was promoted only after parser, schema, store, TypeScript and zero-to-latest local Supabase rehearsal passed. Production readback verified private RLS-enabled RAW tables, service-role-only persistence, SECURITY DEFINER fixed search_path, append-only evidence, and rollback-only replay/correction/non-RAW atomicity with zero residual rows. Production timestamp differs from repository replay ordering.'
          })
          fs.writeFileSync(manifestPath, `${JSON.stringify(manifest, null, 2)}\n`)

          const previousLedgerPath = 'docs/db/evidence/production-migration-ledger-2026-09-06.json'
          const previousLedger = JSON.parse(fs.readFileSync(previousLedgerPath, 'utf8'))
          const migrations = previousLedger.migrations.filter((row) => !['qeo129_adjusted_daily_shadow', 'qeo132_raw_daily_basis'].includes(row.name))
          migrations.push({ version: '20260906223014', name: 'qeo129_adjusted_daily_shadow' })
          migrations.push({ version: '20260907003316', name: 'qeo132_raw_daily_basis' })
          const nextLedger = {
            capturedAt: new Date().toISOString(),
            projectRef: 'glwhhrmejlonhyorvtzm',
            migrations,
            reviewScope: 'Canonical production migration ledger through QEO-132. Includes QEO-129 as explicitly reviewed PRODUCTION_AHEAD because its production shadow schema was promoted before source merge; QEO-132 is fully mapped to its production migration after schema/RLS/RPC and rollback-only behavioral smoke.'
          }
          fs.writeFileSync('docs/db/evidence/production-migration-ledger-2026-09-07.json', `${JSON.stringify(nextLedger, null, 2)}\n`)

          const contractsPath = 'tests/test-contracts.json'
          const contracts = JSON.parse(fs.readFileSync(contractsPath, 'utf8'))
          const newContract = {
            path: 'tests/db-migration-production-ahead.test.ts',
            owner: 'db',
            invariant: 'Fail closed on unexplained production-only migrations while allowing only explicitly reviewed production-ahead state with no active or pending source and an exact production ledger version.',
            bucket: 'deep-safety',
            suites: ['db']
          }
          contracts.entries = contracts.entries.filter((entry) => entry.path !== newContract.path)
          contracts.entries.push(newContract)
          contracts.entries.sort((a, b) => a.path.localeCompare(b.path))
          fs.writeFileSync(contractsPath, `${JSON.stringify(contracts, null, 2)}\n`)

          const evidence = `# QEO-132 RAW Daily production evidence — 2026-09-07

## Verified production migration

- Supabase project: \`qeoindex\` / \`glwhhrmejlonhyorvtzm\`.
- Repository migration: \`20260906169000_qeo132_raw_daily_basis.sql\`.
- Production migration: \`20260907003316 qeo132_raw_daily_basis\`.
- The migration is additive and does not alter, update, delete from, or insert into legacy \`market_ohlcv_history\`.

## Verified schema and privilege boundary

Production metadata readback after migration verified:

- \`market_ohlcv_raw_daily\`: RLS enabled; anon/authenticated SELECT denied; service role SELECT allowed; service role INSERT/UPDATE/DELETE denied.
- \`market_ohlcv_raw_daily_evidence\`: RLS enabled; anon/authenticated SELECT denied; service role SELECT+INSERT allowed; service role UPDATE/DELETE denied.
- \`qeo_persist_raw_daily_observation(jsonb, boolean)\`: SECURITY DEFINER; fixed \`search_path=public, pg_temp\`; execute denied to anon/authenticated and allowed to service role.
- append-only evidence trigger is present.
- Both RAW tables contained zero rows immediately after schema promotion.

## Verified rollback-only behavioral smoke

A production transaction was executed and rolled back. It proved:

1. an explicit RAW observation can be persisted and selected canonically;
2. replaying the same raw bar with only \`fetched_at\` changed reuses the same evidence identity;
3. exact replay does not duplicate evidence;
4. a corrected observation creates a second evidence row but does not move canonical selection unless explicitly requested;
5. explicit correction selection moves canonical to the corrected evidence while preserving the original evidence row unchanged;
6. direct UPDATE and DELETE of evidence are rejected;
7. a non-RAW observation fails atomically;
8. post-rollback counts were zero for fixture rows, total evidence rows, and total canonical rows.

## Production/source reconciliation note

Production already contains \`20260906223014 qeo129_adjusted_daily_shadow\`, while QEO-129 source remains intentionally unmerged from \`main\` until QEO-132 lands. The migration drift manifest records that exact temporary state as \`PRODUCTION_AHEAD\`; it does not import QEO-129 source into this PR and it remains fail-closed for any unreviewed production-only migration.

## Activation boundary

This evidence does **not** authorize bulk StockBiz ingestion and does **not** activate QEO-129 rollout. QEO-132 establishes the auditable RAW Daily storage/read boundary only.
`
          fs.writeFileSync('docs/db/evidence/qeo132-raw-daily-production-2026-09-07.md', evidence)
          NODE

      - name: Start local Supabase
        run: supabase start
      - name: Replay source migrations from zero
        run: pnpm db:replay:verify
      - name: Regenerate committed local Supabase types
        run: pnpm db:types:generate
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup

      - name: Remove one-shot workflow and commit reconciliation
        run: |
          git rm .github/workflows/qeo132-release-reconcile-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/migration-equivalence.json \
            modules/shared/supabase/database.types.ts \
            tests/test-contracts.json \
            docs/db/evidence/production-migration-ledger-2026-09-07.json \
            docs/db/evidence/qeo132-raw-daily-production-2026-09-07.md
          git diff --cached --check
          git commit -m 'chore(QEO-132): reconcile production raw Daily evidence'
          git push origin HEAD:feat/qeo-132-raw-daily-basis
