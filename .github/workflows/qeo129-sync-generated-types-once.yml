              text = path.read_text()
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f"{path}: expected exactly one match, found {count}: {old[:100]!r}")
                  text = text.replace(old, new)
              path.write_text(text)
