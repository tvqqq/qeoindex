name: QEO-129 Sync Generated Types Once

on:
  push:
    branches:
      - feat/qeo-129-adjusted-daily-shadow
    paths:
      - '.github/workflows/qeo129-sync-generated-types-once.yml'

permissions:
  contents: write

jobs:
  sync-types:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/qeo-129-adjusted-daily-shadow
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0
      - run: pnpm install --frozen-lockfile
      - name: Start local Supabase
        run: supabase start
      - name: Replay migrations from zero
        run: pnpm db:replay:verify
      - name: Generate exact Database types
        run: supabase gen types typescript --local > modules/shared/supabase/database.types.ts
      - name: Commit generated type sync
        run: |
          if git diff --quiet -- modules/shared/supabase/database.types.ts; then
            echo 'Generated Database types already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add modules/shared/supabase/database.types.ts
          git commit -m 'chore(QEO-129): sync generated database types'
          git push origin HEAD:feat/qeo-129-adjusted-daily-shadow
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
