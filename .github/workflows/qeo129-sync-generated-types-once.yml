          git diff --check

      - name: Verify canonical RAW wording
        run: |
          grep -F 'QEO-132 `market_ohlcv_raw_daily`' docs/superpowers/plans/2026-09-06-qeo-129-adjusted-daily-shadow.md
          grep -F 'QEO-132 `market_ohlcv_raw_daily`' docs/superpowers/specs/2026-09-06-qeo-129-adjusted-daily-shadow-design.md
