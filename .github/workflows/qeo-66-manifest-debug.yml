name: QEO-66 Manifest Debug

on:
  pull_request:
    paths:
      - "tests/test-contracts.json"
      - "tests/test-contract-manifest.test.ts"
      - "scripts/verify-test-contracts.mjs"
      - ".github/workflows/qeo-66-manifest-debug.yml"

permissions:
  contents: read

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/verify-test-contracts.mjs
      - run: node --test tests/test-contract-manifest.test.ts
