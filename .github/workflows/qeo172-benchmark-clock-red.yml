name: QEO-172 Benchmark Clock RED

on:
  push:
    branches:
      - fix/qeo172-precise-benchmark-clock

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: QEO-172 precise benchmark clock contract
        run: node --test tests/qeo172/benchmark-clock.test.ts
