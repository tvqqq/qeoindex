name: QEO-132 Raw Daily Preprod

on:
  push:
    branches:
      - feat/qeo-132-raw-daily-basis
  pull_request:
    paths:
      - 'modules/market/providers/stockbiz/**'
      - 'modules/market/history/raw-daily-*'
      - 'scripts/db/migration-drift-lib.mjs'
      - 'supabase/migrations/*qeo132*'
      - 'tests/market-history/qeo132-*'
      - 'tests/db/qeo132-*'
      - 'tests/db-migration-production-ahead.test.ts'
      - '.github/workflows/qeo132-preprod.yml'

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run QEO-132 StockBiz raw Daily contract
        run: node --test tests/market-history/qeo132-stockbiz-raw-daily.test.ts
      - name: Run QEO-132 VHM raw Daily golden regression
        run: node --test tests/market-history/qeo132-vhm-raw-golden.test.ts
      - name: Run QEO-132 raw Daily schema contract
        run: node --test tests/db/qeo132-raw-daily-schema.test.ts
      - name: Run QEO-132 canonical raw Daily store contract
        run: node --test tests/market-history/qeo132-raw-daily-store.test.ts
      - name: Run production-ahead drift contract
        run: node --test tests/db-migration-production-ahead.test.ts
      - name: Compile TypeScript
        run: pnpm typecheck

  schema-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0
      - run: pnpm install --frozen-lockfile
      - name: Start local Supabase
        run: supabase start
      - name: Replay migrations from zero through QEO-132
        run: pnpm db:replay:verify
      - name: Verify QEO-132 atomic RAW Daily persistence
        run: |
          eval "$(supabase status -o env)"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f tests/db/qeo132-raw-daily-persistence.sql
      - name: Lint replayed local database
        run: supabase db lint --local --level warning
      - name: Generate Database type candidate
        run: |
          mkdir -p artifacts/qeo132
          supabase gen types typescript --local --schema public > artifacts/qeo132/database.types.ts
      - name: Upload Database type candidate
        uses: actions/upload-artifact@v4
        with:
          name: qeo132-database-types
          path: artifacts/qeo132/database.types.ts
          retention-days: 3
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
