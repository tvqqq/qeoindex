name: Apply orderbook DNSE-live patch

on:
  push:
    branches:
      - fix/orderbook-dnse-live-behavior

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/orderbook-dnse-live-behavior
          fetch-depth: 0
      - name: Apply deterministic source-provenance edits
        run: python3 .github/patches/apply_orderbook_source_patch.py
      - name: Commit implementation and remove temporary tooling
        run: |
          rm -f .github/patches/orderbook-dnse-live.patch
          rm -f .github/patches/apply_orderbook_source_patch.py
          rm -f .github/workflows/apply-orderbook-dnse-live-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: gate orderbook realtime behavior to DNSE live"
          git push origin HEAD:fix/orderbook-dnse-live-behavior
