name: QEO-134 Apply Patch

on:
  push:
    branches:
      - tvq9612/qeo-134-chi-so-thi-truong-topi
    paths:
      - ".github/workflows/qeo134-apply.yml"
      - "scripts/probes/qeo134-apply.mjs"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v6
        with:
          ref: tvq9612/qeo-134-chi-so-thi-truong-topi
      - name: Apply QEO-134 patch
        run: node scripts/probes/qeo134-apply.mjs
      - name: Commit production changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/insights/market-close-dashboard.tsx components/insights/market-health-view.tsx modules/research/insights/data.ts
          git diff --cached --quiet && exit 0
          git commit -m "feat(QEO-134): integrate market sentiment dashboard"
          git push origin HEAD:tvq9612/qeo-134-chi-so-thi-truong-topi
