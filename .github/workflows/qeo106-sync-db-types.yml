name: QEO-106 one-shot DB type sync

on:
  push:
    branches:
      - qeo-106-daily-hot-cold-full-history

permissions:
  contents: write

jobs:
  sync-generated-types:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact branch
        uses: actions/checkout@v4
        with:
          ref: qeo-106-daily-hot-cold-full-history
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Start clean local Supabase
        run: supabase start

      - name: Verify zero-to-latest replay
        run: pnpm db:replay:verify

      - name: Generate canonical Database types
        run: pnpm db:types:generate

      - name: Verify generated candidate is stable
        run: pnpm db:types:verify

      - name: Commit generated types and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/qeo106-sync-db-types.yml
          git config user.name "qeoindex-db-drift-bot"
          git config user.email "actions@users.noreply.github.com"
          git add modules/shared/supabase/database.types.ts .github/workflows/qeo106-sync-db-types.yml
          if git diff --cached --quiet; then
            echo "No generated type change to commit"
            exit 1
          fi
          git commit -m "chore(QEO-106): sync generated Supabase types"
          git push origin HEAD:qeo-106-daily-hot-cold-full-history

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
