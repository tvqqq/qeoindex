name: QEO-134 sentiment score colors helper
on:
  push:
    branches:
      - tvq9612/qeo-134-sentiment-score-colors
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: tvq9612/qeo-134-sentiment-score-colors
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: RED then GREEN
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          test_path = Path('tests/market-insight-layout-regression.test.ts')
          source_path = Path('components/insights/market-health-view.tsx')
          test = test_path.read_text()
          source = source_path.read_text()

          anchor = '''test("QEO-134 market index cards have explicit borders and roomier padding", () => {'''
          regression = '''test("QEO-134 sentiment history score badge uses three semantic color levels", () => {
            const healthView = read("components/insights/market-health-view.tsx")

            assert.match(healthView, /function getSentimentScoreBadgeClass\\(score: number\\)/)
            assert.match(healthView, /score < 45[\\s\\S]*bg-rose-400/)
            assert.match(healthView, /score < 56[\\s\\S]*bg-amber-300/)
            assert.match(healthView, /return "bg-emerald-400"/)
            assert.match(healthView, /getSentimentScoreBadgeClass\\(point\\.value\\)/)
          })

          '''
          if regression not in test:
              assert anchor in test
              test = test.replace(anchor, regression + anchor, 1)
              test_path.write_text(test)

          # RED: production must not already satisfy the new contract.
          assert 'function getSentimentScoreBadgeClass(score: number)' not in source

          label_anchor = '''function SentimentHistoryTooltip({ active, payload }: { active?: boolean; payload?: Array<{ payload?: { tradingDate?: string; value?: number } }> }) {'''
          helper = '''function getSentimentScoreBadgeClass(score: number) {
            if (score < 45) return "bg-rose-400"
            if (score < 56) return "bg-amber-300"
            return "bg-emerald-400"
          }

          '''
          assert label_anchor in source
          source = source.replace(label_anchor, helper + label_anchor, 1)

          old_badge = '''<span className="rounded bg-amber-300 px-1.5 py-0.5 font-mono text-sm font-black text-slate-950">{point.value.toFixed(0)}</span>'''
          new_badge = '''<span className={`rounded ${getSentimentScoreBadgeClass(point.value)} px-1.5 py-0.5 font-mono text-sm font-black text-slate-950`}>{point.value.toFixed(0)}</span>'''
          assert old_badge in source
          source = source.replace(old_badge, new_badge, 1)
          source_path.write_text(source)

          final_source = source_path.read_text()
          assert 'if (score < 45) return "bg-rose-400"' in final_source
          assert 'if (score < 56) return "bg-amber-300"' in final_source
          assert 'return "bg-emerald-400"' in final_source
          assert 'getSentimentScoreBadgeClass(point.value)' in final_source
          PY
      - name: Remove helper and commit
        shell: bash
        run: |
          rm .github/workflows/qeo-134-sentiment-score-colors.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/insights/market-health-view.tsx tests/market-insight-layout-regression.test.ts .github/workflows/qeo-134-sentiment-score-colors.yml
          git commit -m 'fix(QEO-134): color sentiment score by three levels'
          git push origin HEAD:tvq9612/qeo-134-sentiment-score-colors