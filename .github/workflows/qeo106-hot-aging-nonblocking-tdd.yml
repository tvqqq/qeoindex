name: QEO-106 one-shot Nonblocking Hot Aging TDD

on:
  push:
    branches:
      - qeo-106-daily-hot-cold-full-history

permissions:
  contents: write

jobs:
  tdd-nonblocking-hot-aging:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact branch
        uses: actions/checkout@v4
        with:
          ref: qeo-106-daily-hot-cold-full-history
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Add failing nonblocking-aging regression
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path('tests/qeo-100-market-data.cases.ts')
          text = path.read_text()
          anchor = 'test("QEO-106 deep Daily history is resumable, bounded, provider-backed and archive-before-prune", () => {'
          assert text.count(anchor) == 1
          regression = '''test("QEO-106 unresolved Hot aging stays fail-closed without blocking deeper Cold history", () => {\n  const history = source("modules/market/history/daily-cold-history.ts")\n  assert.match(history, /Unresolved Daily hot evidence prevents archive/)\n  assert.match(history, /hotArchiveSkippedForAuthority/)\n  assert.match(history, /message\\.startsWith\\("Unresolved Daily hot evidence prevents archive"\\)/)\n  const skip = history.indexOf("hotArchiveSkippedForAuthority")\n  const deepLoop = history.indexOf("for (let chunk = 0; chunk < maxChunksPerTicker")\n  assert.ok(skip >= 0 && deepLoop > skip)\n})\n\n'''
          path.write_text(text.replace(anchor, regression + anchor))
          PY

      - name: Prove RED before implementation
        shell: bash
        run: |
          set +e
          node --test tests/stock-tradingview-chart-v2.test.ts > /tmp/qeo106-aging-nonblocking-red.log 2>&1
          status=$?
          set -e
          cat /tmp/qeo106-aging-nonblocking-red.log
          if [[ "$status" -eq 0 ]]; then
            echo "Expected nonblocking Hot-aging regression to fail before implementation"
            exit 1
          fi
          grep -q "QEO-106 unresolved Hot aging stays fail-closed without blocking deeper Cold history" /tmp/qeo106-aging-nonblocking-red.log

      - name: Keep authority failure local to Hot aging
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path('modules/market/history/daily-cold-history.ts')
          text = path.read_text()
          old = '''  const hotArchive = await archiveExpiredDailyHotHistory(supabase, ticker, now)\n  archivedHotRows += hotArchive.rows\n  manifests.push(...hotArchive.manifests)\n\n  let status: DailyLeftEdgeStatus = "IN_PROGRESS"\n'''
          new = '''  let hotArchiveSkippedForAuthority = false\n  try {\n    const hotArchive = await archiveExpiredDailyHotHistory(supabase, ticker, now)\n    archivedHotRows += hotArchive.rows\n    manifests.push(...hotArchive.manifests)\n  } catch (error) {\n    const message = error instanceof Error ? error.message : String(error)\n    if (!message.startsWith("Unresolved Daily hot evidence prevents archive")) throw error\n    hotArchiveSkippedForAuthority = true\n  }\n\n  let status: DailyLeftEdgeStatus = "IN_PROGRESS"\n'''
          assert text.count(old) == 1
          text = text.replace(old, new)
          detail_old = 'detail: { manifestIds: partitionResults.map((item) => item.manifestId), sourceUrl: history.sourceUrl, providerDetail: history.detail },'
          detail_new = 'detail: { manifestIds: partitionResults.map((item) => item.manifestId), sourceUrl: history.sourceUrl, providerDetail: history.detail, hotArchiveSkippedForAuthority },'
          assert text.count(detail_old) == 1
          text = text.replace(detail_old, detail_new)
          path.write_text(text)
          PY

      - name: Prove GREEN and type safety
        run: |
          node --test tests/stock-tradingview-chart-v2.test.ts
          pnpm typecheck

      - name: Commit implementation and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/qeo106-hot-aging-nonblocking-tdd.yml
          git config user.name "qeoindex-db-drift-bot"
          git config user.email "actions@users.noreply.github.com"
          git add modules/market/history/daily-cold-history.ts tests/qeo-100-market-data.cases.ts .github/workflows/qeo106-hot-aging-nonblocking-tdd.yml
          git commit -m "fix(QEO-106): keep deep history running when Hot aging is blocked"
          git push origin HEAD:qeo-106-daily-hot-cold-full-history
