name: QEO-124 Generate Types Once

on:
  push:
    branches:
      - feat/qeo-124-adjustment-engine
    paths:
      - ".github/workflows/qeo124-generate-types-once.yml"
      - "supabase/migrations/20260906165000_qeo124_adjustment_factor_runs.sql"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/qeo-124-adjustment-engine
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0
      - run: pnpm install --frozen-lockfile
      - name: Start local Supabase
        run: supabase start
      - name: Replay zero to latest
        run: pnpm db:replay:verify
      - name: Generate committed Database types
        run: pnpm db:types:generate
      - name: Verify QEO-124 schema contract
        run: node --test tests/corporate-actions/qeo124-factor-schema.test.ts
      - name: Commit generated types if changed
        run: |
          if git diff --quiet -- modules/shared/supabase/database.types.ts; then
            echo "Generated types already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modules/shared/supabase/database.types.ts
          git commit -m "chore(QEO-124): regenerate Supabase types"
          git push origin HEAD:feat/qeo-124-adjustment-engine
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
