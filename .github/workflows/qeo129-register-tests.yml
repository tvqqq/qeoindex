name: QEO-129 Register Tests Once

on:
  push:
    branches:
      - feat/qeo-129-adjusted-daily-shadow
    paths:
      - .github/workflows/qeo129-register-tests.yml

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/qeo-129-adjusted-daily-shadow
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Register QEO-129 contracts
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const path = 'tests/test-contracts.json'
          const manifest = JSON.parse(fs.readFileSync(path, 'utf8'))
          const additions = [
            {
              path: 'tests/db/qeo129-schema-contract.test.ts',
              owner: 'db',
              invariant: 'QEO-129 adjusted Daily shadow schema remains private, lineage-bound, replayable, and exact-readback verified.',
              bucket: 'deep-safety',
              suites: ['db'],
            },
            {
              path: 'tests/market-history/qeo129-adjusted-daily-shadow.test.ts',
              owner: 'market',
              invariant: 'QEO-129 adjusted Daily remains a pure raw plus exact-factor derivation with strict next-effective-session projection and no raw fallback.',
              bucket: 'canonical',
              suites: ['fast'],
            },
          ]
          const byPath = new Map(manifest.entries.map((entry) => [entry.path, entry]))
          for (const entry of additions) byPath.set(entry.path, entry)
          manifest.entries = [...byPath.values()].sort((a, b) => a.path.localeCompare(b.path))
          fs.writeFileSync(path, `${JSON.stringify(manifest, null, 2)}\n`)
          NODE
      - name: Verify manifest and QEO-129 tests
        run: |
          pnpm test:manifest
          node --test tests/db/qeo129-schema-contract.test.ts tests/market-history/qeo129-adjusted-daily-shadow.test.ts
          pnpm typecheck
      - name: Commit registration and remove helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test-contracts.json
          git rm .github/workflows/qeo129-register-tests.yml .github/workflows/qeo129-task2-red.yml
          git commit -m "test(QEO-129): register shadow contracts"
          git push origin HEAD:feat/qeo-129-adjusted-daily-shadow
