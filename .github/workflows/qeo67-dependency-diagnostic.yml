name: QEO-67 Dependency Diagnostic
on:
  push:
    branches: [qeo-65-67-cleanup-modules]
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print exact current dependency tree
        shell: bash
        run: |
          set -euo pipefail
          echo "HEAD=$(git rev-parse HEAD)"
          echo "===== relevant files ====="
          find modules workflows -type f | sort | grep -E 'eod-rating|eod-history|eod-ttai|modules/eod/index|kfsp|market/history|market/providers' || true
          echo "===== workflow dependency edges ====="
          rg -n "@/workflows|from ['\"]\.\./.*workflows|eod-rating-step|eod-history-refresh|eod-ttai-refresh" modules workflows || true
          echo "===== EOD entrypoint ====="
          [ -f modules/eod/index.ts ] && sed -n '1,260p' modules/eod/index.ts || true
