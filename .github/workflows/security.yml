name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Scan tracked source for secrets
        run: bash scripts/scan-secrets.sh

  core-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Signal engine tests
        run: npm run test:signal-core
      - name: Scanner policy tests
        run: npm run test:scanner-core
      - name: Market board contract
        run: npm run test:board-contract
      - name: TypeScript
        run: npm run typecheck
