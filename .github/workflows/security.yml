name: Verify

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Scan tracked source for secrets
        run: bash scripts/scan-secrets.sh
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
          run_install: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Restore tooling cache
        uses: actions/cache@v4
        with:
          path: |
            .next/cache/eslint
            .next/cache/typescript
          key: qeoindex-tooling-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            qeoindex-tooling-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: QEO-66 manifest RED gate
        run: node --test tests/test-contract-manifest.test.ts
      - name: Core regression suite
        run: pnpm test:core
      - name: QEO-58 same-session data refresh regression
        run: node --test tests/qeo-58-eod-data-refresh.test.ts
      - name: Market board filter regression
        run: node --test tests/market-board-filter-avg50-regression.test.ts tests/market-board-stock-filter-ui.test.ts tests/market-board-stock-filter-api.test.ts
      - name: Login handoff regression
        run: node --test tests/auth-login-handoff.test.ts
      - name: Orderbook prune security regression
        run: node --test tests/orderbook-prune-security.test.ts
      - name: KFSP canonical universe regression
        run: node --test tests/kfsp-canonical-universe-sync.test.ts
      - name: KFSP rating storage refactor regression
        run: node --test tests/kfsp-rating-storage-refactor.test.ts
      - name: KFSP manual recovery lifecycle regression
        run: node --test tests/kfsp-manual-recovery-lifecycle.test.ts
      - name: Canonical 200 UI regression
        run: node --test tests/canonical-200-ui.test.ts
      - name: Touched lint
        run: pnpm lint:touched
      - name: Market board filter lint
        run: pnpm exec eslint app/page.tsx components/market-board/stock-filter-modal.tsx lib/market-board/stock-filter.ts app/api/me/market-board-filter/route.ts tests/market-board-filter-avg50-regression.test.ts
      - name: TypeScript
        run: pnpm typecheck
      - name: Production build
        run: pnpm exec next build
