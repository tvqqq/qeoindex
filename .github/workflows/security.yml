name: Verify

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
          run_install: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Restore tooling cache
        uses: actions/cache@v4
        with:
          path: |
            .next/cache/eslint
            .next/cache/typescript
          key: qeoindex-tooling-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            qeoindex-tooling-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Scan tracked source for secrets
        run: pnpm scan:secrets
      - name: Verify test manifest
        run: pnpm test:manifest
      - name: Fast contracts
        run: pnpm test:fast
      - name: EOD contracts
        run: pnpm test:eod
      - name: AI contracts
        run: pnpm test:ai
      - name: DB contracts
        run: pnpm test:db
      - name: UI contracts
        run: pnpm test:ui-contracts
      - name: Touched lint
        run: pnpm lint:touched
      - name: Market board filter lint
        run: pnpm exec eslint app/page.tsx components/market-board/stock-filter-modal.tsx lib/market-board/stock-filter.ts app/api/me/market-board-filter/route.ts tests/market-board-filter-avg50-regression.test.ts
      - name: TypeScript
        run: pnpm typecheck
      - name: Production build
        run: pnpm exec next build
