name: Verify

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
          run_install: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Restore tooling cache
        uses: actions/cache@v4
        with:
          path: |
            .next/cache/eslint
            .next/cache/typescript
          key: qeoindex-tooling-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            qeoindex-tooling-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Scan tracked source for secrets
        run: pnpm scan:secrets
      - name: Scan pull request commits for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
      - name: Scan all fetched Git refs for secrets
        run: gitleaks detect --source . --redact --no-banner --exit-code=2 --log-opts="--all"
      - name: Current contracts
        run: pnpm test:current
      - name: Touched lint
        run: pnpm lint:touched
      - name: Market board filter lint
        run: pnpm exec eslint app/page.tsx components/market-board/stock-filter-modal.tsx modules/market/board/stock-filter.ts app/api/me/market-board-filter/route.ts tests/market-board-filter-avg50-regression.test.ts
      - name: TypeScript
        run: pnpm typecheck
      - name: Production build
        run: pnpm exec next build
