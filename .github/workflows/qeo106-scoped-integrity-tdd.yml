name: QEO-106 scoped integrity report TDD

on:
  push:
    branches:
      - fix/qeo-106-scoped-integrity-report

permissions:
  contents: write

jobs:
  scoped-integrity-tdd:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact branch
        uses: actions/checkout@v4
        with:
          ref: fix/qeo-106-scoped-integrity-report
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Add failing scoped-report regression
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path('tests/qeo-100-market-data.cases.ts')
          text = path.read_text()
          anchor = 'test("QEO-106 deep Daily history is resumable, bounded, provider-backed and archive-before-prune", () => {'
          assert text.count(anchor) == 1
          regression = '''test("QEO-106 integrity repair scopes the expensive audit to the requested tickers", () => {\n  const integrity = source("modules/market/history/daily-integrity.ts")\n  const migration = source("supabase/migrations/20260906003000_qeo106_scoped_daily_integrity_report.sql")\n  assert.match(migration, /qeo_market_daily_integrity_report_scoped\(p_tickers text\[\]\)/)\n  assert.match(migration, /requested as \(/)\n  assert.match(migration, /join requested r on r\.ticker = upper\(stock->>'ticker'\)/)\n  assert.match(migration, /provider in \('VCI', 'DNSE'\)/)\n  assert.match(migration, /grant execute on function public\.qeo_market_daily_integrity_report_scoped\(text\[\]\) to service_role/)\n  assert.match(integrity, /qeo_market_daily_integrity_report_scoped/)\n  assert.match(integrity, /\{ p_tickers: tickers \}/)\n  assert.equal((integrity.match(/loadIntegrityReport\(supabase, tickers\)/g) ?? []).length, 2)\n})\n\n'''
          path.write_text(text.replace(anchor, regression + anchor))
          PY

      - name: Prove RED before implementation
        shell: bash
        run: |
          set +e
          node --test tests/qeo-100-market-data.cases.ts > /tmp/qeo106-scoped-red.log 2>&1
          status=$?
          set -e
          cat /tmp/qeo106-scoped-red.log
          if [[ "$status" -eq 0 ]]; then
            echo "Expected scoped integrity regression to fail before implementation"
            exit 1
          fi
          grep -q "QEO-106 integrity repair scopes the expensive audit" /tmp/qeo106-scoped-red.log

      - name: Implement scoped integrity report and reconcile production ledger
        shell: bash
        run: |
          cat > supabase/migrations/20260906003000_qeo106_scoped_daily_integrity_report.sql <<'SQL'
          -- QEO-106 production follow-up: bound integrity report work to the requested repair batch.
          create or replace function public.qeo_market_daily_integrity_report_scoped(p_tickers text[])
          returns table (
            ticker text,
            exchange text,
            first_session date,
            last_session date,
            valid_daily_rows bigint,
            expected_sessions bigint,
            missing_expected_sessions bigint,
            missing_session_dates date[],
            non_trading_persisted_rows bigint,
            verified_no_trade_rows bigint,
            unclassified_zero_volume_rows bigint,
            status text
          )
          language sql
          stable
          set search_path = public, pg_temp
          as $$
          with requested as (
            select distinct upper(trim(value)) as ticker
            from unnest(coalesce(p_tickers, array[]::text[])) as value
            where trim(value) ~ '^[A-Za-z0-9]{2,12}$'
          ), universe as (
            select upper(stock->>'ticker') as ticker, upper(coalesce(stock->>'exchange', '')) as exchange
            from jsonb_array_elements(public.qeo_current_market_universe()->'stocks') stock
            join requested r on r.ticker = upper(stock->>'ticker')
          ), daily as (
            select h.ticker,
              (h.bar_time at time zone 'Asia/Ho_Chi_Minh')::date as session_date,
              h.volume, h.provider, h.provider_detail, h.source_url,
              coalesce(s.is_trading_day, extract(isodow from (h.bar_time at time zone 'Asia/Ho_Chi_Minh')::date) between 1 and 5) as is_trading_day
            from public.market_ohlcv_history h
            join universe u on u.ticker = h.ticker
            left join public.market_trading_sessions s
              on s.session_date = (h.bar_time at time zone 'Asia/Ho_Chi_Minh')::date
            where h.timeframe = '1D'
          ), bounds as (
            select u.ticker, u.exchange,
              min(d.session_date) filter (where d.is_trading_day) as first_session,
              max(d.session_date) filter (where d.is_trading_day) as last_session
            from universe u left join daily d on d.ticker = u.ticker
            group by u.ticker, u.exchange
          ), expected as (
            select b.ticker, s.session_date
            from bounds b
            join public.market_trading_sessions s
              on s.is_trading_day = true and s.session_date between b.first_session and b.last_session
          ), missing as (
            select e.ticker, e.session_date
            from expected e
            left join daily d on d.ticker = e.ticker and d.session_date = e.session_date and d.is_trading_day = true
            where d.ticker is null
          ), expected_counts as (
            select ticker, count(*)::bigint as expected_sessions from expected group by ticker
          ), missing_counts as (
            select ticker, count(*)::bigint as missing_expected_sessions,
              array_agg(session_date order by session_date) as missing_session_dates
            from missing group by ticker
          ), daily_counts as (
            select ticker,
              count(*) filter (where is_trading_day)::bigint as valid_daily_rows,
              count(*) filter (where not is_trading_day)::bigint as non_trading_persisted_rows,
              count(*) filter (
                where is_trading_day and volume = 0 and (
                  provider in ('VCI', 'DNSE') or (
                    provider = 'Fallback' and source_url = 'internal://stock_orderbook_snapshots'
                    and provider_detail ilike 'Verified final market-close repair%'
                  )
                )
              )::bigint as verified_no_trade_rows,
              count(*) filter (
                where is_trading_day and volume = 0 and not (
                  provider in ('VCI', 'DNSE') or (
                    provider = 'Fallback' and source_url = 'internal://stock_orderbook_snapshots'
                    and provider_detail ilike 'Verified final market-close repair%'
                  )
                )
              )::bigint as unclassified_zero_volume_rows
            from daily group by ticker
          )
          select b.ticker, b.exchange, b.first_session, b.last_session,
            coalesce(d.valid_daily_rows, 0), coalesce(e.expected_sessions, 0),
            coalesce(m.missing_expected_sessions, 0), coalesce(m.missing_session_dates, array[]::date[]),
            coalesce(d.non_trading_persisted_rows, 0), coalesce(d.verified_no_trade_rows, 0),
            coalesce(d.unclassified_zero_volume_rows, 0),
            case
              when b.first_session is null then 'NO_DATA'
              when coalesce(d.non_trading_persisted_rows, 0) > 0 then 'INVALID_NON_TRADING'
              when coalesce(m.missing_expected_sessions, 0) > 0 then 'MISSING_EXPECTED'
              when coalesce(d.unclassified_zero_volume_rows, 0) > 0 then 'REVIEW_ZERO_VOLUME'
              else 'PASS'
            end as status
          from bounds b
          left join expected_counts e using (ticker)
          left join missing_counts m using (ticker)
          left join daily_counts d using (ticker)
          order by b.ticker;
          $$;

          revoke all on function public.qeo_market_daily_integrity_report_scoped(text[]) from public, anon, authenticated;
          grant execute on function public.qeo_market_daily_integrity_report_scoped(text[]) to service_role;

          comment on function public.qeo_market_daily_integrity_report_scoped(text[]) is
            'QEO-106 bounded Daily integrity report for repair batches; equivalent semantics to the canonical-200 report but scans only requested tickers.';
          SQL

          python <<'PY'
          from pathlib import Path
          path = Path('modules/market/history/daily-integrity.ts')
          text = path.read_text()
          old = '''async function loadIntegrityReport(supabase: SupabaseClient) {\n  const { data, error } = await supabase.rpc("qeo_market_daily_integrity_report")\n  if (error) throw new Error(`Load Daily integrity report failed: ${error.message}`)\n  return (data || []) as IntegrityReportRow[]\n}\n'''
          new = '''async function loadIntegrityReport(supabase: SupabaseClient, tickers: string[]) {\n  const { data, error } = await supabase.rpc("qeo_market_daily_integrity_report_scoped", { p_tickers: tickers })\n  if (error) throw new Error(`Load scoped Daily integrity report failed: ${error.message}`)\n  return (data || []) as IntegrityReportRow[]\n}\n'''
          assert text.count(old) == 1
          text = text.replace(old, new)
          text = text.replace('loadIntegrityReport(supabase),\n    loadUnclassifiedZeroDates', 'loadIntegrityReport(supabase, tickers),\n    loadUnclassifiedZeroDates')
          text = text.replace('const afterRows = await loadIntegrityReport(supabase)', 'const afterRows = await loadIntegrityReport(supabase, tickers)')
          path.write_text(text)
          PY

          python <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          manifest_path = Path('supabase/migration-equivalence.json')
          data = json.loads(manifest_path.read_text())
          name = 'qeo106_scoped_daily_integrity_report'
          row = {
              'logicalName': name,
              'repositoryVersion': '20260906003000',
              'productionVersion': '20260906002919',
              'state': 'MAPPED',
              'evidence': 'qeo106-production-scoped-integrity-rpc-and-vic-vcb-parity-smoke',
              'rationale': 'Production repair batches exposed statement_timeout because the route recomputed the full canonical-200 integrity report twice. The reviewed scoped equivalent was replay-verified locally, applied as production version 20260906002919, and returned VIC/VCB PASS with exact canonical counts before runtime cutover.'
          }
          existing = next((item for item in data['migrations'] if item['logicalName'] == name), None)
          if existing:
              existing.update(row)
          else:
              data['migrations'].append(row)
          manifest_path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n')

          ledger_path = Path('docs/db/evidence/production-migration-ledger-2026-09-05.json')
          ledger = json.loads(ledger_path.read_text())
          ledger['capturedAt'] = datetime.now(timezone.utc).isoformat().replace('+00:00', 'Z')
          prod = {'version': '20260906002919', 'name': name}
          if not any(str(item['version']) == prod['version'] and item['name'] == name for item in ledger['migrations']):
              ledger['migrations'].append(prod)
              ledger['migrations'].sort(key=lambda item: str(item['version']))
          ledger_path.write_text(json.dumps(ledger, indent=2, ensure_ascii=False) + '\n')
          PY

      - name: Start clean local Supabase
        run: supabase start

      - name: Replay migrations from zero
        run: pnpm db:replay:verify

      - name: Generate canonical Database types
        run: pnpm db:types:generate

      - name: Verify GREEN, drift, types and TypeScript
        run: |
          node --test tests/qeo-100-market-data.cases.ts
          pnpm db:types:verify
          node --test tests/db-migration-drift.test.ts
          pnpm typecheck

      - name: Commit fix and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/qeo106-scoped-integrity-tdd.yml
          git config user.name "qeoindex-db-drift-bot"
          git config user.email "actions@users.noreply.github.com"
          git add modules/market/history/daily-integrity.ts \
            supabase/migrations/20260906003000_qeo106_scoped_daily_integrity_report.sql \
            supabase/migration-equivalence.json \
            docs/db/evidence/production-migration-ledger-2026-09-05.json \
            modules/shared/supabase/database.types.ts \
            tests/qeo-100-market-data.cases.ts \
            .github/workflows/qeo106-scoped-integrity-tdd.yml
          git commit -m "fix(QEO-106): scope Daily integrity repair audits"
          git push origin HEAD:fix/qeo-106-scoped-integrity-report

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
