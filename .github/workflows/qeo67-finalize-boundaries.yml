name: QEO-67 Finalize Boundaries

on:
  push:
    branches:
      - qeo-65-67-cleanup-modules

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Apply final public-boundary refactor
        run: node scripts/qeo67-finalize-boundaries.mjs
      - name: Verify EOD RED-to-GREEN contract
        run: pnpm test:eod
      - name: Verify current contracts
        run: pnpm test:current
      - name: Verify module-aware lint
        run: pnpm lint:touched
      - name: Verify TypeScript
        run: pnpm typecheck
      - name: Verify production build
        run: pnpm build
      - name: Commit verified boundary refactor
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modules/ai-council/market-synthesis-context.ts \
            modules/ai-council/operations.ts \
            modules/eod/market-synthesis-step.ts \
            modules/eod/index.ts \
            workflows/qeoindex-eod-pipeline.ts \
            workflows/qeoindex-eod-retry.ts
          git commit -m "refactor(QEO-67): enforce public EOD boundary"
          git push origin HEAD:qeo-65-67-cleanup-modules
