name: QEO-186 GREEN

on:
  push:
    branches:
      - 'tvq9612/qeo-186-market-insightsp0-vnindex-contributors-top-pullers-draggers'
    paths:
      - '.github/workflows/qeo186-green.yml'

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: tvq9612/qeo-186-market-insightsp0-vnindex-contributors-top-pullers-draggers
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Wire QEO-186 contributor UI
        run: node .github/qeo186-green.mjs
      - name: Commit production wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/insights/market-close-dashboard.tsx
          git commit -m "feat(QEO-186): render VNINDEX contributor concentration"
          git push
      - name: Confirm focused GREEN contracts
        run: node --test tests/market-insight-ui-performance.test.ts
      - name: Remove temporary helper files
        if: always()
        run: |
          git rm -f .github/qeo186-green.mjs .github/workflows/qeo186-green.yml
          git commit -m "chore(QEO-186): remove GREEN helper"
          git push
