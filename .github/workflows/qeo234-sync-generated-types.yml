name: QEO-234 Sync Generated Types

on:
  push:
    branches:
      - tvq9612/qeo-234-db-capacity-cut-over-compact-daily-provenance-reclaim
    paths:
      - ".github/workflows/qeo234-sync-generated-types.yml"

permissions:
  actions: read
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tvq9612/qeo-234-db-capacity-cut-over-compact-daily-provenance-reclaim
          fetch-depth: 0
      - name: Download exact DB Drift candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/qeo234-types
          mkdir -p /tmp/qeo234-types
          gh run download 34977098968 --repo tvqqq/qeoindex --name qeo23-database-types --dir /tmp/qeo234-types
          test -f /tmp/qeo234-types/database.types.ts
      - name: Verify candidate digest
        run: |
          echo "0bbe317143705e2b74abd85f3d694a47e8b71cf8f9febd3be7ed24f43a7d78a0  /tmp/qeo234-types/database.types.ts" | sha256sum --check --strict
      - name: Commit exact generated candidate
        run: |
          cp /tmp/qeo234-types/database.types.ts modules/shared/supabase/database.types.ts
          git diff --exit-code -- modules/shared/supabase/database.types.ts && { echo "Generated types already current"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modules/shared/supabase/database.types.ts
          git commit -m "chore(QEO-234): refresh compact Daily provenance schema types"
          git push origin HEAD:tvq9612/qeo-234-db-capacity-cut-over-compact-daily-provenance-reclaim
