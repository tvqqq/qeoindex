name: AI Council morning refactor bootstrap

on:
  push:
    branches:
      - feat/ai-council-first-class-context

permissions:
  contents: write

jobs:
  apply-refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ai-council-first-class-context
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply deterministic source refactor
        run: python scripts/ai-council-morning-refactor.py
      - name: Remove bootstrap files
        run: |
          git rm .github/workflows/ai-council-morning-refactor-bootstrap.yml
          git rm scripts/ai-council-morning-refactor.py
      - name: Commit refactor
        run: |
          git config user.name "Quyen Tat"
          git config user.email "tvq9612@gmail.com"
          git add -A
          git commit -m "feat(ai-council): promote first-class evidence context"
          git push origin HEAD:feat/ai-council-first-class-context
