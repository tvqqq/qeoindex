name: QEO-139 Task 4 Patch

on:
  push:
    branches:
      - "tvq9612/qeo-139-portfolio-riskp3-proper-trade-size-calculator-stop-first"
    paths:
      - ".github/workflows/qeo139-task4-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "tvq9612/qeo-139-portfolio-riskp3-proper-trade-size-calculator-stop-first"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply Task 4 Account Equity integration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, got {count}")
              return text.replace(old, new, 1)

          page_path = Path("components/portfolio/portfolio-page.tsx")
          page = page_path.read_text()
          page = replace_once(
              page,
              '''  // ── Compute positions from transactions ──\n  const { positions } = useMemo(() => {\n    return computePortfolioPositions(transactions)\n  }, [transactions])\n''',
              '''  // ── Compute portfolio-level accounting summary from all transactions ──\n  const portfolioSummary = useMemo(() => {\n    return computePortfolioPositions(transactions)\n  }, [transactions])\n  const { positions, totalRealizedPnl } = portfolioSummary\n''',
              "portfolio summary",
          )
          page = replace_once(
              page,
              '''              positions={positions}\n              currentPrices={currentPrices}\n''',
              '''              positions={positions}\n              currentPrices={currentPrices}\n              totalRealizedPnlKvnd={totalRealizedPnl}\n''',
              "allocation realized pnl prop",
          )
          page_path.write_text(page)

          allocation_path = Path("components/portfolio/portfolio-capital-allocation.tsx")
          allocation = allocation_path.read_text()
          allocation = replace_once(
              allocation,
              'import { ShieldCheck, PieChart, ArrowRight, TrendingDown, DollarSign } from "lucide-react"',
              'import { ShieldCheck, PieChart, ArrowRight, DollarSign } from "lucide-react"',
              "unused icon import",
          )
          allocation = replace_once(
              allocation,
              '''import { PortfolioPosition } from "@/modules/portfolio/pnl"\nimport { PortfolioMeta } from "@/components/portfolio/portfolio-selector"\nimport { cn } from "@/modules/shared/ui/cn"\n''',
              '''import type { PortfolioPosition } from "@/modules/portfolio/pnl"\nimport type { PortfolioMeta } from "@/components/portfolio/portfolio-selector"\nimport { buildAccountEquityContext } from "@/modules/portfolio/risk-sizing/calculator"\nimport { kvndToVnd } from "@/modules/portfolio/risk-sizing/units"\nimport { cn } from "@/modules/shared/ui/cn"\n''',
              "risk sizing imports",
          )
          allocation = replace_once(
              allocation,
              '''  positions: PortfolioPosition[]\n  currentPrices: Record<string, number>\n''',
              '''  positions: PortfolioPosition[]\n  currentPrices: Record<string, number>\n  totalRealizedPnlKvnd: number\n''',
              "allocation props",
          )
          allocation = replace_once(
              allocation,
              '''  positions,\n  currentPrices,\n}: PortfolioCapitalAllocationProps) {''',
              '''  positions,\n  currentPrices,\n  totalRealizedPnlKvnd,\n}: PortfolioCapitalAllocationProps) {''',
              "allocation destructuring",
          )
          allocation = replace_once(
              allocation,
              '''  // Total realized P&L (k₫ * 1000 = VNĐ)\n  const totalRealizedPnl = useMemo(() => {\n    return positions.reduce((sum, p) => sum + p.realizedPnl * 1000, 0)\n  }, [positions])\n\n''',
              '''  // Portfolio-level realized P&L includes fully closed tickers; do not derive it from open positions.\n  const totalRealizedPnlVnd = kvndToVnd(totalRealizedPnlKvnd)\n\n  const accountEquityContext = useMemo(() => buildAccountEquityContext({\n    initialCapitalVnd: capital,\n    totalRealizedPnlKvnd,\n    positions: positions.map(({ ticker, openQty, avgCost }) => ({ ticker, openQty, avgCost })),\n    currentPricesKvnd: currentPrices,\n  }), [capital, totalRealizedPnlKvnd, positions, currentPrices])\n\n''',
              "portfolio realized pnl reduction",
          )
          allocation = allocation.replace("totalRealizedPnl", "totalRealizedPnlVnd")
          # The global rename also changed the prop identifier; restore its canonical kVND contract name.
          allocation = allocation.replace("totalRealizedPnlVndKvnd", "totalRealizedPnlKvnd")
          allocation = allocation.replace("kvndToVnd(totalRealizedPnlVndKvnd)", "kvndToVnd(totalRealizedPnlKvnd)")
          allocation = allocation.replace("    totalRealizedPnlVndKvnd,", "    totalRealizedPnlKvnd,")
          allocation = allocation.replace("[capital, totalRealizedPnlVndKvnd, positions, currentPrices]", "[capital, totalRealizedPnlKvnd, positions, currentPrices]")
          allocation = replace_once(
              allocation,
              "{formatShortVND(capital)}",
              "{formatShortVND(accountEquityContext.valueVnd)}",
              "account equity banner",
          )
          allocation_path.write_text(allocation)

          sizing_path = Path("tests/portfolio/qeo139-risk-sizing.test.ts")
          sizing = sizing_path.read_text()
          if 'from "../../modules/portfolio/pnl.ts"' not in sizing:
              sizing = sizing.replace(
                  'import test from "node:test"\n\n',
                  'import test from "node:test"\n\nimport { computePortfolioPositions, type RawTransaction } from "../../modules/portfolio/pnl.ts"\n',
                  1,
              )
          marker = 'test("Account Equity preserves realized P&L from a fully closed ticker",'
          if marker not in sizing:
              sizing += '''\n\ntest("Account Equity preserves realized P&L from a fully closed ticker", () => {\n  const transactions: RawTransaction[] = [\n    { id: "fpt-buy", ticker: "FPT", action: "buy", quantity: 1000, price: 100, fee: 0, transaction_date: "2026-09-01", tags: [] },\n    { id: "fpt-sell", ticker: "FPT", action: "sell", quantity: 1000, price: 110, fee: 0, transaction_date: "2026-09-02", tags: [] },\n    { id: "vic-buy", ticker: "VIC", action: "buy", quantity: 100, price: 80, fee: 0, transaction_date: "2026-09-03", tags: [] },\n  ]\n  const summary = computePortfolioPositions(transactions)\n  assert.equal(summary.positions.length, 1)\n  assert.equal(summary.positions[0].ticker, "VIC")\n  assert.equal(summary.totalRealizedPnl, 10_000)\n\n  const context = buildAccountEquityContext({\n    initialCapitalVnd: 500_000_000,\n    totalRealizedPnlKvnd: summary.totalRealizedPnl,\n    positions: summary.positions,\n    currentPricesKvnd: { VIC: 85 },\n  })\n  assert.equal(context.valueVnd, 510_500_000)\n})\n'''
          sizing_path.write_text(sizing)
          PY
      - name: Task 4 targeted tests
        run: node --test tests/portfolio/qeo139-account-equity-integration.test.ts tests/portfolio/qeo139-risk-sizing.test.ts tests/portfolio-pnl.test.ts
      - name: TypeScript
        run: pnpm typecheck
      - name: Commit green implementation
        shell: bash
        run: |
          git config user.name "qeoindex-ci"
          git config user.email "qeoindex-ci@users.noreply.github.com"
          git add components/portfolio/portfolio-page.tsx components/portfolio/portfolio-capital-allocation.tsx tests/portfolio/qeo139-risk-sizing.test.ts
          git diff --cached --check
          git commit -m "refactor(qeo-139): use portfolio-level Account Equity context"
          git push origin HEAD:tvq9612/qeo-139-portfolio-riskp3-proper-trade-size-calculator-stop-first
