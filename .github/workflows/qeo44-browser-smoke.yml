name: QEO-44 Browser Smoke

on:
  push:
    branches:
      - tvq9612/qeo-44-portfolio-perf-loading-state

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Install ephemeral browser harness
        run: |
          pnpm add -D playwright@1.51.1 --lockfile=false
          pnpm exec playwright install --with-deps chromium
      - name: Patch authenticated test harness in runner only
        run: |
          python3 <<'PY'
          from pathlib import Path

          layout = Path('app/layout.tsx')
          text = layout.read_text()
          old = "  const serverSessionAuthenticated = Boolean(await getServerAuthContext())"
          new = "  const serverSessionAuthenticated = process.env.QEO44_BROWSER_SMOKE === '1' ? true : Boolean(await getServerAuthContext())"
          assert old in text
          layout.write_text(text.replace(old, new, 1))

          gate = Path('components/auth/app-auth-gate.tsx')
          text = gate.read_text()
          old = "  useEffect(() => {\n    const supabase = getSupabaseBrowserClient()"
          new = "  useEffect(() => {\n    if (serverSessionPresent && process.env.NEXT_PUBLIC_QEO44_BROWSER_SMOKE === '1') return\n\n    const supabase = getSupabaseBrowserClient()"
          assert old in text
          gate.write_text(text.replace(old, new, 1))
          PY
      - name: Build exact feature source with test-only auth harness
        env:
          QEO44_BROWSER_SMOKE: "1"
          NEXT_PUBLIC_QEO44_BROWSER_SMOKE: "1"
        run: pnpm exec next build
      - name: Start app
        env:
          QEO44_BROWSER_SMOKE: "1"
          NEXT_PUBLIC_QEO44_BROWSER_SMOKE: "1"
        run: |
          pnpm exec next start -p 3000 > /tmp/qeo44-next.log 2>&1 &
          echo $! > /tmp/qeo44-next.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/portfolio >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/qeo44-next.log
          exit 1
      - name: Desktop + narrow viewport smoke
        run: |
          cat > /tmp/qeo44-smoke.mjs <<'EOF'
          import { chromium } from 'playwright'
          import assert from 'node:assert/strict'

          const portfolios = [
            { id: 'a', name: 'Tăng trưởng A', description: null, initial_capital: 500000000, is_default: true, sort_order: 0 },
            { id: 'b', name: 'Phòng thủ B', description: null, initial_capital: 300000000, is_default: false, sort_order: 1 },
          ]
          const tx = (id, ticker, price) => ({
            id, ticker, action: 'buy', quantity: 100, price, fee: 0,
            transaction_date: '2026-09-02', tags: [], setup_tags: [], mistake_tags: [],
            target_price_1: null, target_price_2: null, target_price_3: null,
            stop_loss_1: null, stop_loss_2: null, stop_loss_3: null,
          })
          const payloads = {
            a: [tx('a-1', 'MSN', 70)],
            b: [tx('b-1', 'FPT', 100)],
          }
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms))

          async function runViewport(browser, viewport, label) {
            const context = await browser.newContext({ viewport })
            const page = await context.newPage()
            let aRequests = 0
            let bRequests = 0

            await page.route('**/api/**', async (route) => {
              const request = route.request()
              const url = new URL(request.url())
              const path = url.pathname

              if (path === '/api/portfolio' && request.method() === 'GET') {
                await route.fulfill({ status: 200, contentType: 'application/json', body: JSON.stringify({ ok: true, portfolios }) })
                return
              }
              if (path === '/api/watchlist') {
                await route.fulfill({ status: 200, contentType: 'application/json', body: JSON.stringify({ ok: true, watchlists: [], items: [] }) })
                return
              }
              const match = path.match(/^\/api\/portfolio\/(a|b)\/transactions$/)
              if (match && request.method() === 'GET') {
                const pid = match[1]
                if (pid === 'a') {
                  aRequests += 1
                  await sleep(aRequests === 1 ? 500 : 100)
                } else {
                  bRequests += 1
                  await sleep(700)
                }
                await route.fulfill({ status: 200, contentType: 'application/json', body: JSON.stringify({ ok: true, transactions: payloads[pid] }) })
                return
              }
              if (path === '/api/market/intraday') {
                await route.fulfill({ status: 200, contentType: 'application/json', body: JSON.stringify({ histories: { MSN: { price: 71 }, FPT: { price: 101 } } }) })
                return
              }
              await route.fulfill({ status: 200, contentType: 'application/json', body: JSON.stringify({ ok: true }) })
            })

            await page.goto('http://127.0.0.1:3000/portfolio', { waitUntil: 'domcontentloaded' })
            await page.getByText('Tăng trưởng A', { exact: true }).first().waitFor({ state: 'visible' })

            // Portfolio metadata is visible while transaction payload is intentionally delayed.
            // Summary must remain in loading skeleton instead of flashing empty NAV/positions.
            assert.ok(await page.locator('.animate-pulse').count() >= 4, `${label}: expected loading skeleton after portfolio metadata`)
            assert.equal(await page.getByText('Tổng tài sản (NAV)', { exact: true }).count(), 0, `${label}: empty summary flashed before transactions resolved`)

            await page.getByText('MSN', { exact: true }).first().waitFor({ state: 'visible' })
            assert.equal(await page.getByText('FPT', { exact: true }).count(), 0, `${label}: wrong portfolio ticker visible after initial load`)

            // Explicit refresh must enter loading immediately from the event handler.
            await page.getByRole('button', { name: /Làm mới/i }).click()
            assert.ok(await page.locator('.animate-pulse').count() >= 4, `${label}: refresh did not enter immediate loading state`)
            await page.getByText('MSN', { exact: true }).first().waitFor({ state: 'visible' })

            // Rapid A -> B -> A. B is deliberately slower than the second A response.
            await page.getByRole('button', { name: /Tăng trưởng A/ }).click()
            await page.getByText('Phòng thủ B', { exact: true }).click()
            assert.equal(await page.getByText('MSN', { exact: true }).count(), 0, `${label}: stale A ticker remained visible under B`)
            assert.ok(await page.locator('.animate-pulse').count() >= 4, `${label}: switching to B did not show loading skeleton`)

            await page.getByRole('button', { name: /Phòng thủ B/ }).click()
            await page.getByText('Tăng trưởng A', { exact: true }).last().click()
            await page.getByText('MSN', { exact: true }).first().waitFor({ state: 'visible' })
            await sleep(850)
            assert.equal(await page.getByText('FPT', { exact: true }).count(), 0, `${label}: stale B response overwrote active A data`)
            assert.ok(await page.getByText('MSN', { exact: true }).count() >= 1, `${label}: active A data disappeared after stale B settled`)

            console.log(JSON.stringify({ label, viewport, aRequests, bRequests, result: 'PASS' }))
            await context.close()
          }

          const browser = await chromium.launch({ headless: true })
          try {
            await runViewport(browser, { width: 1440, height: 1000 }, 'desktop')
            await runViewport(browser, { width: 390, height: 844 }, 'narrow')
          } finally {
            await browser.close()
          }
          EOF
          node /tmp/qeo44-smoke.mjs
      - name: Dump app log on failure
        if: failure()
        run: cat /tmp/qeo44-next.log || true
