name: QEO-65 Regenerate DB Types

on:
  push:
    branches:
      - qeo-65-postdeploy-migration-reconcile
    paths:
      - ".github/workflows/qeo65-regenerate-types.yml"

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qeo-65-postdeploy-migration-reconcile
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0
      - run: pnpm install --frozen-lockfile
      - name: Start local Supabase
        run: supabase start
      - name: Replay migrations from zero
        run: pnpm db:replay:verify
      - name: Regenerate canonical Database types
        run: pnpm db:types:generate
      - name: Commit regenerated types
        run: |
          if git diff --quiet -- modules/shared/supabase/database.types.ts; then
            echo "Generated Database types already match canonical replay."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modules/shared/supabase/database.types.ts
          git commit -m "fix(QEO-65): regenerate canonical Supabase types"
          git push origin HEAD:qeo-65-postdeploy-migration-reconcile
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
