name: QEO-67 Final Audit

on:
  push:
    branches:
      - qeo-65-67-cleanup-modules
  workflow_dispatch:

jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit QEO-67 architecture boundaries
        shell: bash
        run: |
          set -euo pipefail
          echo '=== historical naming references ==='
          rg -n "live-market-board-v2|LiveMarketBoardV2|legacy|wyckoff-v2|EOD-v3" app components modules workflows tests package.json || true
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const productionRoots = ['app', 'components', 'modules', 'workflows', 'lib'];
          const files = [];
          function walk(root) {
            if (!fs.existsSync(root)) return;
            for (const entry of fs.readdirSync(root, { withFileTypes: true })) {
              const full = path.join(root, entry.name);
              if (entry.isDirectory()) walk(full);
              else if (/\.(?:ts|tsx|js|mjs)$/.test(entry.name)) files.push(full.replaceAll('\\', '/'));
            }
          }
          productionRoots.forEach(walk);

          const violations = [];
          const namingToken = /(^|[\/_.-])(legacy|v2|v3)(?=$|[\/_.-])/i;
          const moduleImport = /(?:from\s+|import\s*\(\s*)['"]@\/modules\/([^/'"]+)(?:\/[^'"]+)?['"]/g;

          for (const file of files) {
            if (namingToken.test(file)) violations.push(`ACCIDENTAL_VERSIONED_PATH ${file}`);
            if (/^lib\/[^/]+\.(?:ts|tsx)$/.test(file)) violations.push(`ROOT_LIB_SOURCE ${file}`);

            const text = fs.readFileSync(file, 'utf8');
            const consumer = file.startsWith('modules/') ? file.split('/')[1] : null;
            for (const match of text.matchAll(moduleImport)) {
              const provider = match[1];
              if (consumer && consumer !== 'eod' && provider === 'eod') {
                violations.push(`LOWER_LEVEL_TO_EOD ${file}: ${match[0]}`);
              }
            }
            if (consumer && /(?:from\s+|import\s*\(\s*)['"]@\/workflows(?:\/|['"])/.test(text)) {
              violations.push(`MODULE_TO_WORKFLOW ${file}`);
            }
            if (/(?:from\s+|import\s*\(\s*)['"]@\/lib\//.test(text)) {
              violations.push(`ACTIVE_LIB_IMPORT ${file}`);
            }
          }

          for (const required of [
            'modules/eod/index.ts',
            'modules/eod/README.md',
            'modules/market/README.md',
            'modules/market/universe/index.ts',
            'modules/wyckoff/README.md',
            'modules/ai-council/README.md',
          ]) {
            if (!fs.existsSync(required)) violations.push(`MISSING_PUBLIC_CONTRACT ${required}`);
          }

          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lintTouched = packageJson.scripts?.['lint:touched'] || '';
          console.log(`lint:touched=${lintTouched}`);
          if (!/\bapp\b/.test(lintTouched) || !/\bcomponents\b/.test(lintTouched) || !/\bmodules\b/.test(lintTouched) || !/\bworkflows\b/.test(lintTouched) || /lib\/[\w./-]+\.tsx?/.test(lintTouched)) {
            violations.push(`LINT_TARGET_NOT_DIRECTORY_BASED ${lintTouched}`);
          }

          const routeFiles = files.filter((file) => file.startsWith('app/') && /\/route\.ts$/.test(file));
          const largeRoutes = routeFiles
            .map((file) => ({file, lines: fs.readFileSync(file, 'utf8').split('\n').length}))
            .filter(({lines}) => lines > 250)
            .sort((a, b) => b.lines - a.lines);
          console.log(`QEO67_ROUTE_COUNT ${routeFiles.length}`);
          console.log(`QEO67_LARGE_ROUTES ${JSON.stringify(largeRoutes)}`);

          if (violations.length) {
            console.error(`QEO67_AUDIT_FAIL count=${violations.length}`);
            for (const violation of violations) console.error(violation);
            process.exit(1);
          }
          console.log('QEO67_AUDIT_PASS');
          NODE

      - name: Full QEO-67 verification
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile
          pnpm test:current
          pnpm lint:touched
          pnpm typecheck
          pnpm build
