name: DB Recovery Rehearsal

on:
  pull_request:
    paths:
      - "scripts/db/rehearse-destructive-recovery.sh"
      - "scripts/db/recovery/**"
      - "tests/db-recovery-rehearsal.test.ts"
      - ".github/workflows/db-recovery-rehearsal.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --test tests/db-recovery-rehearsal.test.ts

  destructive-recovery:
    needs: static-contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Rehearsal pass 1
        env:
          QEO_RECOVERY_ARTIFACT_DIR: .tmp/qeo-db-recovery/pass-1
        run: bash scripts/db/rehearse-destructive-recovery.sh
      - name: Rehearsal pass 2
        env:
          QEO_RECOVERY_ARTIFACT_DIR: .tmp/qeo-db-recovery/pass-2
        run: bash scripts/db/rehearse-destructive-recovery.sh
      - name: Upload recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qeo-26-db-recovery-evidence-${{ github.run_id }}
          path: .tmp/qeo-db-recovery/
          if-no-files-found: warn
          retention-days: 14
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup || true
