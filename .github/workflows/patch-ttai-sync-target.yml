name: Patch TTAI sync target support

on:
  push:
    branches:
      - feat/insights-ttai-history-dashboard

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/insights-ttai-history-dashboard
      - name: Add targeted smoke/backfill support
        shell: python
        run: |
          from pathlib import Path
          p = Path('supabase/functions/kfsp-ttai-history-sync/index.ts')
          s = p.read_text()
          needle = '''  if (!expectedSecret) return response({ ok: false, error: "SYNC_SECRET_NOT_CONFIGURED" }, 503)\n  if (!constantTimeEqual(expectedSecret, providedSecret)) return response({ ok: false, error: "UNAUTHORIZED" }, 401)\n\n  const supabaseUrl'''
          replacement = '''  if (!expectedSecret) return response({ ok: false, error: "SYNC_SECRET_NOT_CONFIGURED" }, 503)\n  if (!constantTimeEqual(expectedSecret, providedSecret)) return response({ ok: false, error: "UNAUTHORIZED" }, 401)\n\n  const requestBody = asObject(await req.json().catch(() => null))\n  const requestedTickers = new Set(\n    (Array.isArray(requestBody?.tickers) ? requestBody.tickers : [])\n      .map((value) => String(value || "").trim().toUpperCase())\n      .filter((ticker) => /^[A-Z0-9]{2,12}$/.test(ticker)),\n  )\n  const forceRequested = requestBody?.force === true && requestedTickers.size > 0\n\n  const supabaseUrl'''
          if needle not in s:
              raise SystemExit('auth insertion point missing')
          s = s.replace(needle, replacement, 1)
          old = '''    const candidates = ratings\n      .map((row) => ({ ...row, financialPeriod: currentFinancialPeriod(row.kfsp_metrics) }))\n      .filter((row) => row.financialPeriod && state.get(row.ticker) !== row.financialPeriod)\n      .sort((left, right) => Number(right.is_top100) - Number(left.is_top100) || left.ticker.localeCompare(right.ticker))\n      .slice(0, maxPerRun)'''
          new = '''    const candidates = ratings\n      .map((row) => ({ ...row, financialPeriod: currentFinancialPeriod(row.kfsp_metrics) }))\n      .filter((row) => {\n        if (!row.financialPeriod) return false\n        if (requestedTickers.size > 0 && !requestedTickers.has(row.ticker)) return false\n        return forceRequested || state.get(row.ticker) !== row.financialPeriod\n      })\n      .sort((left, right) => Number(right.is_top100) - Number(left.is_top100) || left.ticker.localeCompare(right.ticker))\n      .slice(0, requestedTickers.size > 0 ? Math.min(50, requestedTickers.size) : maxPerRun)'''
          if old not in s:
              raise SystemExit('candidate block missing')
          s = s.replace(old, new, 1)
          p.write_text(s)
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/kfsp-ttai-history-sync/index.ts
          git commit -m "feat(insights): support targeted TTAI history sync"
          git push origin HEAD:feat/insights-ttai-history-dashboard
