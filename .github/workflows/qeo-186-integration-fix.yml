name: QEO-186 Integration Fix

on:
  push:
    branches:
      - tvq9612/qeo-186-producer-fix

permissions:
  contents: write

jobs:
  patch-normalizer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename contributor VNINDEX binding
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('supabase/functions/_shared/market-close-normalizer-base.ts')
          text = path.read_text()
          replacements = {
              '  const vnindex = providerIndexes.find((index) => index.index_code === "VNINDEX")': '  const contributorVnindex = providerIndexes.find((index) => index.index_code === "VNINDEX")',
              '    vnindexValue: vnindex?.value ?? null,': '    vnindexValue: contributorVnindex?.value ?? null,',
              '    vnindexChange: vnindex?.change ?? null,': '    vnindexChange: contributorVnindex?.change ?? null,',
              '    advances: vnindex?.advances ?? 0,': '    advances: contributorVnindex?.advances ?? 0,',
              '    declines: vnindex?.declines ?? 0,': '    declines: contributorVnindex?.declines ?? 0,',
              '    unchanged: vnindex?.unchanged ?? 0,': '    unchanged: contributorVnindex?.unchanged ?? 0,',
          }
          changed = False
          for old, new in replacements.items():
              if old in text:
                  text = text.replace(old, new, 1)
                  changed = True
              elif new not in text:
                  raise SystemExit(f'QEO-186 integration line missing: {old}')
          if changed:
              path.write_text(text)
          PY
      - name: Commit integration fix if needed
        run: |
          if git diff --quiet; then
            echo "No patch needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/_shared/market-close-normalizer-base.ts
          git commit -m "fix(QEO-186): avoid duplicate VNINDEX binding"
          git push origin HEAD:${GITHUB_REF_NAME}
