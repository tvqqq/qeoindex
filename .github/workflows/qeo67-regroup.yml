name: QEO-67 Domain Regroup

on:
  push:
    branches:
      - qeo-65-67-cleanup-modules

permissions:
  contents: write

jobs:
  regroup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply domain regroup codemod
        run: node scripts/qeo67-regroup.mjs
      - name: Verify test manifest and current contracts
        run: pnpm test:current
      - name: Verify module-aware lint
        run: pnpm lint:touched
      - name: Verify TypeScript
        run: pnpm typecheck
      - name: Verify production build
        run: pnpm build
      - name: Commit verified module regroup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(QEO-67): regroup surviving code by domain"
          git push origin HEAD:qeo-65-67-cleanup-modules
